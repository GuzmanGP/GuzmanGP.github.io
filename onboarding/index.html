/* Cuaderno clínico — el sistema visual del circuito.
 *
 * Papel cálido en vez de blanco frío, serif para el texto largo y sans para lo que se
 * pulsa, y dos acentos con trabajos distintos: el verde informa, el terracota aparece
 * SOLO donde se cobra. Que el ojo aprenda dónde empieza lo que cuesta dinero es lo que
 * hace que ninguna pantalla sorprenda al final.
 *
 * Los nombres de los tokens no cambian: el resto de la hoja de componentes lee de aquí,
 * así que cambiar el sistema es cambiar estos valores y nada más.
 */

:root {
  color-scheme: light;

  /* Superficies. Marfil: se lee media hora seguida y muchas veces de noche, y aleja el
     producto del formulario de laboratorio, que es de lo que huye quien llega aquí. */
  --color-bg: #faf7f2;
  --color-panel: #ffffff;
  --color-panel2: #f2ece2;
  --color-line: #e4dbcd;
  --color-line-strong: #cdc0ab;

  /* Texto */
  --color-ink: #1f1b16;
  --color-mut: #6b6459;
  --color-faint: #98907f;

  /* Acento clínico: lo que informa y no cuesta dinero */
  --color-accent: #0f5f52;
  --color-accent-soft: #e2efeb;
  --color-accent-deep: #0c4f44;

  /* Acento de decisión: el precio y el botón de contratar. Y nada más: si aparece donde
     no se cobra, está mal usado. */
  --color-decision: #b0532a;
  --color-decision-soft: #f8e9df;
  --color-decision-deep: #94441f;

  /* Estados semánticos: chips y bordes de aviso, nunca decoración */
  --color-mint: #2f6b4f;
  --color-sky: #4a6b86;
  --color-violet: #6b4a86;
  --color-amber: #96601a;
  --color-coral: #a33a30;

  /* Lo que se lee va en serif; lo que se pulsa, en sans. Las dos se sirven desde el
     propio dominio (next/font), no desde una CDN: son datos de salud y el navegador no
     tiene por qué contarle a nadie que alguien está leyendo esto. */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-serif);
  font-size: 1.02rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* Los títulos también son de leer. La interfaz —botones, chips, rótulos— se marca una a
   una en la hoja de componentes con var(--font-sans). */
h1,
h2,
h3 {
  font-family: var(--font-serif);
  letter-spacing: -0.012em;
}

button {
  font: inherit;
  font-family: var(--font-sans);
  color: inherit;
}

/* Se usa desde el móvil, muchas veces en una sala de espera. */
button,
[role='button'] {
  min-height: 44px;
}

a {
  color: var(--color-accent);
}

:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* ── Lienzo oscuro para los diagramas ───────────────────────────────────────
 * Igual que en el hub: los esquemas necesitan contraste alto y color saturado,
 * y eso se pierde sobre blanco. Los tokens se redefinen en local, así que las
 * láminas —que pintan con var(--apoyo-*)— recuperan su paleta sobre navy sin
 * tocar ni una línea de las figuras.
 */
.canvas-dark {
  --apoyo-tinta: #f5efe6;
  --apoyo-tenue: #b8ac99;
  --apoyo-linea: #3d3529;
  --apoyo-suave: #241f18;
  --apoyo-acento: #7fd4c1;
  --apoyo-alerta: #eaa08f;

  background: #14110d;
  border: 1px solid #2c261d;
  border-radius: 0.75rem;
  padding: 0.75rem;
  color: #f1f5f9;
}

/* Fuera del lienzo oscuro las láminas siguen valiendo, en la paleta clara. */
:root {
  --apoyo-tinta: var(--color-ink);
  --apoyo-tenue: var(--color-mut);
  --apoyo-linea: var(--color-line);
  --apoyo-suave: var(--color-panel2);
  --apoyo-acento: var(--color-accent);
  --apoyo-alerta: var(--color-coral);
}

/* ── Marcado didáctico ──────────────────────────────────────────────────────
 * Los resaltes de estudio del hub: lo que hay que retener se ve de un vistazo.
 */
.mark-key {
  background-color: color-mix(in srgb, var(--color-amber) 26%, white);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  border-radius: 4px;
  padding: 1px 4px;
  font-weight: 600;
  color: var(--color-ink);
}

.mark-alt {
  background-color: color-mix(in srgb, var(--color-sky) 34%, white);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  border-radius: 4px;
  padding: 1px 4px;
  font-weight: 600;
  color: var(--color-ink);
}

/* Sigla o término con definición detrás. */
.term {
  font-weight: 600;
  color: var(--color-ink);
  text-decoration: underline dotted color-mix(in srgb, var(--color-accent) 70%, transparent);
  text-underline-offset: 4px;
  cursor: help;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

/* Los componentes del circuito, con las piezas del hub: tarjeta, chip, eyebrow.
 * Los estados de sección van en chips de color —mint hecho, ámbar en curso, coral
 * parado, violeta sellado— porque es lo que se recuerda de un vistazo al volver al
 * mapa tres días después. */

.pagina {
  max-width: 68rem;
  margin: 0 auto;
  padding: 1.25rem 1rem 4rem;
}

.cabecera {
  border-bottom: 1px solid var(--color-line);
  padding-bottom: 0.9rem;
  margin-bottom: 1.5rem;
}

.titulo {
  font-size: 1.35rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.sub {
  margin: 0.3rem 0 0;
  font-size: 0.9rem;
  color: var(--color-mut);
}

.aviso {
  font-family: var(--font-sans);
  margin-top: 1.75rem;
  padding: 0.85rem 1rem;
  border-left: 2px solid var(--color-accent);
  background: var(--color-panel2);
  border-radius: 0 0.5rem 0.5rem 0;
  font-size: 0.8rem;
  color: var(--color-mut);
}

/* Etiqueta de sección del hub: minúscula alta, muy espaciada, en el acento. */
.rotulo {
  font-family: var(--font-sans);
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--color-accent);
  margin: 0 0 0.5rem;
}

.tarjeta {
  background: var(--color-panel);
  border: 1px solid var(--color-line);
  border-radius: 0.75rem;
  padding: 1.15rem 1.25rem;
  box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
}

/* ── Chips de estado ───────────────────────────────────────────────────────
 * Fondo al 10 % del color y texto saturado, como en el hub. El color no
 * decora: dice en qué punto está esa sección. */

.chip {
  font-family: var(--font-sans);
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 0.1rem 0.6rem;
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
}

.chipNeutro {
  background: var(--color-panel2);
  color: var(--color-mut);
}

.chipHecho {
  background: color-mix(in srgb, var(--color-mint) 10%, white);
  color: var(--color-mint);
}

.chipCurso {
  background: color-mix(in srgb, var(--color-amber) 10%, white);
  color: var(--color-amber);
}

.chipToca {
  background: color-mix(in srgb, var(--color-accent) 10%, white);
  color: var(--color-accent);
}

.chipDescartado {
  background: color-mix(in srgb, var(--color-sky) 10%, white);
  color: var(--color-sky);
}

.chipSello {
  background: color-mix(in srgb, var(--color-violet) 10%, white);
  color: var(--color-violet);
}

.chipAlerta {
  background: color-mix(in srgb, var(--color-coral) 10%, white);
  color: var(--color-coral);
}

/* ── El mapa ───────────────────────────────────────────────────────────────── */

.mapa {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.65rem;
  position: relative;
}

.mapa::before {
  content: '';
  position: absolute;
  left: 2.1rem;
  top: 2.4rem;
  bottom: 2.4rem;
  width: 2px;
  background: var(--color-line);
  border-radius: 2px;
}

@media (max-width: 30rem) {
  .mapa::before {
    display: none;
  }
}

.seccion {
  position: relative;
  z-index: 1;
  display: block;
  /* La tarjeta entera es un enlace, así que cualquier selección aquí es accidental: se
     arrastra un pixel al ir a pulsar y queda media tarjeta teñida del color de selección,
     que parece un fallo de la aplicación. Lo desplegable sí se puede seleccionar, más
     abajo: eso es texto para leer y copiar. */
  user-select: none;
  -webkit-user-select: none;
  padding: 0.9rem 1.1rem;
  border: 1px solid var(--color-line);
  border-radius: 0.75rem;
  background: var(--color-panel);
  box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.filaSeccion {
  display: flex;
  gap: 0.9rem;
  align-items: flex-start;
}

.entrar {
  font-family: var(--font-sans);
  flex: 0 0 auto;
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--color-accent);
  white-space: nowrap;
}

.seccion:hover:not(.bloqueada) .entrar {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.seccion:hover:not(.bloqueada) {
  border-color: var(--color-accent);
  box-shadow: 0 2px 8px rgb(15 95 82 / 0.1);
}

/* Una sección bloqueada se ve, con su motivo. Ocultarla dejaría a quien contesta
   sin saber cuánto queda, que es lo que convierte el circuito en un túnel. */
.bloqueada {
  background: var(--color-panel2);
  border-style: dashed;
  box-shadow: none;
}

.bloqueada .nombre,
.bloqueada .definicion {
  color: var(--color-mut);
}

.turnoCerrado {
  background: var(--color-panel2);
  border-color: var(--color-line);
  color: var(--color-mut);
}

/* Recuerda el sitio en la fila sin decir «todavía no», que suena a puerta en las
   narices y no informa de nada. */
.turnoRotulo {
  font-family: var(--font-sans);
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--color-mut);
}

/* La que toca: barra de acento a la izquierda, como el bloque activo del hub. */
.abierta {
  border-color: var(--color-accent);
  border-left: 3px solid var(--color-accent);
  box-shadow: 0 2px 10px rgb(15 95 82 / 0.12);
}

.turno {
  font-family: var(--font-sans);
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.82rem;
  font-weight: 700;
  border: 1px solid var(--color-line);
  background: var(--color-panel);
  color: var(--color-mut);
}

.turnoHecho {
  background: var(--color-mint);
  border-color: var(--color-mint);
  color: #fff;
}

.turnoToca {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: #fff;
}

.cuerpo {
  min-width: 0;
  flex: 1;
}

/* El enlace se estira sobre toda la tarjeta. El «Saber más» se queda por encima con su
   propio z-index, que si no quedaría tapado por el enlace. */
.nombreEnlace::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 0.75rem;
}

/* Arrastrar un enlace saca el fantasma del navegador con la URL. En una tarjeta que se
   pulsa, eso tampoco tiene sentido. */
.nombreEnlace {
  -webkit-user-drag: none;
}

.nombre,
.nombreEnlace {
  display: block;
  font-weight: 650;
  font-size: 1rem;
  color: var(--color-ink);
  text-decoration: none;
}

.nombreEnlace:hover {
  color: var(--color-accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* La definición va antes que el motivo del orden: primero qué es esto, después por
   qué está aquí. Al revés hay que saberse el área para entender su puesto. */
.definicion {
  margin: 0.3rem 0 0;
  font-size: 0.87rem;
  color: var(--color-ink);
}

.porque {
  font-family: var(--font-sans);
  display: block;
  font-size: 0.82rem;
  color: var(--color-mut);
  margin: 0.3rem 0 0;
}

.saberMas {
  font-family: var(--font-sans);
  position: relative;
  z-index: 2;
  min-height: 0;
  padding: 0.1rem 0.6rem;
  border: 1px solid color-mix(in srgb, var(--color-accent) 35%, white);
  border-radius: 999px;
  background: transparent;
  color: var(--color-accent);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
}

.saberMas:hover {
  background: color-mix(in srgb, var(--color-accent) 8%, white);
}

/* ── Lo que se despliega ──────────────────────────────────────────────────── */

.ampliacion {
  /* Aquí sí: es material de estudio y se copia. */
  user-select: text;
  -webkit-user-select: text;
  margin-top: 0.9rem;
  padding-top: 0.9rem;
  border-top: 1px solid var(--color-line);
}

.parrafo {
  font-size: 0.88rem;
  margin: 0 0 0.7rem;
}

.parrafo:last-child {
  margin-bottom: 0;
}

.etiquetas {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.6rem;
}

/* ── La cronología del subcircuito ───────────────────────────────────────── */

.cronologia {
  margin-bottom: 1.25rem;
}

.pasos {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin: 0;
  /* Sitio para el área táctil de cada paso, que sobresale del círculo sin deformarlo. */
  padding: 0.55rem 0 0.75rem;
  overflow-x: auto;
  scrollbar-width: none;
}

.pasos::-webkit-scrollbar {
  display: none;
}

/* El paso es un círculo de 1.75 rem, y el dedo tiene 44 px.
 *
 * Las dos cosas a la vez: el `min-height` táctil que aplica a todo botón deformaba este
 * en un óvalo —alto de 44 px sobre un ancho de 1.6 rem— que además se salía por arriba de
 * su fila. El área de pulsación la da ahora un pseudo-elemento absoluto, que no ocupa
 * sitio en el flujo y deja el dibujo redondo. */
.paso {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 1.75rem;
  height: 1.75rem;
  min-height: 0;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--color-line-strong);
  background: var(--color-panel);
  color: var(--color-mut);
  font-size: 0.74rem;
  font-weight: 600;
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  transition:
    border-color 0.15s,
    background 0.15s,
    color 0.15s,
    box-shadow 0.15s;
}

.paso::after {
  content: '';
  position: absolute;
  inset: -0.6rem;
  border-radius: 50%;
}

/* Los pasos a los que se puede volver son botones; los demás, texto. La diferencia se
   ve antes de pulsar: el cursor y el realce solo existen donde llevan a algún sitio. */
button.paso {
  cursor: pointer;
  transition: transform 0.12s ease;
}

button.paso:hover {
  transform: scale(1.14);
}

button.paso:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

span.paso {
  cursor: default;
}

.pasoHecho {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: #fff;
}

button.paso:hover:not(:disabled) {
  border-color: var(--color-accent);
  color: var(--color-accent);
}

button.pasoHecho:hover:not(:disabled) {
  color: #fff;
  background: var(--color-accent-deep);
  border-color: var(--color-accent-deep);
}

/* El que toca lleva anillo en vez de más relleno: se distingue de los hechos sin
   competir con ellos en peso. */
.pasoActual {
  background: var(--color-panel);
  border-color: var(--color-accent);
  border-width: 2px;
  color: var(--color-accent-deep);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 15%, white);
}

/* Saltada porque una respuesta cerró su línea. Se deja a la vista: que el número total
   baje sin explicación desconcierta más que un hueco marcado. */
.pasoOmitido {
  border-style: dashed;
  color: var(--color-mut);
  opacity: 0.6;
}

/* Lo que se está mirando. Va aparte del color de acento —que marca dónde iba el
   circuito— porque al repasar una respuesta de antes son dos pasos distintos, y verlos
   a la vez es lo que evita perder el sitio. */
.pasoMirando {
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-ink) 22%, transparent);
}

.volverAlPunto {
  margin-left: auto;
  padding: 0.15rem 0.55rem;
  border: 1px solid var(--color-accent);
  border-radius: 999px;
  background: transparent;
  color: var(--color-accent);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
}

.volverAlPunto:hover {
  background: color-mix(in srgb, var(--color-accent) 10%, transparent);
}

.pasoNombre {
  font-family: var(--font-sans);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 1.3rem;
  margin: 0;
  font-size: 0.82rem;
  color: var(--color-mut);
}

.pasoContador {
  font-family: var(--font-sans);
  font-weight: 600;
  color: var(--color-accent);
}

/* ── La sección: pregunta a la izquierda, razones a la derecha ─────────────── */

/* Una sola columna a todo el ancho de la página. Ni el carrusel ni el panel lateral: uno
   partía el razonamiento en diapositivas y el otro se leía en diagonal. */
.columna {
  display: grid;
  gap: 1.5rem;
}

.articulo {
  background: var(--color-panel);
  border: 1px solid var(--color-line);
  border-radius: 14px;
  padding: 1.5rem 1.75rem;
}

.articuloTitulo {
  margin: 2rem 0 0.75rem;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.35;
  color: var(--color-ink);
}

.articulo > .articuloTitulo:first-child {
  margin-top: 0;
}

/* El bloque ocupa la página; la LÍNEA no. Pasados unos 70 caracteres el ojo se pierde al
   saltar de renglón, y este texto se lee de arriba abajo, no se ojea. */
.articuloParrafo {
  margin: 0 0 0.9rem;
  max-width: 68ch;
  font-size: 0.97rem;
  line-height: 1.65;
  color: var(--color-ink);
}

.articuloParrafo:last-child {
  margin-bottom: 0;
}

/* La figura, cuando dibuja algo. Va dentro del texto y no en un carrusel aparte: se mira
   en el punto en el que hace falta. */
.figura {
  margin: 1.25rem 0 1.5rem;
  max-width: 42rem;
}

.figura svg {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
}

/* Pasar una secuencia de dibujo. Discreto: el texto manda, esto solo avanza el dibujo. */
.pasosFigura {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 0.6rem;
}

.pasosCuenta {
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--color-mut);
}

.figuraPie {
  margin: 0.6rem 0 0;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--color-mut);
}

/* Las ramas: qué pasa según lo que se conteste. Con el rótulo destacado se puede buscar
   la propia respuesta sin leerlas todas. */
.ramas {
  margin: 1rem 0;
  display: grid;
  gap: 0.75rem;
}

.rama {
  border-left: 3px solid var(--color-line);
  padding-left: 0.9rem;
}

.ramaRotulo {
  font-weight: 700;
  font-size: 0.93rem;
  color: var(--color-accent);
}

.ramaTexto {
  margin: 0.15rem 0 0;
  max-width: 68ch;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--color-ink);
}

/* La pregunta, al final del artículo. Se separa con el color del acento para que se vea
   de un vistazo dónde acaba lo que se lee y empieza lo que se contesta. */
.cuestionario {
  background: var(--color-panel);
  border: 1px solid var(--color-line);
  border-left: 4px solid var(--color-accent);
  border-radius: 14px;
  padding: 1.5rem 1.75rem;
}

.pregunta {
  font-size: 1.15rem;
  font-weight: 650;
  margin: 0 0 0.4rem;
  letter-spacing: -0.01em;
}

.ayuda {
  font-size: 0.87rem;
  color: var(--color-mut);
  margin: 0 0 1.1rem;
  padding-left: 0.7rem;
  border-left: 2px solid var(--color-line);
}



/* Dice qué hacer, y va donde se mira antes de elegir. Sin esta línea, la primera vez
   no está claro si hay que pulsar una o marcar varias. */
.instruccion {
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-accent);
  margin: 0 0 0.7rem;
}

.opciones {
  max-width: 52rem;
  display: grid;
  gap: 0.6rem;
}

/* Una opción es un control, no un párrafo con borde: marca a la izquierda, área grande
   y respuesta al pasar por encima. Cinco cajas de texto seguidas no se leen como algo
   que se pulsa. */
.opcion {
  font-family: var(--font-sans);
  width: 100%;
  text-align: left;
  padding: 0.55rem 0.75rem 0.55rem 0.55rem;
  border: 2px solid var(--color-line);
  border-radius: 0.7rem;
  background: var(--color-panel);
  transition:
    border-color 0.15s,
    background 0.15s,
    box-shadow 0.15s;
}

.opcion:hover {
  border-color: var(--color-accent);
}

.opcionFila {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
}

/* El círculo es el control de marcar, y por eso es un botón de verdad con su propia área
   táctil: 44 px, aunque el dibujo sea de 1.4 rem. */
.marca {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  background: none;
  cursor: pointer;
  border-radius: 50%;
  color: #fff;
}

.marca > span {
  width: 1.4rem;
  height: 1.4rem;
  border-radius: 50%;
  border: 2px solid var(--color-mut);
  display: grid;
  place-items: center;
  font-size: 0.8rem;
  font-weight: 700;
  transition:
    border-color 0.15s,
    background 0.15s;
}

.marca:hover:not(:disabled) > span {
  border-color: var(--color-accent);
  background: color-mix(in srgb, var(--color-accent) 12%, white);
}

.marca:disabled {
  opacity: 0.55;
  cursor: progress;
}

/* El cuerpo abre la consecuencia. No elige: elegir es del círculo. */
.opcionCuerpo {
  min-width: 0;
  flex: 1;
  display: block;
  text-align: left;
  padding: 0.35rem 0.25rem 0.35rem 0;
  border: 0;
  background: none;
  cursor: pointer;
  color: inherit;
}

.opcionCuerpo:disabled {
  cursor: default;
}

/* La pista de que hay algo debajo. Discreta: la respuesta manda, esto acompaña. */
.abrePista {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.35rem;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--color-accent);
}

.opcionCuerpo:hover .abrePista {
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Lo que define la respuesta y lo que abre, en la misma caja y bajo la respuesta que se
   está mirando: se lee donde se decide. */
.abreTexto {
  display: grid;
  gap: 0.5rem;
  margin: 0.15rem 0 0.35rem 50px;
  padding: 0.6rem 0.8rem;
  border-left: 2px solid var(--color-accent);
  background: var(--color-panel2);
  border-radius: 0 0.5rem 0.5rem 0;
  font-family: var(--font-sans);
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--color-ink);
}

.abreTexto p {
  margin: 0;
}

/* `display: grid` es de una hoja de autor y gana al `[hidden] { display: none }` del
   navegador, así que sin esto el panel se marcaba como oculto y seguía viéndose. Lo
   necesita cualquiera que despliegue con el atributo en vez de desmontando el nodo. */
.abreTexto[hidden] {
  display: none;
}

/* Qué cuenta como esa respuesta: la definición, y va primero porque decide si la casilla
   es la correcta. */
.abreAclara {
  color: var(--color-ink);
}

/* Y qué pasa si se contesta eso. Va debajo y en apagado: es la consecuencia, no la
   definición. */
.abreQue {
  color: var(--color-mut);
}

.abreAclara + .abreQue {
  padding-top: 0.5rem;
  border-top: 1px solid var(--color-line);
}

.opcionTexto {

/* Texto llano de un argumento: se usa en el mapa, en el informe y en la portada. */

 las que no tocan.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan d\u00f3nde est\u00e9s hoy", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si encajan varias, vale la que describe d\u00f3nde est\u00e1s hoy: ninguna cierra ninguna puerta.", "puntos": [], "imagenes": []}], "objetivo": {"que": "en qu\u00e9 punto del proceso est\u00e1s", "por_que": "No es lo mismo empezar de cero que llegar con resultados en la mano o estar ya embarazada: cambia por completo qu\u00e9 merece la pena mirar ahora y con cu\u00e1nta prisa.", "imprescindible": true}}, {"clave": "tri_margen", "texto": "\u00bfTienes ya fecha para una punci\u00f3n o una transferencia?", "tipo": "opcion", "ayuda": "La punci\u00f3n es cuando sacan los \u00f3vulos; la transferencia, cuando colocan el embri\u00f3n dentro del \u00fatero. Si tienes fecha para las dos, cuenta la m\u00e1s cercana.", "opciones": [{"texto": "S\u00ed, en menos de un mes", "valor": "S\u00ed, en menos de un mes", "aclara": "Contando desde hoy hasta el d\u00eda de la punci\u00f3n o la transferencia, no desde que te dieron la fecha.", "abre": "No es que no se pueda estudiar nada: es que lo que se estudie no llegar\u00e1 a tiempo de cambiar este ciclo. Saberlo ahora sirve para decidir con calma si se aprovecha este ciclo o se prepara el siguiente, y para no gastar dinero esperando un efecto que no da tiempo a que ocurra."}, {"texto": "S\u00ed, dentro de m\u00e1s de un mes", "valor": "S\u00ed, dentro de m\u00e1s de un mes", "aclara": "", "abre": "Hay margen para que una correcci\u00f3n llegue a tiempo, as\u00ed que se ordena el estudio en funci\u00f3n de esa fecha."}, {"texto": "No, todav\u00eda no", "valor": "No, todav\u00eda no", "aclara": "Es la situaci\u00f3n m\u00e1s com\u00fan al llegar aqu\u00ed y no retrasa nada: es el escenario en el que el estudio cabe entero antes del ciclo.", "abre": ""}, {"texto": "No lo s\u00e9", "valor": "No lo s\u00e9", "aclara": "", "abre": "No bloquea nada. La fecha consta en el centro y se puede confirmar despu\u00e9s."}], "bloques": [{"tipo": "titulo", "texto": "Lo que se corrige tarda semanas en notarse", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta pregunta aparece porque hay un ciclo programado, y con un ciclo en marcha hay una fecha que respetar. Es el \u00fanico dato que el circuito no puede deducir: esa fecha solo consta en el centro.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Importa porque entre una anal\u00edtica y su efecto pasan semanas, y no una ni dos. Hay que sacar la sangre, esperar el resultado, corregir lo que ese resultado indique y volver a comprobar que la correcci\u00f3n ha hecho algo. Cada tramo suma. Un ajuste de levotiroxina, por poner el caso m\u00e1s medido, no se recomprueba hasta unas cuatro semanas despu\u00e9s.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "tiempos-de-correccion", "pie": "De la extracci\u00f3n a la recomprobaci\u00f3n pasan semanas, y el \u00faltimo tramo es el que m\u00e1s tarda."}]}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan cu\u00e1nto quede", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La cuenta va desde hoy hasta el d\u00eda de la punci\u00f3n o la transferencia, no desde que dieron la fecha. Y si hay fecha para las dos cosas, cuenta la m\u00e1s cercana.", "puntos": [], "imagenes": []}], "objetivo": {"que": "en qu\u00e9 punto del proceso est\u00e1s", "por_que": "No es lo mismo empezar de cero que llegar con resultados en la mano o estar ya embarazada: cambia por completo qu\u00e9 merece la pena mirar ahora y con cu\u00e1nta prisa.", "imprescindible": true}}, {"clave": "tri_estudio_previo", "texto": "\u00bfTe han hecho ya alg\u00fan estudio inmunol\u00f3gico o de trombofilia?", "tipo": "opcion", "ayuda": "Se refiere a las anal\u00edticas de defensas o de coagulaci\u00f3n que se piden por las p\u00e9rdidas o por los fallos: c\u00e9lulas NK, anticuerpos antifosfol\u00edpido, factor V Leiden, protrombina, homociste\u00edna y parecidas. Una anal\u00edtica general con hemograma y hormonas no es esto.", "opciones": [{"texto": "S\u00ed, y tengo los resultados", "valor": "S\u00ed, y tengo los resultados", "aclara": "Trae el informe aunque tenga a\u00f1os o sea de otro centro. Parte de lo que ya est\u00e1 hecho no hace falta repetirlo.", "abre": "Se revisa qu\u00e9 se aprovecha y qu\u00e9 se repite antes de pedir nada nuevo."}, {"texto": "S\u00ed, pero a\u00fan no tengo resultados", "valor": "S\u00ed, pero a\u00fan no tengo resultados", "aclara": "", "abre": "Se espera a tenerlos delante: pedir en paralelo lo mismo que ya est\u00e1 en marcha solo duplica el gasto."}, {"texto": "No", "valor": "No", "aclara": "Es lo m\u00e1s frecuente al empezar y no retrasa nada: decidir si ese estudio hace falta es justo una de las cosas que hace este circuito.", "abre": ""}, {"texto": "No lo s\u00e9", "valor": "No lo s\u00e9", "aclara": "", "abre": "Vale como respuesta. Se comprueba con el informe del centro cuando est\u00e9 a mano."}], "bloques": [{"tipo": "titulo", "texto": "Lo que ya te han hecho puede ahorrar la mitad", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta pregunta va por las anal\u00edticas de defensas o de coagulaci\u00f3n que se piden por las p\u00e9rdidas o por los fallos: c\u00e9lulas NK, anticuerpos antifosfol\u00edpido, factor V Leiden, protrombina, homociste\u00edna y parecidas. Una anal\u00edtica general con hemograma y hormonas no es esto.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Conviene traer el informe aunque tenga a\u00f1os o sea de otro centro. Una parte de lo que ya est\u00e1 hecho vale tal cual y no hay por qu\u00e9 repetirla.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Por qu\u00e9 otra parte s\u00ed se repite", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No es desconfianza. Hay determinaciones que solo cuentan si salen positivas dos veces separadas en el tiempo. Los anticuerpos antifosfol\u00edpido \u2014los que espesan la sangre\u2014 funcionan as\u00ed: se consideran confirmados cuando dos anal\u00edticas separadas al menos doce semanas salen positivas las dos. Un positivo suelto, y sobre todo uno antiguo que nunca se repiti\u00f3, no cierra el asunto y obliga a volver a mirarlo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "As\u00ed que el estudio previo se separa en dos montones: lo que se aprovecha y lo que necesita confirmarse.", "puntos": [], "imagenes": []}], "objetivo": {"que": "en qu\u00e9 punto del proceso est\u00e1s", "por_que": "No es lo mismo empezar de cero que llegar con resultados en la mano o estar ya embarazada: cambia por completo qu\u00e9 merece la pena mirar ahora y con cu\u00e1nta prisa.", "imprescindible": true}}, {"clave": "inm_perdidas", "texto": "\u00bfCu\u00e1ntas p\u00e9rdidas de embarazo has tenido?", "tipo": "opcion", "ayuda": "Cuenta cualquier embarazo que no sigui\u00f3 adelante, incluidas las p\u00e9rdidas muy tempranas: las que solo se vieron por un test positivo o por una beta, aunque nunca llegara a verse nada en una ecograf\u00eda. El embarazo ect\u00f3pico y la mola no se suman en este n\u00famero; cu\u00e9ntalos igualmente, pero aparte, porque se valoran de otra forma.", "opciones": [{"texto": "Ninguna", "valor": "Ninguna", "aclara": "Es la casilla si nunca has tenido un test o una beta positiva, por muchos intentos o transferencias que haya habido detr\u00e1s.", "abre": ""}, {"texto": "1", "valor": "1", "aclara": "Una p\u00e9rdida sola es frecuente y casi siempre ocurre por azar. Se pregunta porque el n\u00famero cambia lo que se estudia, no porque una sola encienda ninguna alarma.", "abre": ""}, {"texto": "2", "valor": "2", "aclara": "", "abre": "Desde aqu\u00ed se habla de p\u00e9rdida recurrente y el estudio pasa a estar recomendado."}, {"texto": "3 o m\u00e1s", "valor": "3 o m\u00e1s", "aclara": "", "abre": "Mismo guion, con m\u00e1s motivo para revisarlo entero."}], "bloques": [{"tipo": "titulo", "texto": "Una p\u00e9rdida es m\u00e1s frecuente de lo que se cuenta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "De cada cien embarazos que llegan a saberse, entre ocho y quince terminan en p\u00e9rdida. Casi todas ocurren por un fallo al azar en el reparto de los cromosomas del embri\u00f3n: ni se hereda, ni anuncia la siguiente. Tras una \u00fanica p\u00e9rdida, el riesgo en el embarazo siguiente se mantiene en torno al 15 %, parecido al de partida.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "cronologia-embarazo-temprano", "pie": "Antes de la beta no hay p\u00e9rdida que contar: el embri\u00f3n no lleg\u00f3 a agarrarse."}]}, {"tipo": "parrafo", "texto": "Se pregunta por el n\u00famero porque el n\u00famero cambia lo que conviene mirar, no porque una sola encienda ninguna alarma.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Dos es el n\u00famero desde el que se estudia", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "A partir de dos p\u00e9rdidas deja de tratarse como mala suerte y se estudia, aunque hayan sido muy tempranas. Eso no significa que se vaya a pedir todo: significa que hay un guion establecido sobre qu\u00e9 mirar y qu\u00e9 no. Es tambi\u00e9n el punto en el que el estudio deja de ser opcional y pasa a estar recomendado, y en el que entra el cribado de anticuerpos antifosfol\u00edpido, unos anticuerpos que espesan la sangre.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cuenta en este n\u00famero", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta cualquier embarazo que no sigui\u00f3 adelante, incluidas las p\u00e9rdidas muy tempranas: las que solo se vieron por un test positivo o por una beta, aunque nunca llegara a verse nada en una ecograf\u00eda. El embarazo ect\u00f3pico y la mola no se suman aqu\u00ed; cuentan igual, pero aparte, porque se valoran de otra forma.", "puntos": [], "imagenes": []}], "objetivo": {"que": "qu\u00e9 se ha intentado y qu\u00e9 ha pasado", "por_que": "El n\u00famero de p\u00e9rdidas y de transferencias sin implantar es lo que m\u00e1s pesa al decidir qu\u00e9 se estudia: son dos caminos distintos.", "imprescindible": true}}, {"clave": "inm_transferencias", "texto": "\u00bfCu\u00e1ntas transferencias de embri\u00f3n te han hecho en total?", "tipo": "opcion", "ayuda": "Cuenta las veces que llegaron a colocar un embri\u00f3n dentro del \u00fatero, en fresco o congelado. Un ciclo que se cancel\u00f3 antes de transferir no cuenta.", "opciones": [{"texto": "Ninguna", "valor": "Ninguna", "aclara": "Es la casilla si has buscado embarazo por tu cuenta o con inseminaciones: en la inseminaci\u00f3n no se transfiere ning\u00fan embri\u00f3n.", "abre": "Si tampoco ha habido p\u00e9rdidas, este bloque se cierra: no hay historia que reconstruir, y el caso se reparte por los antecedentes y por el estudio de base."}, {"texto": "1", "valor": "1", "aclara": "", "abre": "Se sigue preguntando: si lleg\u00f3 a salir beta positiva y c\u00f3mo eran los embriones."}, {"texto": "2", "valor": "2", "aclara": "", "abre": "Igual, y el n\u00famero empieza a pesar en la cuenta."}, {"texto": "3", "valor": "3", "aclara": "", "abre": "Igual."}, {"texto": "4 o m\u00e1s", "valor": "4 o m\u00e1s", "aclara": "", "abre": "Igual."}], "bloques": [{"tipo": "titulo", "texto": "P\u00e9rdidas y transferencias son dos cuentas distintas", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Una p\u00e9rdida empieza con un positivo. Una transferencia que no implanta nunca llega a tenerlo. Son dos caminos de estudio distintos, y por eso hacen falta las dos cuentas y no vale una sola.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "cronologia-embarazo-temprano", "pie": "Una p\u00e9rdida empieza en el primer punto; una transferencia que no implanta no llega a \u00e9l."}]}, {"tipo": "parrafo", "texto": "Aqu\u00ed se cuentan las veces que llegaron a colocar un embri\u00f3n dentro del \u00fatero, en fresco o congelado. Un ciclo que se cancel\u00f3 antes de transferir no cuenta. Si se ha buscado embarazo por cuenta propia o con inseminaciones, la respuesta es \u00abninguna\u00bb: en la inseminaci\u00f3n no se transfiere ning\u00fan embri\u00f3n.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "El n\u00famero de intentos, solo, no define el fallo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que se suma no son los intentos, sino la probabilidad de implantar que cab\u00eda esperar de los embriones transferidos. El fallo de implantaci\u00f3n se define cuando esa suma pasa del 60 % y aun as\u00ed no hubo embarazo. Tres transferencias con embriones de calidad justa no llegan a ese umbral; tres con embriones de buena calidad, s\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Dicho de otro modo: tres intentos no significan lo mismo en un caso que en otro, y por eso la pregunta siguiente es por c\u00f3mo eran esos embriones.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 abre cada respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La beta es el an\u00e1lisis de sangre que se hace despu\u00e9s de la transferencia.", "puntos": [], "imagenes": []}], "objetivo": {"que": "qu\u00e9 se ha intentado y qu\u00e9 ha pasado", "por_que": "El n\u00famero de p\u00e9rdidas y de transferencias sin implantar es lo que m\u00e1s pesa al decidir qu\u00e9 se estudia: son dos caminos distintos.", "imprescindible": true}}, {"clave": "inm_implantacion", "texto": "En esas transferencias, \u00bflleg\u00f3 a salir alguna beta positiva aunque despu\u00e9s no siguiera adelante?", "tipo": "opcion", "ayuda": "La beta es el an\u00e1lisis de sangre que se hace una o dos semanas despu\u00e9s de la transferencia. Que salga positiva significa que el embri\u00f3n lleg\u00f3 a agarrarse, aunque despu\u00e9s no siguiera adelante.", "opciones": [{"texto": "S\u00ed, alguna", "valor": "S\u00ed, alguna", "aclara": "", "abre": "El embri\u00f3n lleg\u00f3 a implantar, as\u00ed que lo que se estudia es lo que pas\u00f3 a partir de ah\u00ed."}, {"texto": "Nunca, siempre negativa", "valor": "Nunca, siempre negativa", "aclara": "Que nunca haya salido positiva no es peor ni mejor que haber perdido un embarazo: es otra cosa distinta, y lleva el estudio por otro camino.", "abre": "No lleg\u00f3 a implantar: se mira el momento anterior, y c\u00f3mo eran los embriones."}, {"texto": "No lo recuerdo bien", "valor": "No lo recuerdo bien", "aclara": "Respuesta habitual y v\u00e1lida. El dato est\u00e1 en el informe del centro y se puede recuperar sin prisa.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "La beta dice si el embri\u00f3n lleg\u00f3 a agarrarse", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La beta es el an\u00e1lisis de sangre que se hace una o dos semanas despu\u00e9s de la transferencia. Si sale positiva, el embri\u00f3n lleg\u00f3 a agarrarse, aunque despu\u00e9s no siguiera adelante. Si sale negativa, ese enganche no lleg\u00f3 a producirse.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "implantacion", "pie": "Agarrarse es hundirse en la capa de dentro del \u00fatero. Eso es lo que confirma una beta positiva."}]}, {"tipo": "parrafo", "texto": "Es lo que separa las transferencias en dos grupos, y no se puede deducir del n\u00famero: por eso se pregunta aparte. Sin ninguna transferencia detr\u00e1s, esta pregunta no aparece.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ninguna de las dos cosas es peor que la otra. Son distintas, y llevan el estudio por caminos distintos.", "puntos": [], "imagenes": []}], "objetivo": {"que": "qu\u00e9 se ha intentado y qu\u00e9 ha pasado", "por_que": "El n\u00famero de p\u00e9rdidas y de trans ctiva", "nombre": "Endocrinolog\u00eda reproductiva", "orden": 2, "para_que": "Responde la pregunta que va antes que todas: **\u00bfovulas?** Si no sale \u00f3vulo no hay nada que\nimplantar, y estudiar el terreno mientras tanto es mirar el sitio equivocado. Despu\u00e9s\nmira lo que puede estropear una ovulaci\u00f3n que s\u00ed existe \u2014tiroides, prolactina, az\u00facar\u2014 y\npor \u00faltimo cu\u00e1nta reserva queda.\n\nEse orden importa: la reserva va la \u00faltima a prop\u00f3sito. Es el dato que m\u00e1s angustia\ngenera y el que menos decisiones cambia cuando lo de arriba est\u00e1 sin resolver.", "obligatoria": true, "saber_mas": ["El eje que ordena el ciclo: si hay ovulaci\u00f3n, cada cu\u00e1nto, y qu\u00e9 hormonas la est\u00e1n moviendo o frenando. Un ciclo regular no garantiza que haya ovulaci\u00f3n, y por eso se pregunta por las dos cosas por separado.", "La tiroides tiene su propio motivo para estar aqu\u00ed. Una tiroides que va bien para el d\u00eda a d\u00eda puede no ir bien para buscar embarazo \u2014el list\u00f3n baja\u2014, y en cuanto hay embarazo la demanda sube de golpe, as\u00ed que la dosis de antes se queda corta justo en las primeras semanas. Por eso se mira antes y se recomprueba, en vez de ajustarla una sola vez.", "El ovario poliqu\u00edstico y la resistencia a la insulina se preguntan juntos porque comparten terreno con nutrici\u00f3n: buena parte de lo que devuelve la ovulaci\u00f3n en estos casos no es una hormona, es el metabolismo."], "del_area": [{"titulo": "Lo primero es si sale \u00f3vulo", "llano": "Antes de estudiar el terreno hay que saber si hay semilla. Sin ovulaci\u00f3n, ninguna prueba de defensas, coagulaci\u00f3n o endometrio va a explicar lo que pasa, porque el problema est\u00e1 antes. Es adem\u00e1s lo m\u00e1s barato de averiguar: en muchos casos basta con c\u00f3mo viene la regla.", "fundamento": "Los trastornos ovulatorios son una de las causas m\u00e1s frecuentes de infertilidad y de las que mejor re _que": "Son antecedentes que la pareja muchas veces no relaciona con esto y que cambian qu\u00e9 se estudia: un test\u00edculo que baj\u00f3 tarde o unas paperas de adolescente orientan mucho.", "imprescindible": false}}]}, {"area": "nutricion-metabolismo", "nombre": "Nutrici\u00f3n y metabolismo", "orden": 4, "para_que": "Patr\u00f3n de alimentaci\u00f3n, composici\u00f3n corporal, d\u00e9ficits y suplementaci\u00f3n: el terreno sobre el que trabajan todas las dem\u00e1s \u00e1reas, y el m\u00e1s modificable de todos.", "obligatoria": true, "saber_mas": ["El terreno: composici\u00f3n corporal, patr\u00f3n de alimentaci\u00f3n y lo que ya se est\u00e1 tomando. No es una consulta de dieta, y por eso no se juzga c\u00f3mo se come: se mira lo que puede cambiar una decisi\u00f3n del estudio.", "Es el \u00e1rea con m\u00e1s margen de maniobra y la que menos depende de nadie. Casi todo lo que sale de aqu\u00ed se corrige en semanas, sin cita, sin autorizaci\u00f3n y sin coste: el folato, el hierro, la vitamina D, el omega-3, el orden de las comidas. Cuando hay un ciclo previsto a meses vista, esto es lo que s\u00ed llega a tiempo.", "Se pregunta tambi\u00e9n por lo que ya se toma, y no por curiosidad: hay suplementos que se duplican sin querer, otros que se quedan cortos, y algunos que interaccionan con la medicaci\u00f3n que este circuito puede acabar planteando."], "del_area": [{"titulo": "La parte del estudio que no depende de nadie m\u00e1s", "llano": "Aqu\u00ed se mira la alimentaci\u00f3n, c\u00f3mo va el peso y si falta o sobra algo de vitaminas o de hierro. Es el terreno sobre el que trabajan las dem\u00e1s \u00e1reas y casi lo \u00fanico que se corrige sin quir\u00f3fano y sin recetas caras, con cambios que se notan en semanas. No se pregunta para juzgar c\u00f3mo se come: nadie come perfecto y eso no explica por s\u00ed solo una infertilidad.", "fundamento": "La gu\u00eda internacional de SOP de 2023 sit\u00faa el estilo de vida en primera l\u00ednea con dos matices que ordenan toda esta \u00e1rea: ning\u00fan r\u00e9gimen diet\u00e9tico concreto ha demostrado ser superior a otro, y hay beneficio incluso cuando no hay p\u00e9rdida de peso. Esa misma gu\u00eda pide de forma expl\u00edcita minimizar el sesgo y el estigma de peso en la consulta."}], "preguntas": [{"clave": "nut_peso", "texto": "\u00bfCu\u00e1nto pesas ahora, aproximadamente? (en kilos)", "tipo": "numero", "ayuda": "Vale el peso aproximado, el de la \u00faltima vez que te pesaste. Se usa junto con la altura para calcular el \u00edndice de masa corporal, que es un punto de partida y no un veredicto: no distingue m\u00fasculo de grasa y no dice por s\u00ed solo lo que hay que hacer.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "El peso solo no se lee: se lee junto a la altura", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta parte del circuito mira el terreno sobre el que trabajan todas las dem\u00e1s \u00e1reas, y es tambi\u00e9n el m\u00e1s modificable de todos.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Empieza por el punto de partida. El peso y la altura juntos dan el \u00edndice de masa corporal, que es exactamente eso: un punto de partida, no un veredicto. No distingue m\u00fasculo de grasa y por s\u00ed solo no decide ninguna prueba ni ning\u00fan cambio.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "peso-y-altura", "pie": "La b\u00e1scula marca lo mismo, y junto a la altura significa cosas distintas."}]}, {"tipo": "titulo", "texto": "Lo que hace falta y lo que no", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Vale el dato aproximado, el de la \u00faltima vez que te pesaste. No hace falta buscar una b\u00e1scula ahora.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El peso de hoy entra como contexto. Lo que s\u00ed puede mover el estudio es c\u00f3mo ha cambiado durante el \u00faltimo a\u00f1o, que es la pregunta que viene despu\u00e9s.", "puntos": [], "imagenes": []}], "objetivo": {"que": "punto de partida", "por_que": "Situar el peso y su evoluci\u00f3n reciente, que influyen en la ovulaci\u00f3n y en la respuesta al tratamiento.", "imprescindible": true}}, {"clave": "nut_altura", "texto": "\u00bfCu\u00e1nto mides? (en cent\u00edmetros)", "tipo": "numero", "ayuda": "Sirve solo para calcular el \u00edndice de masa corporal junto con el peso. Basta el dato aproximado.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "La altura es la otra mitad del dato", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El peso ya est\u00e1 contado, y solo no se puede interpretar. La altura es lo que permite leerlo en forma de \u00edndice de masa corporal.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "peso-y-altura", "pie": "El mismo peso significa cosas distintas seg\u00fan la altura: por eso van juntos."}]}, {"tipo": "titulo", "texto": "Para qu\u00e9 se usa y para qu\u00e9 no", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Sirve para eso y para nada m\u00e1s. Basta el dato aproximado: no hace falta medirse ahora.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Y conviene repetirlo, porque ese \u00edndice se usa mal con frecuencia: es un punto de partida, no un veredicto, y no distingue m\u00fasculo de grasa.", "puntos": [], "imagenes": []}], "objetivo": {"que": "punto de partida", "por_que": "Situar el peso y su evoluci\u00f3n reciente, que influyen en la ovulaci\u00f3n y en la respuesta al tratamiento.", "imprescindible": true}}, {"clave": "nut_cambio_peso", "texto": "\u00bfTu peso ha cambiado mucho en el \u00faltimo a\u00f1o?", "tipo": "opcion", "ayuda": "La ventana es el \u00faltimo a\u00f1o. Interesa la direcci\u00f3n y la velocidad del cambio, no la cifra a la que se ha llegado.", "opciones": [{"texto": "Se ha mantenido", "valor": "Se ha mantenido", "aclara": "Los vaivenes de dos o tres kilos a lo largo del a\u00f1o entran aqu\u00ed: los tiene casi todo el mundo. Lo que se compara es con hace un a\u00f1o, no con el peso que tuviste alguna vez.", "abre": ""}, {"texto": "He ganado m\u00e1s de 5 kg", "valor": "He ganado m\u00e1s de 5 kg", "aclara": "", "abre": "Se a\u00f1ade una HbA1c, que mira c\u00f3mo maneja el cuerpo el az\u00facar."}, {"texto": "He perdido m\u00e1s de 5 kg", "valor": "He perdido m\u00e1s de 5 kg", "aclara": "Vale igual si la bajada fue buscada que si no, y da lo mismo c\u00f3mo se consigui\u00f3. Lo que informa aqu\u00ed es la velocidad del cambio, no el motivo ni el peso de partida.", "abre": ""}, {"texto": "Sube y baja constantemente", "valor": "Sube y baja constantemente", "aclara": "Es subir y bajar varias veces dentro del mismo a\u00f1o. Un cambio en una sola direcci\u00f3n, aunque haya sido en dos tramos, no es este patr\u00f3n.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "El mismo peso de hoy, recorridos distintos", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuatro personas pueden llegar al mismo n\u00famero por caminos muy distintos: manteni\u00e9ndose, subiendo, bajando o con vaivenes. A partir de aqu\u00ed lo que informa es el recorrido, no la cifra.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "mismo-peso-dos-recorridos", "pie": "Cuatro recorridos de un a\u00f1o que acaban en el mismo peso de hoy."}]}, {"tipo": "parrafo", "texto": "La ventana es el \u00faltimo a\u00f1o, y lo que interesa es la direcci\u00f3n y la velocidad del cambio.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Por qu\u00e9 un cambio grande se nota en el ciclo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Subir bastante en poco tiempo, o subir y bajar varias veces, altera la se\u00f1al hormonal que ordena la ovulaci\u00f3n y la forma en que el cuerpo maneja el az\u00facar. Perder mucho y r\u00e1pido hace que el cuerpo aparque la ovulaci\u00f3n por falta de energ\u00eda disponible.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "En los dos casos suele recuperarse al volver el equilibrio, y no es cuesti\u00f3n de voluntad.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 a\u00f1ade cada respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No hay que corregir el peso antes de seguir con el estudio.", "puntos": [], "imagenes": []}], "objetivo": {"que": "punto de partida", "por_que": "Situar el peso y su evoluci\u00f3n reciente, que influyen en la ovulaci\u00f3n y en la respuesta al tratamiento.", "imprescindible": true}}, {"clave": "nut_dietas", "texto": "\u00bfEst\u00e1s siguiendo alguna dieta concreta ahora mismo?", "tipo": "opcion", "ayuda": "Se refiere a una pauta sostenida en el tiempo, no a una semana suelta. Si conviven varias, la que m\u00e1s informa es la que deja fuera m\u00e1s grupos de alimentos.", "opciones": [{"texto": "No, como de todo", "valor": "No, como de todo", "aclara": "Significa que no sigues ninguna pauta que deje fuera un grupo de alimentos. No es una valoraci\u00f3n de si comes bien o mal: de eso se ocupan las preguntas siguientes.", "abre": ""}, {"texto": "Vegetariana", "valor": "Vegetariana", "aclara": "", "abre": "Se comprueban la B12 y el hierro en la anal\u00edtica que esta \u00e1rea ya pide, y se cubre lo que falte."}, {"texto": "Vegana", "valor": "Vegana", "aclara": "Sin ning\u00fan alimento de origen animal. Se pregunta por los nutrientes que esta pauta no cubre por s\u00ed sola \u2014la B12 sobre todo\u2014, no por la pauta en s\u00ed, que es compatible con buscar embarazo.", "abre": "Igual, con la B12 como prioridad."}, {"texto": "Sin gluten", "valor": "Sin gluten", "aclara": "Entra tanto la dieta puesta por un diagn\u00f3stico como la empezada por cuenta propia. La diferencia importa porque el an\u00e1lisis de celiaqu\u00eda solo es interpretable si se est\u00e1 comiendo gluten.", "abre": "Si se ha empezado por cuenta propia, hay que decidir antes de sacar la sangre si se estudia la celiaqu\u00eda. Si el diagn\u00f3stico ya est\u00e1 hecho, no hay nada que rehacer."}, {"texto": "Sin lactosa", "valor": "Sin lactosa", "aclara": "", "abre": "Se mira el aporte de calcio."}, {"texto": "Baja en hidratos / keto", "valor": "Baja en hidratos / keto", "aclara": "Va desde una pauta cetog\u00e9nica estricta hasta una reducci\u00f3n marcada y sostenida de pan, pasta, arroz y fruta. Una semana suelta no cuenta; lo que interesa es lo que llevas manteniendo.", "abre": ""}, {"texto": "Otra", "valor": "Otra", "aclara": "", "abre": "Se mira igual: qu\u00e9 grupos de alimentos quedan fuera."}], "bloques": [{"tipo": "titulo", "texto": "De cada dieta interesa lo que deja fuera", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No se pregunta para valorar la pauta. Una dieta vegetariana o vegana es compatible con buscar embarazo, y ninguna de las dos es lo que hay que cambiar.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que se mira es qu\u00e9 nutrientes no llegan por esa v\u00eda. La vitamina B12 no llega de forma fiable por v\u00eda vegetal, y el hierro vegetal se absorbe peor.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Estar sin gluten cambia otra cosa distinta: el an\u00e1lisis de celiaqu\u00eda mide la reacci\u00f3n al gluten que se est\u00e1 comiendo, as\u00ed que solo es interpretable si se est\u00e1 comiendo.", "puntos": [], "imagenes": []}], "objetivo": {"que": "punto de partida", "por_que": "Situar el peso y su evoluci\u00f3n reciente, que influyen en la ovulaci\u00f3n y en la respuesta al tratamiento.", "imprescindible": true}}, {"clave": "nut_verdura_fruta", "texto": "\u00bfCu\u00e1ntas raciones de verdura o fruta tomas al d\u00eda?", "tipo": "opcion", "ayuda": "Una raci\u00f3n es una pieza de fruta, un plato de ensalada o un plato de verdura cocinada, m\u00e1s o menos un pu\u00f1ado grande. El zumo, aunque sea natural, cuenta como mucho una vez al d\u00eda, y la patata cuenta como fuente de hidratos, no como verdura.", "opciones": [{"texto": "Menos de 1", "valor": "Menos de 1", "aclara": "", "abre": "Es donde m\u00e1s rinde un cambio peque\u00f1o: subir a tres raciones al d\u00eda es de lo m\u00e1s r\u00e1pido de conseguir."}, {"texto": "1 o 2", "valor": "1 o 2", "aclara": "", "abre": "Igual, con margen para subir."}, {"texto": "3 o 4", "valor": "3 o 4", "aclara": "", "abre": "El aporte de este grupo est\u00e1 cubierto."}, {"texto": "5 o m\u00e1s", "valor": "5 o m\u00e1s", "aclara": "", "abre": "Igual."}], "bloques": [{"tipo": "titulo", "texto": "La verdura y la fruta traen casi todo el folato", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La verdura de hoja, la legumbre y la fruta son la principal fuente de folato de la alimentaci\u00f3n, y tambi\u00e9n de la fibra que sostiene la digesti\u00f3n. El folato es la vitamina que se suplementa antes del embarazo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "tubo-neural-cierre", "pie": "Para qu\u00e9 sirve ese folato: el tubo del que salen el cerebro y la m\u00e9dula se cierra el primer mes."}]}, {"tipo": "parrafo", "texto": "Con menos de dos raciones al d\u00eda suelen faltar las dos cosas a la vez.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Una raci\u00f3n es una pieza de fruta, un plato de ensalada o un plato de verdura cocinada, m\u00e1s o menos un pu\u00f1ado grande. El zumo, aunque sea natural, cuenta como mucho una vez al d\u00eda, y la patata cuenta como fuente de hidratos, no como verdura.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "La dieta cuenta, pero no sustituye al suplemento", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La alimentaci\u00f3n aporta folato, fibra y el resto de nutrientes de ese grupo. Lo que no se alcanza solo comiendo es la cantidad de folato que previene los defectos del tubo neural, y por eso el suplemento se pregunta aparte m\u00e1s adelante.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo comes en un d\u00eda normal", "por_que": "Ver el patr\u00f3n real, no el ideal. Nadie come perfecto y no se juzga: se ajusta.", "imprescindible": true}}, {"clave": "nut_pescado", "texto": "\u00bfCu\u00e1ntas veces por semana comes pescado azul (salm\u00f3n, sardina, caballa, at\u00fan)?", "tipo": "opcion", "ayuda": "Solo pescado azul: el blanco y el marisco no entran en esta pregunta. Cuentan igual el fresco, el congelado y la conserva.", "opciones": [{"texto": "Nunca", "valor": "Nunca", "aclara": "Aqu\u00ed entra tanto quien no come pescado como quien lo ha dejado por el mercurio o por el embarazo. El azul es la fuente principal de omega-3 de la dieta, y sin \u00e9l ese aporte depende de un suplemento.", "abre": ""}, {"texto": "1 vez", "valor": "1 vez", "aclara": "", "abre": "Est\u00e1 dentro de la franja recomendada."}, {"texto": "2 veces", "valor": "2 veces", "aclara": "Es justo la cantidad que se recomienda a quien busca embarazo: cubre el omega-3 sin llegar al tope que se aconseja por los contaminantes que acumula el pescado azul.", "abre": ""}, {"texto": "3 o m\u00e1s", "valor": "3 o m\u00e1s", "aclara": "Con el pescado azul hay un l\u00edmite recomendado por arriba: en torno a dos raciones semanales para quien busca embarazo, por los contaminantes que acumula. El resto de pescado no tiene ese tope.", "abre": "Lo que se ajusta es la frecuencia, no el alimento."}], "bloques": [{"tipo": "titulo", "texto": "El pescado azul tiene suelo y tambi\u00e9n techo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Casi todo el omega-3 de la dieta viene del pescado azul: si no entra por ah\u00ed, hay que cubrirlo con un suplemento.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "pescado-suelo-y-techo", "pie": "Un suelo por abajo y un techo por arriba, y el techo es solo del pescado azul."}]}, {"tipo": "parrafo", "texto": "Por arriba tambi\u00e9n hay un l\u00edmite, en torno a dos raciones semanales para quien busca embarazo, porque estas especies acumulan contaminantes. Ese tope es solo del pescado azul: el blanco no lo tiene. Fresco, congelado y en conserva cuentan igual.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Lo del mercurio son cuatro especies, no el pescado", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Mucha gente ha dejado el pescado por el mercurio. Buscando embarazo se desaconsejan el pez espada o emperador, el at\u00fan rojo, el tibur\u00f3n y el lucio; no el pescado en general.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo comes en un d\u00eda normal", "por_que": "Ver el patr\u00f3n real, no el ideal. Nadie come perfecto y no se juzga: se ajusta.", "imprescindible": true}}, {"clave": "nut_ultraprocesados", "texto": "\u00bfCon qu\u00e9 frecuencia tomas ultraprocesados (boller\u00eda, precocinados, refrescos, snacks)?", "tipo": "opcion", "ayuda": "Son productos listos para consumir con lista larga de ingredientes: boller\u00eda, precocinados, refrescos, snacks salados, embutido industrial. Que algo venga envasado o congelado no lo convierte en ultraprocesado: la verdura congelada o la legumbre de bote no entran.", "opciones": [{"texto": "Casi nunca", "valor": "Casi nunca", "aclara": "No hace falta que sea nunca: una comida fuera, un dulce el fin de semana o un refresco puntual entran aqu\u00ed.", "abre": ""}, {"texto": "Alguna vez a la semana", "valor": "Alguna vez a la semana", "aclara": "", "abre": "Igual: no desplaza nada."}, {"texto": "Casi a diario", "valor": "Casi a diario", "aclara": "Cuenta tambi\u00e9n el refresco o el snack de cada d\u00eda aunque la comida principal sea casera. Lo que se mide es la frecuencia con que aparecen, no la cantidad de cada vez.", "abre": ""}, {"texto": "Varias veces al d\u00eda", "valor": "Varias veces al d\u00eda", "aclara": "", "abre": "Es donde el cambio rinde m\u00e1s, y se trabaja por sustituci\u00f3n, no por prohibici\u00f3n."}], "bloques": [{"tipo": "titulo", "texto": "De los ultraprocesados importa lo que desplazan", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "En un d\u00eda cabe un n\u00famero limitado de comidas. Cuando estos productos aparecen a diario, ocupan el sitio de la verdura, la legumbre y el pescado. Lo que se mira es qu\u00e9 se queda fuera, m\u00e1s que qu\u00e9 entra.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Son productos listos para consumir con lista larga de ingredientes: boller\u00eda, precocinados, refrescos, snacks salados, embutido industrial. Que algo venga envasado o congelado no lo convierte en ultraprocesado: la verdura congelada o la legumbre de bote no entran.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo comes en un d\u00eda normal", "por_que": "Ver el patr\u00f3n real, no el ideal. Nadie come perfecto y no se juzga: se ajusta.", "imprescindible": true}}, {"clave": "nut_horarios", "texto": "\u00bfComes a horas m\u00e1s o menos fijas o depende mucho del d\u00eda?", "tipo": "opcion", "ayuda": "Pregunta por la regularidad, no por la hora exacta ni por si comes en casa. El trabajo a turnos y los d\u00edas en que se saltan comidas son justo lo que interesa recoger.", "opciones": [{"texto": "Horarios bastante fijos", "valor": "Horarios bastante fijos", "aclara": "", "abre": "Por aqu\u00ed no se a\u00f1ade nada."}, {"texto": "Depende del d\u00eda", "valor": "Depende del d\u00eda", "aclara": "", "abre": "Se ajusta con cambios peque\u00f1os sobre la log\u00edstica del d\u00eda."}, {"texto": "Muy ca\u00f3tico, como cuando puedo", "valor": "Muy ca\u00f3tico, como cuando puedo", "aclara": "", "abre": "Si lo que sostiene el desorden es la log\u00edstica, se ajusta aqu\u00ed. Si lo que lo sostiene es la carga emocional, no se arregla con una pauta y se mira desde el \u00e1rea de psicolog\u00eda y PNIE, que mira mente, hormonas y defensas juntas."}], "bloques": [{"tipo": "titulo", "texto": "Ya se sabe qu\u00e9 se come; faltan las horas", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Las preguntas anteriores miran qu\u00e9 hay en el plato. Esta mira si hay plato a horas parecidas.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No es una nota de orden: cambia lo que de verdad se come. El trabajo a turnos y los d\u00edas en que se saltan comidas son justo lo que interesa recoger, porque son los que acaban decidiendo lo que entra.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Preguntarlo evita proponer algo que no se puede sostener.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo comes en un d\u00eda normal", "por_que": "Ver el patr\u00f3n real, no el ideal. Nadie come perfecto y no se juzga: se ajusta.", "imprescindible": true}}, {"clave": "nut_digestivo", "texto": "\u00bfTienes molestias digestivas frecuentes (hinchaz\u00f3n, gases, tr\u00e1nsito irregular)?", "tipo": "si_no", "ayuda": "\u00abFrecuentes\u00bb quiere decir varias veces por semana y mantenido en el tiempo. Una mala semana o el malestar de un d\u00eda tras una comida copiosa no es lo que se busca aqu\u00ed.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Se a\u00f1aden a la anal\u00edtica los anticuerpos de celiaqu\u00eda. Conviene decirlo antes de sacar la sangre; al rev\u00e9s ya no se puede leer."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "No se a\u00f1ade nada por esta v\u00eda."}], "bloques": [{"tipo": "titulo", "texto": "La celiaqu\u00eda est\u00e1 en una de cada cien personas", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "En el adulto no se presenta como se espera. Aparece con molestias digestivas que duran semanas, o con un hierro bajo que no se explica. Por eso, cuando duran, se ofrece un an\u00e1lisis y no una dieta.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "celiaquia-vellosidades", "pie": "Los pliegues que absorben, altos y aplanados: por eso puede faltar hierro comiendo bien."}]}, {"tipo": "parrafo", "texto": "\u00abFrecuentes\u00bb quiere decir varias veces por semana y mantenido en el tiempo. Una mala semana o el malestar de un d\u00eda tras una comida copiosa no es lo que se busca aqu\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Primero el an\u00e1lisis, despu\u00e9s la dieta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El orden importa y no es negociable: los anticuerpos de celiaqu\u00eda miden la reacci\u00f3n al gluten que se est\u00e1 comiendo. Si el gluten se quita antes de la extracci\u00f3n, el resultado puede salir negativo aunque la enfermedad est\u00e9 ah\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ir ajustando la dieta por ensayo y error es lo que hace que estos diagn\u00f3sticos tarden a\u00f1os.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo comes en un d\u00eda normal", "por_que": "Ver el patr\u00f3n real, no el ideal. Nadie come perfecto y no se juzga: se ajusta.", "imprescindible": true}}, {"clave": "nut_suplementos", "texto": "Escribe los suplementos que tomas ahora, con la marca si la recuerdas.", "tipo": "abierta", "ayuda": "Escr\u00edbelos todos, aunque parezcan menores: vitaminas, minerales, omega-3, probi\u00f3ticos, infusiones y productos de herbolario. Si puedes, con la dosis que pone el envase; una foto de los botes vale igual. Hace falta para evitar duplicidades y pasarse de dosis sin querer.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "El mismo nutriente puede venir en varios botes", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Un multivitam\u00ednico, un preparado de embarazo y un bote suelto pueden traer lo mismo y sumarse sin que se note. Por eso se pide la lista entera, con la dosis que pone el envase.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuentan tambi\u00e9n las infusiones y los productos de herbolario. Y vale una foto de los botes: es m\u00e1s r\u00e1pido y m\u00e1s fiable que copiarlo de memoria.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se revisa con la lista delante", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Tres cosas: que un nutriente no venga repetido, que la dosis no pase del m\u00e1ximo recomendado y que no haya nada incompatible con el embarazo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si algo hace falta o no, eso lo dice la anal\u00edtica, no la conversaci\u00f3n.", "puntos": [], "imagenes": []}], "objetivo": {"que": "lo que ya tomas", "por_que": "Evitar duplicidades, dosis insuficientes e interacciones \u2014 sobre todo si hay anticoagulaci\u00f3n de por medio.", "imprescindible": true}}, {"clave": "nut_folico", "texto": "\u00bfTomas \u00e1cido f\u00f3lico o folato?", "tipo": "opcion", "ayuda": "\u00c1cido f\u00f3lico y folato son la misma vitamina en dos presentaciones. La pregunta es por lo que tomas ahora, no por lo que tomaste en un embarazo anterior.", "opciones": [{"texto": "S\u00ed, \u00e1cido f\u00f3lico normal", "valor": "S\u00ed, \u00e1cido f\u00f3lico normal", "aclara": "Es la forma que se us\u00f3 en los estudios que demostraron el beneficio y la que llevan casi todos los preparados. No es una versi\u00f3n peor de nada.", "abre": ""}, {"texto": "S\u00ed, folato activo (metilfolato o similar)", "valor": "S\u00ed, folato activo (metilfolato o similar)", "aclara": "En el envase aparece como metilfolato, 5-MTHF o L-metilfolato. Es otra presentaci\u00f3n de la misma vitamina.", "abre": ""}, {"texto": "No", "valor": "No", "aclara": "Es frecuente antes de empezar a buscar y no es un fallo de nadie: es de lo poco que se resuelve el mismo d\u00eda en que se sabe.", "abre": ""}, {"texto": "No lo s\u00e9", "valor": "No lo s\u00e9", "aclara": "Casi todos los multivitam\u00ednicos de embarazo lo llevan, con uno u otro nombre. El envase lo resuelve en diez segundos, y una foto vale.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "El tubo neural se cierra durante el primer mes", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El tubo neural es de donde salen el cerebro y la m\u00e9dula. Su cierre se completa hacia los 28 d\u00edas desde la concepci\u00f3n, muchas veces antes de saber que hay embarazo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "tubo-neural-cierre", "pie": "Se pliega y se cierra hacia el d\u00eda 28 desde la concepci\u00f3n."}]}, {"tipo": "parrafo", "texto": "Por eso empezar el folato cuando el test da positivo llega tarde, y por eso se toma mientras se busca. En los estudios, empezando antes, esos defectos bajaron a un tercio.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La dieta aporta folato y sostiene las reservas, pero la cantidad que previene esos defectos no se alcanza solo comiendo. De ah\u00ed que el suplemento se pregunte aparte.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Las dos formas valen", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El \u00e1cido f\u00f3lico y el folato activo son la misma vitamina en dos presentaciones, y el beneficio se obtiene con cualquiera de las dos.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La forma y la dosis se acaban de ajustar con la anal\u00edtica, que ya mide el folato, la vitamina B12 y la homociste\u00edna, que sube cuando el folato no se aprovecha bien.", "puntos": [], "imagenes": []}], "objetivo": {"que": "lo que ya tomas", "por_que": "Evitar duplicidades, dosis insuficientes e interacciones \u2014 sobre todo si hay anticoagulaci\u00f3n de por medio.", "imprescindible": true}}, {"clave": "nut_vitd", "texto": "\u00bfTe han medido la vitamina D alguna vez? Si sabes el valor, escr\u00edbelo.", "tipo": "abierta", "ayuda": "Si tienes el papel, copia el valor y la fecha. Suele venir en ng/mL y algunos laboratorios lo dan en nmol/L: son escalas distintas, as\u00ed que conviene apuntar la unidad tal cual aparece.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "La vitamina D se informa en dos escalas", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Unos laboratorios la dan en ng/mL y otros en nmol/L. Son escalas distintas, as\u00ed que el mismo nivel da un n\u00famero distinto en cada una, y un n\u00famero sin unidad no se puede interpretar.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "vitamina-d-dos-escalas", "pie": "El mismo nivel cae en un n\u00famero distinto en cada escala."}]}, {"tipo": "parrafo", "texto": "Por eso conviene copiarlo tal como aparece en el papel: el valor, la unidad y la fecha. El objetivo que se usa aqu\u00ed est\u00e1 por encima de 40 en ng/mL.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "El papel antiguo no sustituye a la prueba", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La vitamina D entra siempre en la anal\u00edtica de esta \u00e1rea, as\u00ed que traer un valor anterior no evita la extracci\u00f3n. Sirve para otra cosa: para saber si ya hubo un d\u00e9ficit y si lo que se est\u00e1 tomando est\u00e1 haciendo efecto.", "puntos": [], "imagenes": []}], "objetivo": {"que": "lo que ya tomas", "por_que": "Evitar duplicidades, dosis insuficientes e interacciones \u2014 sobre todo si hay anticoagulaci\u00f3n de por medio.", "imprescindible": true}}, {"clave": "nut_hierro", "texto": "\u00bfTe han dicho alguna vez que tienes el hierro o la ferritina bajos?", "tipo": "si_no", "ayuda": "Son dos cosas distintas: la hemoglobina baja es anemia, y la ferritina baja es quedarse sin reservas de hierro, que puede pasar con la hemoglobina todav\u00eda normal. Cualquiera de las dos entra en esta pregunta, y tambi\u00e9n el haber tomado hierro recetado alguna vez.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "No a\u00f1ade pruebas, porque esta \u00e1rea ya pide ferritina: cambia c\u00f3mo se leen. Y si adem\u00e1s hay molestias digestivas, un hierro bajo sin explicaci\u00f3n es una de las formas en que se presenta la celiaqu\u00eda en el adulto."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Se mide igual, que es lo que dir\u00e1 si las reservas est\u00e1n o no vac\u00edas."}], "bloques": [{"tipo": "titulo", "texto": "Las reservas se vac\u00edan antes de que haya anemia", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Son dos cosas distintas: la hemoglobina baja es anemia, y la ferritina baja es quedarse sin reservas de hierro, que puede pasar con la hemoglobina todav\u00eda normal.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "reservas-hierro", "pie": "La ferritina baja primero; la hemoglobina es lo \u00faltimo que cae."}]}, {"tipo": "parrafo", "texto": "La ferritina mide esas reservas y baja primero; la hemoglobina es lo \u00faltimo que cae. Por eso se puede tener el hierro agotado con un an\u00e1lisis de rutina normal, y por eso el cansancio o la ca\u00edda de pelo aparecen antes que ninguna cifra de anemia.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Un an\u00e1lisis de rutina normal no descarta las reservas vac\u00edas.", "puntos": [], "imagenes": []}], "objetivo": {"que": "lo que ya tomas", "por_que": "Evitar duplicidades, dosis insuficientes e interacciones \u2014 sobre todo si hay anticoagulaci\u00f3n de por medio.", "imprescindible": true}}]}, {"area": "estilo-vida-exposiciones", "nombre": "Estilo de vida y exposiciones", "orden": 5, "para_que": "Tabaco, alcohol, actividad f\u00edsica, t\u00f3xicos ambientales y disruptores endocrinos. Es el \u00e1rea m\u00e1s barata de corregir y la que m\u00e1s se da por sabida sin haberla preguntado.", "obligatoria": true, "saber_mas": ["Tabaco, alcohol, descanso, movimiento y lo que se respira o se toca en el trabajo. Es la parte del circuito que no manda pedir casi ninguna prueba y aun as\u00ed cambia cosas, porque aqu\u00ed todo lo que aparece se puede mover.", "Conviene decir de entrada para qu\u00e9 no sirve: no se busca a qui\u00e9n echarle la culpa de lo que est\u00e1 pasando. Nadie deber\u00eda salir de aqu\u00ed pensando que su trabajo de oficina explica sus p\u00e9rdidas. Se pregunta porque son los \u00fanicos factores que se pueden empezar a corregir esta misma semana, mientras el resto del estudio avanza.", "El humo ajeno cuenta, aunque menos que el propio, y por eso se pregunta aparte. La cafe\u00edna, en cambio, no mantiene abierta ninguna l\u00ednea: se recoge para tener el cuadro completo, no porque cambie una decisi\u00f3n."], "del_area": [{"titulo": "Esto se pregunta para ajustar, no para buscar culpables", "llano": "Casi nada de lo que hay en esta \u00e1rea explica por s\u00ed solo una infertilidad. Lo que hacen estos factores es mover la probabilidad unos puntos, y a veces sumarse entre ellos. Se preguntan porque son de lo poco que se puede cambiar en semanas, sin cita ni quir\u00f3fano. Y porque algunas cosas de esta lista \u2014el humo dentro de casa, un producto del trabajo\u2014 no las pregunta casi nadie.", "fundamento": "El apartado de NICE NG257 (2026) sobre factores que afectan a la fertilidad recoge tanto consejo (tabaco, alcohol, peso, ocupaci\u00f3n) como desmentidos: sobre las bebidas con cafe\u00edna afirma que no hay evidencia consistente de asociaci\u00f3n con problemas de fertilidad. Los efectos descritos son de magnitud moderada: el mayor de todos, el tabaquismo, se asocia a un odds ratio de infertilidad de 1,60 (ASRM, opini\u00f3n de comit\u00e9 2024), no a una explicaci\u00f3n completa."}], "preguntas": [{"clave": "vida_tabaco", "texto": "\u00bfFumas?", "tipo": "opcion", "ayuda": "Cuenta cualquier forma de tabaco: cigarrillo, liado, puro o pipa de agua. El vapeador tiene casilla propia porque se estudia por separado y no hay los mismos datos.", "opciones": [{"texto": "No, nunca", "valor": "No, nunca", "aclara": "Haber probado en la adolescencia, o fumar en una boda cada varios a\u00f1os, no cambia esta casilla.", "abre": ""}, {"texto": "Lo dej\u00e9", "valor": "Lo dej\u00e9", "aclara": "Vale aunque fuera hace un mes. Lo que importa aqu\u00ed es cu\u00e1ndo lo dejaste, no cu\u00e1nto fumabas: el tiempo sin fumar cuenta, y buena parte de lo perdido vuelve antes de lo que se cree.", "abre": ""}, {"texto": "Ocasionalmente", "valor": "Ocasionalmente", "aclara": "Es fumar en algunas salidas o alg\u00fan fin de semana, sin patr\u00f3n diario. No hace falta llevar la cuenta exacta.", "abre": ""}, {"texto": "A diario", "valor": "A diario", "aclara": "Da igual la cantidad: uno al d\u00eda y quince al d\u00eda est\u00e1n los dos aqu\u00ed. Cu\u00e1nto es se matiza despu\u00e9s.", "abre": ""}, {"texto": "Vapeo", "valor": "Vapeo", "aclara": "Es la casilla de quien vapea y ya no fuma tabaco. Vapear y fumar a la vez es otra cosa, y conviene decirlo con esas palabras.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Lo que el tabaco mueve, y lo que puede volver", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Es lo \u00fanico de esta \u00e1rea con un efecto grande y bien medido: mientras se fuma, vez y media m\u00e1s de casos de dificultad para concebir, la menopausia entre uno y cuatro a\u00f1os antes, y m\u00e1s tiempo hasta el embarazo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "tabaco-lo-que-vuelve", "pie": "Lo que se pierde mientras se fuma remonta en buena parte el primer a\u00f1o sin tabaco."}]}, {"tipo": "parrafo", "texto": "Y hay una segunda mitad que casi nunca se cuenta: durante el primer a\u00f1o sin fumar, buena parte de lo perdido puede volver.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No es un reproche. Es donde m\u00e1s se puede ganar por lo que cuesta.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta cualquier forma de tabaco: cigarrillo, liado, puro o pipa de agua. El vapeador tiene casilla propia porque se estudia por separado y no hay los mismos datos.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 abre cada respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ninguna casilla cambia el trato. Cambia lo que se ofrece.", "puntos": [], "imagenes": []}], "objetivo": {"que": "consumos", "por_que": "Sin juicio: se pregunta para poder ajustar, y porque el efecto sobre el resultado est\u00e1 descrito.", "imprescindible": true}}, {"clave": "vida_tabaco_pasivo", "texto": "\u00bfConvives con alguien que fuma en casa?", "tipo": "si_no", "ayuda": "Se pregunta por humo dentro de casa, de forma habitual. Si quien fuma lo hace siempre en la calle o en el balc\u00f3n con la puerta cerrada, no es lo mismo. El coche compartido tambi\u00e9n es espacio cerrado.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Queda algo que cambiar que no depende de una sola persona: la conversaci\u00f3n es con quien fuma en casa."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Junto con lo anterior, los consumos pueden quedar cerrados."}], "bloques": [{"tipo": "titulo", "texto": "El humo de casa cuenta, aunque menos que el propio", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Es el dato que m\u00e1s sorprende de esta \u00e1rea: en el marcador del ovario que se mide, la subida en quien convive con humo dentro de casa fue algo m\u00e1s de la mitad de la que se ve en quien fuma.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No e
