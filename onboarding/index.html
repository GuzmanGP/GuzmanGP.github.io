n\n  \u003cpath d=\"M 250,120 L 250,240 M 420,120 L 420,240\" fill=\"none\"\n        stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ctext x=\"262\" y=\"140\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">Con anticonceptivo: en pausa\u003c/text>\n  \u003ctext x=\"80\" y=\"264\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Ciclo propio\u003c/text>\n  \u003ctext x=\"430\" y=\"264\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Vuelve, y tarda unos meses\u003c/text>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">No estropea nada: tapa la se\u00f1al mientras dura\u003c/text>\n\u003c/svg>", "ejercicio-dos-extremos": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El ciclo se altera en los dos extremos, no en el medio\u003c/title>\n  \u003cdesc>Una curva con forma de valle: a la izquierda, no moverse; a la derecha, el esfuerzo fuerte casi a diario; y entre los dos, la zona amplia del movimiento regular, que es donde el ciclo no se resiente. Lo que se pregunta no es el deporte, sino en qu\u00e9 parte de esa curva cae la semana.\u003c/desc>\n\n  \u003cpath d=\"M 80,300 L 570,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 80,100 C 150,236 220,262 320,262 C 420,262 490,236 560,100\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n\n  \u003cpath d=\"M 200,262 C 260,258 380,258 440,262 L 440,300 L 200,300 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.16\"/>\n  \u003ctext x=\"240\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Movimiento regular\u003c/text>\n\n  \u003ccircle cx=\"92\" cy=\"124\" r=\"10\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.5\"\n          stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\"/>\n  \u003ccircle cx=\"548\" cy=\"124\" r=\"10\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.5\"\n          stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\"/>\n\n  \u003ctext x=\"72\" y=\"104\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">No moverse\u003c/text>\n  \u003ctext x=\"392\" y=\"104\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Fuerte casi a diario\u003c/text>\n\n  \u003ctext x=\"40\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Los dos extremos alteran el ciclo; el medio, no\u003c/text>\n  \u003ctext x=\"80\" y=\"332\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Cu\u00e1nto se mueve la semana\u003c/text>\n\u003c/svg>", "sop-dos-de-tres": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Hacen falta dos de las tres cosas, y la imagen sola no basta\u003c/title>\n  \u003cdesc>Tres c\u00edrculos que se solapan: la imagen de ovarios con muchos fol\u00edculos, la regla irregular y los signos de exceso de andr\u00f3genos. El diagn\u00f3stico necesita al menos dos de los tres, as\u00ed que la ecograf\u00eda por s\u00ed sola no lo da.\u003c/desc>\n\n  \u003ccircle cx=\"250\" cy=\"150\" r=\"86\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.14\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"390\" cy=\"150\" r=\"86\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.14\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"320\" cy=\"252\" r=\"86\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.14\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n\n  \u003ctext x=\"152\" y=\"112\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Muchos fol\u00edculos\u003c/text>\n  \u003ctext x=\"152\" y=\"132\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">en la ecograf\u00eda\u003c/text>\n  \u003ctext x=\"416\" y=\"112\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Regla irregular\u003c/text>\n  \u003ctext x=\"252\" y=\"330\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Signos de andr\u00f3genos\u003c/text>\n\n  \u003ctext x=\"288\" y=\"186\" font-size=\"17\" fill=\"var(--apoyo-acento, currentColor)\">2 de 3\u003c/text>\n  \u003ctext x=\"40\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Ver muchos fol\u00edculos, solo, no es el diagn\u00f3stico\u003c/text>\n\u003c/svg>", "reserva-ovarica": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>La reserva es cu\u00e1ntos quedan, no c\u00f3mo son\u003c/title>\n  \u003cdesc>Dos ovarios comparados: uno con muchos fol\u00edculos peque\u00f1os dentro y otro con pocos. El recuento de fol\u00edculos y la hormona antim\u00fclleriana miden cu\u00e1ntos quedan en el almac\u00e9n, que es una cantidad; no dicen nada sobre la calidad de esos \u00f3vulos, que depende sobre todo de la edad.\u003c/desc>\n\n  \u003cellipse cx=\"170\" cy=\"190\" rx=\"98\" ry=\"72\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.2\"\n           stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"130\" cy=\"160\" r=\"12\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"176\" cy=\"146\" r=\"10\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"214\" cy=\"176\" r=\"13\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"124\" cy=\"210\" r=\"11\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"166\" cy=\"220\" r=\"13\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"208\" cy=\"226\" r=\"9\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"196\" cy=\"192\" r=\"8\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n\n  \u003cellipse cx=\"470\" cy=\"190\" rx=\"98\" ry=\"72\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.2\"\n           stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"440\" cy=\"176\" r=\"12\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"496\" cy=\"204\" r=\"11\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Cu\u00e1ntos quedan en el almac\u00e9n\u003c/text>\n  \u003ctext x=\"98\" y=\"298\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Reserva alta\u003c/text>\n  \u003ctext x=\"398\" y=\"298\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Reserva baja\u003c/text>\n  \u003ctext x=\"40\" y=\"332\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Es una cantidad. La calidad del \u00f3vulo va sobre todo con la edad, y no se mide as\u00ed.\u003c/text>\n\u003c/svg>", "varicocele": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Varicocele: las venas de alrededor, dilatadas\u003c/title>\n  \u003cdesc>Dos dibujos del test\u00edculo con el racimo de venas que lo rodea. A la izquierda, del calibre de siempre. A la derecha, dilatadas y tortuosas. Es frecuente, muchas veces no da ning\u00fan s\u00edntoma y se detecta explorando, no preguntando.\u003c/desc>\n\n  \u003cdefs>\n    \u003cradialGradient id=\"vol\" cx=\"38%\" cy=\"32%\" r=\"72%\">\n      \u003cstop offset=\"0\" stop-color=\"var(--apoyo-tinta, currentColor)\" stop-opacity=\"0.30\"/>\n      \u003cstop offset=\"1\" stop-color=\"var(--apoyo-tinta, currentColor)\" stop-opacity=\"0.07\"/>\n    \u003c/radialGradient>\n  \u003c/defs>\n\n  \u003ctext x=\"32\" y=\"40\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">El test\u00edculo est\u00e1 rodeado por un racimo de venas que devuelven la sangre.\u003c/text>\n\n  \u003c!-- Calibre normal -->\n  \u003cg>\n    \u003cpath d=\"M138 92 C132 118 146 134 140 158 C136 174 142 184 146 196\" fill=\"none\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n    \u003cpath d=\"M160 86 C153 116 167 132 161 158 C157 176 163 186 166 198\" fill=\"none\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n    \u003cpath d=\"M182 92 C176 118 190 134 184 158 C180 174 186 184 189 196\" fill=\"none\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n    \u003cellipse cx=\"164\" cy=\"238\" rx=\"52\" ry=\"60\" fill=\"url(#vol)\"\n             stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"2\"/>\n    \u003cpath d=\"M126 224 C140 210 188 210 202 224\" fill=\"none\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"1.2\" stroke-opacity=\"0.35\"/>\n  \u003c/g>\n\n  \u003c!-- Dilatadas: mismo dibujo, venas m\u00e1s gruesas y tortuosas -->\n  \u003cg>\n    \u003cpath d=\"M452 92 C438 118 462 132 448 158 C438 176 452 186 456 198\" fill=\"none\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-opacity=\"0.9\"/>\n    \u003cpath d=\"M478 84 C462 114 488 130 472 158 C460 178 478 188 482 200\" fill=\"none\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-width=\"11\" stroke-linecap=\"round\"/>\n    \u003cpath d=\"M506 92 C492 118 516 132 502 158 C492 176 506 186 510 198\" fill=\"none\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-opacity=\"0.9\"/>\n    \u003cellipse cx=\"480\" cy=\"238\" rx=\"52\" ry=\"60\" fill=\"url(#vol)\"\n             stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"2\"/>\n    \u003cpath d=\"M442 224 C456 210 504 210 518 224\" fill=\"none\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"1.2\" stroke-opacity=\"0.35\"/>\n  \u003c/g>\n\n  \u003ctext x=\"164\" y=\"322\" font-size=\"15\" font-weight=\"600\" text-anchor=\"middle\" fill=\"var(--apoyo-tinta, currentColor)\">Calibre normal\u003c/text>\n  \u003ctext x=\"480\" y=\"322\" font-size=\"15\" font-weight=\"600\" text-anchor=\"middle\" fill=\"var(--apoyo-acento, currentColor)\">Dilatadas\u003c/text>\n\n  \u003cline x1=\"320\" y1=\"96\" x2=\"320\" y2=\"296\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.35\" stroke-dasharray=\"5 7\"/>\n\n  \u003ctext x=\"32\" y=\"350\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Es frecuente, muchas veces no se nota, y se ve explorando.\u003c/text>\n\u003c/svg>", "tres-meses-espermatozoides": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Lo que se ve hoy en el an\u00e1lisis se fabric\u00f3 en los tres meses anteriores\u003c/title>\n  \u003cdesc>Fabricar espermatozoides lleva unos tres meses. La muestra de hoy corresponde a ese tramo, as\u00ed que una fiebre o una infecci\u00f3n de hace unas semanas cae dentro y puede estar pesando en el resultado; y cualquier cambio que se haga tarda ese mismo tiempo en notarse.\u003c/desc>\n\n  \u003cpath d=\"M 70,200 L 570,200\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 90,166 L 500,166 L 500,234 L 90,234 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.14\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\"/>\n\n  \u003ccircle cx=\"520\" cy=\"200\" r=\"13\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.4\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"500\" y=\"266\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">La muestra de hoy\u003c/text>\n\n  \u003ccircle cx=\"200\" cy=\"200\" r=\"11\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.5\"\n          stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"120\" y=\"122\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Una fiebre de entonces\u003c/text>\n  \u003ctext x=\"120\" y=\"142\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">cae dentro del tramo\u003c/text>\n\n  \u003ctext x=\"86\" y=\"298\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Unos tres meses\u003c/text>\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Por eso repetir antes de tiempo no aclara nada\u003c/text>\n\u003c/svg>", "testiculo-no-descendido": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Un test\u00edculo que no baj\u00f3 a su sitio\u003c/title>\n  \u003cdesc>Dos dibujos. A la izquierda, el test\u00edculo en su sitio, fuera del cuerpo. A la derecha, uno que se qued\u00f3 arriba, dentro: ah\u00ed trabaja a la temperatura del cuerpo y no a la suya. Por eso se opera de ni\u00f1o, y la edad de esa cirug\u00eda es un dato que orienta.\u003c/desc>\n\n  \u003ctext x=\"32\" y=\"42\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">El test\u00edculo trabaja por debajo de la temperatura del cuerpo.\u003c/text>\n\n  \u003crect x=\"110\" y=\"80\" width=\"120\" height=\"110\" rx=\"14\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.14\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"1.5\"/>\n  \u003cellipse cx=\"170\" cy=\"222\" rx=\"30\" ry=\"34\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"170\" cy=\"224\" r=\"14\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.40\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"1.5\"/>\n\n  \u003crect x=\"410\" y=\"80\" width=\"120\" height=\"110\" rx=\"14\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.14\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"470\" cy=\"150\" r=\"14\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.30\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"470\" cy=\"222\" rx=\"30\" ry=\"34\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n\n  \u003ctext x=\"170\" y=\"292\" font-size=\"14\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">En su sitio\u003c/text>\n  \u003ctext x=\"470\" y=\"292\" font-size=\"14\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">Se qued\u00f3 arriba\u003c/text>\n\n  \u003ctext x=\"32\" y=\"334\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Si se queda arriba, trabaja a la del cuerpo. Por eso se opera.\u003c/text>\n\u003c/svg>", "peso-y-altura": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El mismo peso dice cosas distintas seg\u00fan la altura\u003c/title>\n  \u003cdesc>Dos siluetas del mismo peso y distinta altura sobre la misma b\u00e1scula. El n\u00famero de la b\u00e1scula es el mismo, pero junto a la altura significa cosas distintas: por eso el peso se lee siempre con la altura al lado, y aun as\u00ed es un punto de partida y no un veredicto.\u003c/desc>\n\n  \u003cpath d=\"M 150,104 C 168,104 176,120 168,134 C 182,146 186,196 180,244 C 176,272 172,286 170,296 L 130,296 C 128,286 124,272 120,244 C 114,196 118,146 132,134 C 124,120 132,104 150,104 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.3\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 450,60 C 468,60 476,76 468,90 C 484,104 488,180 482,244 C 478,272 472,286 470,296 L 430,296 C 428,286 422,272 418,244 C 412,180 416,104 432,90 C 424,76 432,60 450,60 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.3\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n\n  \u003crect x=\"96\" y=\"296\" width=\"108\" height=\"22\" rx=\"6\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.25\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003crect x=\"396\" y=\"296\" width=\"108\" height=\"22\" rx=\"6\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.25\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n\n  \u003cpath d=\"M 250,296 L 250,104 M 244,104 L 256,104 M 244,296 L 256,296\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 560,296 L 560,60 M 554,60 L 566,60 M 554,296 L 566,296\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n\n  \u003ctext x=\"40\" y=\"46\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">La b\u00e1scula marca lo mismo en los dos casos\u003c/text>\n  \u003ctext x=\"264\" y=\"204\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">altura\u003c/text>\n  \u003ctext x=\"574\" y=\"180\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">altura\u003c/text>\n  \u003ctext x=\"96\" y=\"340\" font-size=\"14\" fill=\"var(--apoyo-acento, currentColor)\">Mismo peso\u003c/text>\n  \u003ctext x=\"396\" y=\"340\" font-size=\"14\" fill=\"var(--apoyo-acento, currentColor)\">Mismo peso\u003c/text>\n\u003c/svg>", "mismo-peso-dos-recorridos": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Cuatro recorridos que acaban en el mismo n\u00famero\u003c/title>\n  \u003cdesc>Cuatro l\u00edneas de un a\u00f1o que terminan a la misma altura: una que se mantiene, una que sube, una que baja y una con vaivenes. El peso de hoy es el mismo en las cuatro; lo que informa a partir de aqu\u00ed es el recorrido, no la cifra.\u003c/desc>\n\n  \u003cpath d=\"M 70,300 L 560,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 70,80 L 70,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 70,190 C 200,190 400,190 520,190\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"2\" stroke-dasharray=\"5 6\"/>\n\n  \u003cpath d=\"M 80,190 C 200,188 400,192 520,190\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 80,268 C 200,258 400,206 520,190\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 80,110 C 200,124 400,172 520,190\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 80,150 C 140,246 200,116 260,220 C 320,132 380,240 440,152 C 480,196 500,186 520,190\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n\n  \u003ccircle cx=\"520\" cy=\"190\" r=\"10\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"538\" y=\"196\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Hoy\u003c/text>\n\n  \u003ctext x=\"40\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El mismo peso de hoy, cuatro caminos hasta \u00e9l\u003c/text>\n  \u003ctext x=\"86\" y=\"332\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Hace un a\u00f1o\u003c/text>\n  \u003ctext x=\"466\" y=\"332\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Hoy\u003c/text>\n  \u003ctext x=\"150\" y=\"268\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Vaivenes\u003c/text>\n\u003c/svg>", "tubo-neural-cierre": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El tubo del que salen el cerebro y la m\u00e9dula se cierra el primer mes\u003c/title>\n  \u003cdesc>Tres momentos del embri\u00f3n muy temprano: una l\u00e1mina plana, la l\u00e1mina que se pliega en canal y el canal ya cerrado en tubo. El cierre se completa hacia los veintiocho d\u00edas desde la concepci\u00f3n, muchas veces antes de que se sepa que hay embarazo.\u003c/desc>\n\n  \u003cpath d=\"M 60,150 C 100,138 140,138 180,150\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 60,150 C 100,162 140,162 180,150\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.4\" stroke-width=\"2\"/>\n  \u003ctext x=\"74\" y=\"206\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Una l\u00e1mina plana\u003c/text>\n\n  \u003cpath d=\"M 240,150 C 254,120 266,178 300,178 C 334,178 346,120 360,150\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 252,132 C 266,124 274,124 284,132 M 348,132 C 334,124 326,124 316,132\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"248\" y=\"206\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Se pliega en canal\u003c/text>\n\n  \u003cpath d=\"M 420,150 C 434,116 446,182 480,182 C 514,182 526,116 540,150 C 526,140 512,136 480,136 C 448,136 434,140 420,150 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.22\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n  \u003ctext x=\"430\" y=\"206\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Cerrado: es un tubo\u003c/text>\n\n  \u003cpath d=\"M 60,266 C 220,260 420,260 580,266\" fill=\"none\"\n        stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003ccircle cx=\"60\" cy=\"265\" r=\"9\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.7\"/>\n  \u003ccircle cx=\"470\" cy=\"262\" r=\"11\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.4\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"40\" y=\"300\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Concepci\u00f3n\u003c/text>\n  \u003ctext x=\"404\" y=\"300\" font-size=\"14\" fill=\"var(--apoyo-acento, currentColor)\">D\u00eda 28: ya est\u00e1 cerrado\u003c/text>\n\n  \u003ctext x=\"40\" y=\"58\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Ocurre antes de que muchas sepan que hay embarazo\u003c/text>\n\u003c/svg>", "pescado-suelo-y-techo": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El pescado azul tiene un suelo y tambi\u00e9n un techo\u003c/title>\n  \u003cdesc>Una franja con dos l\u00edmites: por debajo falta el omega-3, que en la dieta viene sobre todo del pescado azul, y por encima est\u00e1 el tope de unas dos raciones semanales para quien busca embarazo, porque estas especies acumulan contaminantes. El pescado blanco no tiene ese tope.\u003c/desc>\n\n  \u003crect x=\"150\" y=\"120\" width=\"340\" height=\"120\" rx=\"14\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n\n  \u003cpath d=\"M 150,120 L 490,120\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 150,240 L 490,240\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n\n  \u003ctext x=\"150\" y=\"104\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Techo: unas dos raciones a la semana\u003c/text>\n  \u003ctext x=\"150\" y=\"272\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Suelo: por debajo falta omega-3\u003c/text>\n\n  \u003cpath d=\"M 214,180 C 232,166 262,166 282,180 C 262,194 232,194 214,180 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 214,180 L 198,170 L 198,190 Z\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.6\"/>\n  \u003cpath d=\"M 330,180 C 348,166 378,166 398,180 C 378,194 348,194 330,180 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.5\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 330,180 L 314,170 L 314,190 Z\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.6\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El tope es solo del azul; el blanco no lo tiene\u003c/text>\n  \u003ctext x=\"40\" y=\"316\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Fresco, congelado y en conserva cuentan igual.\u003c/text>\n\u003c/svg>", "celiaquia-vellosidades": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El intestino absorbe por sus pliegues, y en la celiaqu\u00eda se aplanan\u003c/title>\n  \u003cdesc>Dos trozos de pared del intestino delgado. En la de la izquierda los pliegues est\u00e1n altos y absorben; en la de la derecha est\u00e1n aplanados, y por eso puede faltar hierro aunque se coma bien. Esa reacci\u00f3n solo aparece en el an\u00e1lisis mientras se sigue comiendo gluten.\u003c/desc>\n\n  \u003cpath d=\"M 60,240 L 260,240\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 76,240 C 74,196 82,180 80,150 M 108,240 C 106,192 114,176 112,144 M 140,240 C 138,198 146,182 144,152 M 172,240 C 170,190 178,174 176,142 M 204,240 C 202,196 210,180 208,150 M 236,240 C 234,194 242,178 240,148\"\n        fill=\"none\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"86\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Pliegues altos:\u003c/text>\n  \u003ctext x=\"86\" y=\"308\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">absorben\u003c/text>\n\n  \u003cpath d=\"M 380,240 L 580,240\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 396,240 C 394,230 402,226 400,218 M 428,240 C 426,232 434,228 432,222 M 460,240 C 458,230 466,226 464,218 M 492,240 C 490,232 498,228 496,222 M 524,240 C 522,230 530,226 528,218 M 556,240 C 554,232 562,228 560,222\"\n        fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"400\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Aplanados:\u003c/text>\n  \u003ctext x=\"400\" y=\"308\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">falta hierro aunque se coma bien\u003c/text>\n\n  \u003ctext x=\"40\" y=\"58\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Por qu\u00e9 un hierro bajo sin explicaci\u00f3n hace mirar aqu\u00ed\u003c/text>\n  \u003ctext x=\"40\" y=\"90\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">El an\u00e1lisis mide la reacci\u00f3n al gluten: sin gluten en la dieta, se apaga y sale normal.\u003c/text>\n  \u003ctext x=\"290\" y=\"196\" font-size=\"26\" fill=\"var(--apoyo-tenue, currentColor)\">\u2192\u003c/text>\n\u003c/svg>", "vitamina-d-dos-escalas": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El mismo nivel, dos n\u00fameros seg\u00fan la escala\u003c/title>\n  \u003cdesc>Dos reglas paralelas para el mismo valor de vitamina D: una en nanogramos por mililitro y otra en nanomoles por litro. El mismo punto cae en un n\u00famero distinto en cada una, as\u00ed que un n\u00famero sin su unidad no se puede interpretar.\u003c/desc>\n\n  \u003cpath d=\"M 80,150 L 560,150\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 80,142 L 80,158 M 200,142 L 200,158 M 320,142 L 320,158 M 440,142 L 440,158 M 560,142 L 560,158\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ctext x=\"66\" y=\"128\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">0\u003c/text>\n  \u003ctext x=\"186\" y=\"128\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">20\u003c/text>\n  \u003ctext x=\"306\" y=\"128\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">40\u003c/text>\n  \u003ctext x=\"426\" y=\"128\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">60\u003c/text>\n  \u003ctext x=\"546\" y=\"128\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">80\u003c/text>\n  \u003ctext x=\"80\" y=\"104\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">ng/mL\u003c/text>\n\n  \u003cpath d=\"M 80,250 L 560,250\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 80,242 L 80,258 M 200,242 L 200,258 M 320,242 L 320,258 M 440,242 L 440,258 M 560,242 L 560,258\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ctext x=\"66\" y=\"284\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">0\u003c/text>\n  \u003ctext x=\"180\" y=\"284\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">50\u003c/text>\n  \u003ctext x=\"298\" y=\"284\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">100\u003c/text>\n  \u003ctext x=\"418\" y=\"284\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">150\u003c/text>\n  \u003ctext x=\"538\" y=\"284\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">200\u003c/text>\n  \u003ctext x=\"80\" y=\"316\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">nmol/L\u003c/text>\n\n  \u003cpath d=\"M 320,150 L 320,250\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n  \u003ccircle cx=\"320\" cy=\"150\" r=\"9\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.9\"/>\n  \u003ccircle cx=\"320\" cy=\"250\" r=\"9\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.9\"/>\n  \u003ctext x=\"336\" y=\"206\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">El mismo nivel\u003c/text>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Un n\u00famero sin su unidad no se puede leer\u003c/text>\n\u003c/svg>", "reservas-hierro": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Las reservas de hierro se vac\u00edan antes de que caiga la hemoglobina\u003c/title>\n  \u003cdesc>Dos dep\u00f3sitos que se vac\u00edan a distinto ritmo: la ferritina, que son las reservas, baja primero, y la hemoglobina es lo \u00faltimo que cae. Por eso se puede tener el hierro agotado con un an\u00e1lisis de rutina todav\u00eda normal.\u003c/desc>\n\n  \u003crect x=\"110\" y=\"90\" width=\"120\" height=\"200\" rx=\"12\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003crect x=\"116\" y=\"234\" width=\"108\" height=\"50\" rx=\"8\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.45\"/>\n  \u003ctext x=\"104\" y=\"322\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Ferritina: las reservas\u003c/text>\n  \u003ctext x=\"104\" y=\"70\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Baja la primera\u003c/text>\n\n  \u003crect x=\"400\" y=\"90\" width=\"120\" height=\"200\" rx=\"12\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003crect x=\"406\" y=\"120\" width=\"108\" height=\"164\" rx=\"8\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"/>\n  \u003ctext x=\"376\" y=\"322\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Hemoglobina: la anemia\u003c/text>\n  \u003ctext x=\"376\" y=\"70\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Es lo \u00faltimo que cae\u003c/text>\n\n  \u003cpath d=\"M 252,190 C 300,186 340,186 380,190\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>\n  \u003ctext x=\"240\" y=\"166\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Mismo d\u00eda,\u003c/text>\n  \u003ctext x=\"240\" y=\"222\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">mismo an\u00e1lisis\u003c/text>\n\u003c/svg>", "tabaco-lo-que-vuelve": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Durante el primer a\u00f1o sin fumar, buena parte de lo perdido vuelve\u003c/title>\n  \u003cdesc>Una l\u00ednea que baja mientras se fuma y remonta al dejarlo: durante el primer a\u00f1o sin tabaco buena parte de lo perdido puede recuperarse. Es la mitad de la historia que casi nunca se cuenta, y es donde m\u00e1s se gana por lo que cuesta.\u003c/desc>\n\n  \u003cpath d=\"M 70,300 L 570,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 70,120 C 140,150 200,206 290,238\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 290,238 C 370,206 450,166 560,142\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n\n  \u003ccircle cx=\"290\" cy=\"238\" r=\"11\" fill=\"var(--apoyo-tinta, currentColor)\" fill-opacity=\"0.25\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 290,252 L 290,286\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n  \u003ctext x=\"248\" y=\"326\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Se deja de fumar\u003c/text>\n\n  \u003ctext x=\"86\" y=\"106\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Mientras se fuma\u003c/text>\n  \u003ctext x=\"404\" y=\"122\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">El primer a\u00f1o sin fumar\u003c/text>\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Lo que el tabaco mueve puede volver en parte\u003c/text>\n\u003c/svg>", "consumicion-semanal": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Lo que se cuenta son consumiciones a la semana\u003c/title>\n  \u003cdesc>Una consumici\u00f3n es una ca\u00f1a, una copa de vino o un combinado. Lo medido es cu\u00e1ntas suman en la semana, no cada cu\u00e1nto se bebe: una copa al d\u00eda son siete a la semana y cuatro al d\u00eda son veintiocho, as\u00ed que la frecuencia sola no dice de qu\u00e9 lado cae.\u003c/desc>\n\n  \u003cpath d=\"M 96,120 C 96,164 106,192 124,204 L 124,240 L 106,240 L 106,252 L 158,252 L 158,240 L 140,240 L 140,204 C 158,192 168,164 168,120 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 100,140 C 120,134 144,134 164,140\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"92\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Una copa\u003c/text>\n\n  \u003cpath d=\"M 260,116 L 340,116 L 332,246 L 268,246 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 264,152 C 288,146 312,146 336,152\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"264\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Una ca\u00f1a\u003c/text>\n\n  \u003cpath d=\"M 430,116 L 510,116 L 502,246 L 438,246 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 434,152 C 458,146 482,146 506,152\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 470,100 L 470,146\" stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"426\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Un combinado\u003c/text>\n\n  \u003ctext x=\"40\" y=\"58\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Las tres cuentan igual: una consumici\u00f3n\u003c/text>\n  \u003ctext x=\"40\" y=\"326\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Una al d\u00eda son siete a la semana. Cuatro al d\u00eda, veintiocho.\u003c/text>\n\u003c/svg>", "plastico-y-calor": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El envase cede lo suyo sobre todo cuando se calienta\u003c/title>\n  \u003cdesc>El mismo recipiente de pl\u00e1stico en dos situaciones: fr\u00edo en la nevera, donde apenas pasa nada a la comida, y caliente en el microondas, donde el envase cede parte de lo suyo. Lo que se pregunta no es el pl\u00e1stico en s\u00ed, sino el calor.\u003c/desc>\n\n  \u003cpath d=\"M 96,150 L 236,150 L 222,262 L 110,262 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 88,142 L 244,142\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 122,206 C 152,200 180,200 210,206\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"106\" y=\"300\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">Fr\u00edo: apenas pasa nada\u003c/text>\n\n  \u003cpath d=\"M 404,150 L 544,150 L 530,262 L 418,262 Z\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 396,142 L 552,142\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 430,206 C 460,200 488,200 518,206\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 440,124 C 434,108 452,102 446,86 M 474,124 C 468,108 486,102 480,86 M 508,124 C 502,108 520,102 514,86\"\n        fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"404\" y=\"300\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Caliente: el envase cede\u003c/text>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El mismo t\u00e1per, dos situaciones\u003c/text>\n  \u003ctext x=\"40\" y=\"336\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Microondas, film por encima o l\u00edquido caliente en vaso de pl\u00e1stico.\u003c/text>\n\u003c/svg>", "luz-y-sueno": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>La media hora justo antes de dormir\u003c/title>\n  \u003cdesc>Lo que se pregunta no es usar el m\u00f3vil por la noche en general, sino la media hora justo anterior a dormir: es el tramo que se recoge, y por s\u00ed solo no abre ninguna prueba ni decide nada.\u003c/desc>\n\n  \u003cpath d=\"M 70,200 L 570,200\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003crect x=\"410\" y=\"160\" width=\"110\" height=\"80\" rx=\"12\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n\n  \u003ccircle cx=\"520\" cy=\"200\" r=\"13\" fill=\"var(--apoyo-tinta, currentColor)\" fill-opacity=\"0.3\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 546,192 C 552,178 566,176 574,182 C 566,196 554,200 546,192 Z\"\n        fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.5\"/>\n\n  \u003ctext x=\"392\" y=\"140\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">La media hora de antes\u003c/text>\n  \u003ctext x=\"496\" y=\"256\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Dormir\u003c/text>\n  \u003ctext x=\"86\" y=\"264\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">El resto de la noche no es lo que se pregunta\u003c/text>\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Un tramo corto, y solo ese\u003c/text>\n  \u003ctext x=\"40\" y=\"316\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Se lee junto al ejercicio y al resto de h\u00e1bitos, nunca aparte.\u003c/text>\n\u003c/svg>", "translocacion-equilibrada": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Todo el material, colocado de otra manera\u003c/title>\n  \u003cdesc>Dos parejas de cromosomas. Arriba, la disposici\u00f3n corriente. Abajo, dos cromosomas que se han intercambiado un trozo: no falta ni sobra nada, as\u00ed que quien lo lleva est\u00e1 sano. Al repartirse para formar el \u00f3vulo o el espermatozoide, ese trozo puede irse solo, y entonces al embri\u00f3n le falta o le sobra material.\u003c/desc>\n\n  \u003cpath d=\"M 120,80 C 108,80 102,92 108,104 L 122,132 C 128,144 140,144 146,132 L 160,104 C 166,92 160,80 148,80 C 140,80 136,88 134,96 C 132,88 128,80 120,80 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.35\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 220,80 C 208,80 202,92 208,104 L 222,132 C 228,144 240,144 246,132 L 260,104 C 266,92 260,80 248,80 C 240,80 236,88 234,96 C 232,88 228,80 220,80 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n\n  \u003cpath d=\"M 120,216 C 108,216 102,228 108,240 L 122,268 C 128,280 140,280 146,268 L 160,240 C 166,228 160,216 148,216 C 140,216 136,224 134,232 C 132,224 128,216 120,216 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 220,216 C 208,216 202,228 208,240 L 222,268 C 228,280 240,280 246,268 L 260,240 C 266,228 260,216 248,216 C 240,216 236,224 234,232 C 232,224 228,216 220,216 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.35\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 170,166 C 190,150 210,150 226,166\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 226,166 C 210,182 190,182 170,166\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">No falta nada: est\u00e1 en otro sitio\u003c/text>\n  \u003ctext x=\"300\" y=\"110\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">Colocaci\u00f3n corriente\u003c/text>\n  \u003ctext x=\"300\" y=\"244\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Dos cromosomas se han\u003c/text>\n  \u003ctext x=\"300\" y=\"268\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">intercambiado un trozo\u003c/text>\n  \u003ctext x=\"40\" y=\"324\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Quien lo lleva est\u00e1 sano. El problema aparece al repartirlo: ese trozo puede\u003c/text>\n  \u003ctext x=\"40\" y=\"346\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">irse solo, y entonces al embri\u00f3n le falta o le sobra material.\u003c/text>\n\u003c/svg>", "misma-copia-estropeada": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El problema aparece cuando los dos llevan estropeada la misma copia\u003c/title>\n  \u003cdesc>Cada persona lleva dos copias de cada gen, y con una copia sana basta. Si cada miembro de la pareja lleva estropeada una copia distinta, no coinciden; si los dos llevan estropeada la misma, esa combinaci\u00f3n puede darse en el embri\u00f3n. Compartir antepasados hace que eso coincida m\u00e1s a menudo.\u003c/desc>\n\n  \u003cpath d=\"M 110,110 L 110,190 M 140,110 L 140,190\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 140,110 L 140,190\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"82\" y=\"226\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Una copia sana\u003c/text>\n  \u003ctext x=\"82\" y=\"246\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">y una estropeada\u003c/text>\n\n  \u003cpath d=\"M 300,110 L 300,190 M 330,110 L 330,190\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 330,110 L 330,190\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"272\" y=\"226\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Lo mismo, en la otra\u003c/text>\n\n  \u003cpath d=\"M 150,250 C 200,286 240,296 300,300 M 316,250 C 320,270 320,286 316,300\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>\n\n  \u003cpath d=\"M 470,110 L 470,190 M 500,110 L 500,190\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"10\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"424\" y=\"226\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Las dos estropeadas:\u003c/text>\n  \u003ctext x=\"424\" y=\"246\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">no queda copia buena\u003c/text>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Solo cuenta cuando es la misma copia en los dos\u003c/text>\n  \u003ctext x=\"40\" y=\"330\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Con copias estropeadas distintas, cada una tapa la del otro.\u003c/text>\n\u003c/svg>", "cortisol-eje": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El estr\u00e9s sostenido llega al ciclo por arriba\u003c/title>\n  \u003cdesc>El cerebro, que es de donde salen las \u00f3rdenes del ciclo, y a su lado la se\u00f1al de estr\u00e9s sostenido. Cuando esa se\u00f1al se mantiene mucho tiempo, la orden que baja hacia el ovario se vuelve irregular, y eso se nota en el ciclo. No significa que el estr\u00e9s cause infertilidad: significa que un estr\u00e9s que dura tiene efectos que se miden.\u003c/desc>\n\n  \u003cpath d=\"M 150,110 C 118,110 96,134 100,164 C 104,196 138,212 172,202 C 206,192 214,150 192,124 C 182,112 166,110 150,110 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 118,150 C 134,138 150,158 168,144\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.45\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 122,176 C 140,166 154,182 172,170\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.45\" stroke-width=\"2\"/>\n\n  \u003cpath d=\"M 152,214 C 152,240 150,260 148,282\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003cellipse cx=\"148\" cy=\"304\" rx=\"30\" ry=\"22\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n           stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n\n  \u003cpath d=\"M 300,120 C 330,116 350,140 342,160 C 334,180 356,190 366,178\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 300,150 C 336,146 352,168 344,188\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.55\" stroke-width=\"3\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Lo que dura, se nota; lo puntual, no\u003c/text>\n  \u003ctext x=\"210\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">De aqu\u00ed salen las \u00f3rdenes del ciclo\u003c/text>\n  \u003ctext x=\"200\" y=\"308\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Ovario\u003c/text>\n  \u003ctext x=\"390\" y=\"150\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Estr\u00e9s sostenido\u003c/text>\n  \u003ctext x=\"40\" y=\"344\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">No es que el estr\u00e9s cause infertilidad: es que un estr\u00e9s que dura tiene efectos que se miden.\u003c/text>\n\u003c/svg>", "turno-de-noche": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El turno de noche desplaza el reloj del cuerpo\u003c/title>\n  \u003cdesc>Dos relojes de un d\u00eda: en el de arriba la actividad coincide con la luz y el descanso con la noche; en el de abajo est\u00e1n cambiados. Trabajar a turnos se asocia a reglas m\u00e1s irregulares, y es de lo poco de esta \u00e1rea con un efecto medido sobre el cuerpo.\u003c/desc>\n\n  \u003ccircle cx=\"180\" cy=\"170\" r=\"80\" fill=\"none\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 180,90 A 80,80 0 0 1 180,250 Z\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.22\"/>\n  \u003cpath d=\"M 180,250 A 80,80 0 0 1 180,90 Z\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.45\"/>\n  \u003ctext x=\"212\" y=\"150\" font-size=\"14\" fill=\"var(--apoyo-acento, currentColor)\">D\u00eda\u003c/text>\n  \u003ctext x=\"118\" y=\"200\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Noche\u003c/text>\n  \u003ctext x=\"126\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Actividad con la luz\u003c/text>\n\n  \u003ccircle cx=\"440\" cy=\"170\" r=\"80\" fill=\"none\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 440,90 A 80,80 0 0 1 440,250 Z\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.45\"/>\n  \u003cpath d=\"M 440,250 A 80,80 0 0 1 440,90 Z\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.18\"/>\n  \u003ctext x=\"470\" y=\"150\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Descanso\u003c/text>\n  \u003ctext x=\"372\" y=\"200\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Trabajo\u003c/text>\n  \u003ctext x=\"378\" y=\"288\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">El reloj, cambiado\u003c/text>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El mismo d\u00eda, con las horas al rev\u00e9s\u003c/text>\n\u003c/svg>", "nk-utero": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Las NK del \u00fatero no son las de la sangre\u003c/title>\n  \u003cdesc>Dos escenarios con las mismas siglas. En la sangre, las c\u00e9lulas NK vigilan y destruyen; en el \u00fatero, unas c\u00e9lulas distintas y con el mismo nombre trabajan abriendo paso a los vasos que alimentar\u00e1n la placenta. Contarlas en sangre no dice lo que est\u00e1 pasando en el \u00fatero: son poblaciones diferentes.\u003c/desc>\n\n  \u003ccircle cx=\"150\" cy=\"170\" r=\"86\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.14\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.45\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"122\" cy=\"148\" r=\"17\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"176\" cy=\"160\" r=\"15\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"142\" cy=\"200\" r=\"16\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.5\"/>\n  \u003ccircle cx=\"186\" cy=\"204\" r=\"12\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.5\"/>\n\n  \u003ccircle cx=\"450\" cy=\"170\" r=\"86\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.12\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"424\" cy=\"150\" r=\"17\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.55\"/>\n  \u003ccircle cx=\"478\" cy=\"164\" r=\"15\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.55\"/>\n  \u003ccircle cx=\"442\" cy=\"202\" r=\"16\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.55\"/>\n  \u003cpath d=\"M 396,232 C 430,214 470,214 504,232\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Mismo nombre, dos poblaciones distintas\u003c/text>\n  \u003ctext x=\"96\" y=\"290\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">En la sangre: vigilan\u003c/text>\n  \u003ctext x=\"374\" y=\"290\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">En el \u00fatero: abren paso\u003c/text>\n  \u003ctext x=\"374\" y=\"312\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">a los vasos de la placenta\u003c/text>\n  \u003ctext x=\"40\" y=\"344\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Contarlas en sangre no dice lo que ocurre en el \u00fatero.\u003c/text>\n\u003c/svg>", "anticuerpos-y-funcion": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Tener anticuerpos y que la gl\u00e1ndula no rinda son dos cosas\u003c/title>\n  \u003cdesc>Dos preguntas que se mezclan siempre. Una: si salen anticuerpos en la anal\u00edtica, que es lo m\u00e1s frecuente y puede ir con la funci\u00f3n normal. Otra: si la gl\u00e1ndula rinde, que es lo que dice la TSH. Se pueden tener anticuerpos con la funci\u00f3n en su sitio.\u003c/desc>\n\n  \u003cpath d=\"M 150,180 C 122,160 118,128 140,118 C 152,112 166,122 172,134 C 178,122 192,112 204,118 C 226,128 222,160 194,180 C 180,190 164,190 150,180 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.22\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 108,110 L 118,124 M 100,140 L 114,146 M 106,176 L 120,172 M 236,110 L 226,124 M 244,140 L 230,146 M 238,176 L 224,172\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"88\" y=\"236\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Salen anticuerpos\u003c/text>\n  \u003ctext x=\"88\" y=\"258\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Es lo m\u00e1s frecuente\u003c/text>\n\n  \u003cpath d=\"M 430,180 C 402,160 398,128 420,118 C 432,112 446,122 452,134 C 458,122 472,112 484,118 C 506,128 502,160 474,180 C 460,190 444,190 430,180 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.22\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 452,206 C 450,224 450,240 452,258\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"452\" cy=\"288\" r=\"16\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.4\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003ctext x=\"330\" y=\"248\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">\u00bfRinde la gl\u00e1ndula?\u003c/text>\n  \u003ctext x=\"330\" y=\"322\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Eso lo dice la TSH\u003c/text>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Dos preguntas distintas sobre la misma gl\u00e1ndula\u003c/text>\n  \u003ctext x=\"306\" y=\"150\" font-size=\"26\" fill=\"var(--apoyo-tenue, currentColor)\">\u2260\u003c/text>\n\u003c/svg>", "antifosfolipido-placenta": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Coagular de m\u00e1s justo donde se est\u00e1 formando la placenta\u003c/title>\n  \u003cdesc>Los vasos peque\u00f1os que unen el \u00fatero con la placenta, dibujados con la sangre pasando; al lado, los mismos vasos con un co\u00e1gulo dentro que estrecha el paso. Los anticuerpos antifosfol\u00edpido favorecen esos co\u00e1gulos en el sitio donde se est\u00e1 formando la placenta, y ese es el mecanismo por el que se asocian a la p\u00e9rdida.\u003c/desc>\n\n  \u003cpath d=\"M 40,120 C 90,100 140,140 190,118 C 240,96 270,140 300,124\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 40,120 C 90,100 140,140 190,118 C 240,96 270,140 300,124\" fill=\"none\"\n        stroke=\"var(--apoyo-suave, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 40,272 C 90,252 140,292 190,270 C 240,248 270,292 300,276\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"14\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 40,272 C 90,252 140,292 190,270 C 240,248 270,292 300,276\" fill=\"none\"\n        stroke=\"var(--apoyo-suave, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  \u003ccircle cx=\"150\" cy=\"282\" r=\"13\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"172\" cy=\"276\" r=\"10\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.7\"/>\n\n  \u003cpath d=\"M 340,80 C 420,60 520,80 580,140 C 610,172 600,236 560,268 C 500,314 400,308 340,280\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El paso se estrecha donde m\u00e1s falta hace\u003c/text>\n  \u003ctext x=\"40\" y=\"168\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Vaso que llega a la placenta: la sangre pasa\u003c/text>\n  \u003ctext x=\"40\" y=\"324\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Con un co\u00e1gulo dentro, el paso se estrecha\u003c/text>\n  \u003ctext x=\"392\" y=\"180\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Placenta en\u003c/text>\n  \u003ctext x=\"392\" y=\"204\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">formaci\u00f3n\u003c/text>\n\u003c/svg>"}}</script>
<script>const DATOS = JSON.parse(document.getElementById('datos').textContent);
const AREAS = DATOS.areas;
const FIGURAS = DATOS.figuras;

/* Lo contestado, en memoria. Esto es un prototipo para mirar y comentar: no hay servidor
   detrás, así que nada se guarda y nada se cierra. En el producto, contestar puede sellar
   un área entera y llevarse por delante sus preguntas. */
const respuestas = {};
const app = document.getElementById('lienzo');

const areaDe = (slug) => AREAS.find((a) => a.area === slug);
const contestadas = (a) => a.preguntas.filter((p) => respuestas[p.clave]).length;
const terminada = (a) => contestadas(a) === a.preguntas.length;
const empezada = (a) => contestadas(a) > 0;

function primeraSinContestar(a) {
  return a.preguntas.find((p) => !respuestas[p.clave]) || a.preguntas[a.preguntas.length - 1];
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Los skills marcan en negrita lo que hay que retener. En la app lo pinta un componente;
   aquí se resuelve al escapar, o los asteriscos se leen tal cual. */
const negrita = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

const CANDADO =
  '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden><path d="M4.5 7V5a3.5 3.5 0 1 1 7 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="3" y="7" width="10" height="7" rx="1.6" fill="currentColor"/></svg>';


/* ── Entrar ───────────────────────────────────────────────────────────────────
 * La pantalla de acceso del producto: correo y código de seis dígitos, sin
 * contraseñas. Aquí no hay correo que enviar, así que el código es 000000 y se
 * dice en pantalla: una demo que pide algo que no puede dar es una demo rota. */
let acceso = { fase: 'correo', correo: '', aviso: '', error: '' };

function pintaEntrar() {
  const codigo = acceso.fase === 'codigo';
  return `<main class="pagina" style="max-width:30rem">
    <header class="cabecera">
      <h1 class="titulo">Entrar en tu recorrido</h1>
      <p class="sub">Con tu correo. Te mandamos un código de seis dígitos, sin contraseñas que recordar.</p>
    </header>

    <div class="tarjeta">
      ${codigo ? `
        <form data-form="codigo">
          <p class="rotulo">El código que te ha llegado</p>
          <input class="campo" name="codigo" inputmode="numeric" maxlength="6" required autofocus
                 placeholder="000000" style="width:100%;letter-spacing:0.4em;font-size:1.3rem" value="">
          <div class="mandos" style="margin-top:0.9rem">
            <button type="submit" class="mando">Entrar</button>
            <button type="button" class="saberMas" data-volver>Usar otro correo</button>
          </div>
        </form>` : `
        <form data-form="correo">
          <p class="rotulo">Tu correo</p>
          <input class="campo" name="correo" type="email" required autofocus
                 placeholder="nombre@gmail.com" style="width:100%" value="${esc(acceso.correo)}">
          <button type="submit" class="mando" style="margin-top:0.9rem">Enviarme el código</button>
        </form>`}

      ${acceso.aviso && codigo ? `<p class="laminaPie">${esc(acceso.aviso)}</p>` : ''}
      ${acceso.error ? `<p class="error" role="alert" style="margin-top:0.9rem">${esc(acceso.error)}</p>` : ''}
    </div>

    <p class="aviso">Este circuito recoge y organiza información para que un profesional la valore.
    No emite diagnósticos ni tratamientos.</p>
  </main>`;
}

/* ── El mapa ─────────────────────────────────────────────────────────────── */
function pintaMapa() {
  const abierta = AREAS.find((a) => !terminada(a));
  const filas = AREAS.map((a, i) => {
    const hecha = terminada(a);
    const toca = a === abierta;
    const bloqueada = !hecha && !toca;
    const marca = hecha ? '✓' : bloqueada ? CANDADO : String(i + 1);
    const chips = [];
    if (hecha) chips.push('<span class="chip chipHecho">hecha</span>');
    else if (toca) chips.push(`<span class="chip ${empezada(a) ? 'chipCurso' : 'chipToca'}">${empezada(a) ? 'a medias' : 'empieza por aquí'}</span>`);
    else chips.push(`<span class="turnoRotulo">${CANDADO} la ${i + 1}ª del recorrido</span>`);
    chips.push(`<span class="chip chipNeutro">${contestadas(a)} de ${a.preguntas.length}</span>`);

    return `<li class="seccion ${bloqueada ? 'bloqueada' : ''} ${toca ? 'abierta' : ''}">
      <div class="filaSeccion">
        <span class="turno ${hecha ? 'turnoHecho' : ''} ${toca ? 'turnoToca' : ''} ${bloqueada ? 'turnoCerrado' : ''}" aria-hidden>${marca}</span>
        <div class="cuerpo">
          ${bloqueada ? `<span class="nombre">${esc(a.nombre)}</span>`
            : `<a class="nombreEnlace" href="#/a/${a.area}">${esc(a.nombre)}</a>`}
          <p class="definicion">${negrita(a.para_que)}</p>
          <p class="porque">${hecha ? 'recorrida entera' : toca ? 'toca ahora' : 'se abre al terminar la anterior'}</p>
          <div class="etiquetas">${chips.join('')}</div>
        </div>
        ${bloqueada ? '' : `<span class="entrar" aria-hidden>${hecha ? 'Ver' : 'Entrar'} ›</span>`}
      </div>
    </li>`;
  }).join('');

  return `<main class="pagina">
    <header class="cabecera">
      <h1 class="titulo">Tu recorrido</h1>
      <p class="sub">${abierta ? `Ahora toca: ${esc(abierta.nombre)}.` : 'Has recorrido todo lo que te correspondía.'} El orden es el tuyo: sale de lo que has contestado al principio.</p>
    </header>
    <p class="puertaDePago">
      <span>El triaje es la parte gratuita. El resto del recorrido se abre al contratar la asesoría, y antes de eso hay una conversación con una persona del equipo.</span>
      <a href="#/servicio">Ver mi recorrido y lo que cuesta →</a>
    </p>
    <ol class="mapa">${filas}</ol>
    <p class="aviso">Este circuito recoge y organiza información para que un profesional la valore. No emite diagnósticos ni tratamientos: ningún informe llega a la paciente sin la firma del responsable clínico del área.</p>
  </main>`;
}

/* ── El artículo ─────────────────────────────────────────────────────────── */
function pintaBloques(bloques) {
  return bloques.map((b) => {
    if (b.tipo === 'titulo') return `<h2 class="articuloTitulo">${negrita(b.texto)}</h2>`;
    if (b.tipo === 'parrafo') return `<p class="articuloParrafo">${negrita(b.texto)}</p>`;
    if (b.tipo === 'lista') {
      return `<ul class="lista">${b.puntos.map((p) => `<li><strong>${esc(p.rotulo)}</strong> — ${negrita(p.texto)}</li>`).join('')}</ul>`;
    }
    if (b.tipo === 'figura') {
      return b.imagenes.map((im) => `<figure class="figura">
        <div class="canvas-dark">${FIGURAS[im.svg] || ''}</div>
        ${im.pie ? `<figcaption>${esc(im.pie)}</figcaption>` : ''}
      </figure>`).join('');
    }
    return '';
  }).join('');
}

function pintaCuestionario(p) {
  if (!p.opciones.length) {
    return `<section class="cuestionario">
      <p class="rotulo">${negrita(p.objetivo.que)}</p>
      <h2 class="pregunta">${negrita(p.texto)}</h2>
      ${p.ayuda ? `<p class="ayuda">${negrita(p.ayuda)}</p>` : ''}
      <form class="escribir" data-clave="${p.clave}">
        <input class="campo" type="${p.tipo === 'numero' ? 'number' : 'text'}" value="${esc(respuestas[p.clave] || '')}" placeholder="${p.tipo === 'numero' ? 'Escribe el número' : 'Escribe tu respuesta'}" aria-label="${negrita(p.texto)}">
        <button type="submit" class="mando">Continuar</button>
      </form>
    </section>`;
  }

  const opciones = p.opciones.map((o, i) => {
    const puesta = respuestas[p.clave] === o.valor;
    const hayMas = Boolean(o.aclara || o.abre);
    /* Dentro va la definición de la respuesta —qué cuenta como pérdida, qué cuenta como
       trombosis—, así que la pista nombra lo que hay y no la acción: con un rótulo mudo
       nadie lo abre, y quien no lo abra contesta sin la definición. */
    const rotulo = o.aclara && o.abre ? 'qué cuenta aquí y qué abre' : o.aclara ? 'qué cuenta aquí' : 'qué abre esta respuesta';
    const pista = hayMas
      ? `<span class="abrePista" aria-hidden><svg viewBox="0 0 16 16" width="11" height="11" class="flecha"><path d="M6 3.5 L10.5 8 L6 12.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="pistaTexto">${rotulo}</span></span>`
      : '';
    return `<div class="opcion ${puesta ? 'elegida' : ''}" data-opcion="${i}" data-rotulo="${esc(rotulo)}">
      <div class="opcionFila">
        <button type="button" class="marca" aria-pressed="${puesta}" aria-label="Marcar: ${esc(o.texto)}" data-marca="${esc(o.valor)}" data-clave="${p.clave}"><span aria-hidden>${puesta ? '✓' : ''}</span></button>
        <button type="button" class="opcionCuerpo" ${hayMas ? 'aria-expanded="false"' : 'disabled'}>
          <span class="opcionTexto">${esc(o.texto)}</span>${pista}
        </button>
      </div>
      ${hayMas ? `<div class="abreTexto" hidden>
        ${o.aclara ? `<p class="abreAclara">${negrita(o.aclara)}</p>` : ''}
        ${o.abre ? `<p class="abreQue">${negrita(o.abre)}</p>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');

  return `<section class="cuestionario" aria-label="La pregunta">
    <p class="rotulo">${negrita(p.objetivo.que)}</p>
    <h2 class="pregunta">${negrita(p.texto)}</h2>
    ${p.ayuda ? `<p class="ayuda">${negrita(p.ayuda)}</p>` : ''}
    <p class="instruccion">Marca el círculo de la que mejor describe tu caso · toca la respuesta para ver qué cuenta y qué abre</p>
    <div class="opciones" role="group" aria-label="Respuestas">${opciones}</div>
  </section>`;
}

function pintaArea(slug, claveVista) {
  const a = areaDe(slug);
  if (!a) return pintaMapa();
  const p = claveVista ? a.preguntas.find((q) => q.clave === claveVista) : primeraSinContestar(a);

  const pasos = a.preguntas.map((q, i) => {
    const hecha = Boolean(respuestas[q.clave]);
    const aqui = q.clave === p.clave;
    return `<button type="button" class="paso ${hecha ? 'pasoHecho' : ''} ${aqui ? 'pasoActual' : ''}" data-ir="${q.clave}" title="${esc(q.texto)}">${i + 1}</button>`;
  }).join('');

  const n = a.preguntas.indexOf(p) + 1;
  return `<main class="pagina">
    <p><a href="#/mapa">← Volver al mapa</a></p>
    <header class="cabecera">
      <h1 class="titulo">${esc(a.nombre)}</h1>
      <p class="sub">${negrita(a.para_que)}</p>
      <div class="pasos">${pasos}</div>
      <p class="dato">${n} de ${a.preguntas.length} · ${negrita(p.objetivo.que)}</p>
    </header>
    <article class="articulo">${pintaBloques(p.bloques)}</article>
    ${pintaCuestionario(p)}
    ${terminada(a) ? `<p class="aviso">Has recorrido esta parte entera. <a href="#/a/${a.area}/informe">Ver lo que se ha recogido</a>.</p>` : ''}
  </main>`;
}

/* ── El informe del área ─────────────────────────────────────────────────── */
function pintaInforme(slug) {
  const a = areaDe(slug);
  const filas = a.preguntas.filter((p) => respuestas[p.clave]).map((p) => `
    <li><strong>${negrita(p.texto)}</strong><br><span class="dato">Contestado: ${esc(respuestas[p.clave])} · fuente: la paciente</span></li>`).join('');
  const faltan = a.preguntas.filter((p) => !respuestas[p.clave]);

  return `<main class="pagina">
    <p><a href="#/a/${a.area}">← Volver a ${esc(a.nombre)}</a></p>
    <header class="cabecera">
      <h1 class="titulo">Lo que se ha recogido</h1>
      <p class="sub">${esc(a.nombre)} · se recoge, no se redacta: cada respuesta con su fuente, y lo que quedó sin cubrir.</p>
    </header>
    <div class="tarjetaServicio">
      <span class="chip chipSello">borrador · pendiente de firma</span>
      <h3 class="subtitulo">Respondido</h3>
      <ul class="lista">${filas || '<li>Todavía no hay nada contestado en esta parte.</li>'}</ul>
      ${faltan.length ? `<h3 class="subtitulo">Sin cubrir</h3><ul class="lista">${faltan.map((p) => `<li>${negrita(p.texto)}</li>`).join('')}</ul>` : ''}
    </div>
    <p class="aviso">Un borrador que se lee como si estuviera firmado es exactamente lo que este circuito no puede permitirse.</p>
  </main>`;
}

/* ── Lo que cuesta ───────────────────────────────────────────────────────── */
function pintaServicio() {
  const recorrido = AREAS.filter((a) => a.area !== 'triaje-reproductivo');
  const conHallazgo = recorrido.filter((a) => terminada(a)).slice(0, 2);
  const lista = (as) => as.map((a) => `<li><strong>${esc(a.nombre)}</strong> — ${esc(a.para_que.split('.')[0])}</li>`).join('');

  return `<main class="pagina">
    <p><a href="#/mapa">← Volver al mapa</a></p>
    <header class="cabecera">
      <h1 class="titulo">Tu recorrido y lo que cuesta</h1>
      <p class="sub">El triaje que acabas de hacer no se cobra. Con él sabemos por dónde va tu caso y podemos decirte un rango; el número exacto sale de la primera consulta.</p>
    </header>

    <section class="tarjetaServicio">
      <p class="rotulo">Hasta aquí, gratis</p>
      <h2 class="pregunta">Esto es lo que hemos visto</h2>
      <h3 class="subtitulo">El recorrido que te toca</h3>
      <ul class="lista">${lista(recorrido)}</ul>
      <p class="precio"><strong>380 € – 510 €</strong><span>Es una estimación, no un presupuesto cerrado: la primera consulta comprueba que lo contestado se corresponde con el caso, y el número de consultas externas puede variar.</span></p>
      <p class="sub">El paso siguiente es una conversación con una persona del equipo: repasa lo que ha salido del triaje, resuelve dudas y confirma el recorrido antes de empezar.</p>
      <div class="decisiones">
        <button type="button" class="opcion opcionDecision">Quiero seguir con el recorrido</button>
        <button type="button" class="opcion opcionSecundaria">De momento no</button>
      </div>
    </section>

    <section class="tarjetaServicio">
      <p class="rotulo">Con quién seguir</p>
      <h2 class="pregunta">Dos opciones, y te decimos cuál recomendamos</h2>
      <article class="opcionPack opcionPackTop">
        <header class="opcionPackCabecera">
          <h3 class="subtitulo">Donde el circuito ha encontrado algo</h3>
          <span class="chip chipRecomendado">la que recomendamos</span>
        </header>
        <p class="sub">Responde a lo que ha salido en tu recorrido, y es lo que recomendamos.</p>
        <ul class="lista">${lista(conHallazgo.length ? conHallazgo : recorrido.slice(0, 2))}</ul>
        <p class="precio"><strong>153 € – 207 €</strong><span>Dos consultas por videollamada. De cada una vuelve un informe.</span></p>
        <button type="button" class="opcion opcionDecision">Elegir esta</button>
      </article>
      <article class="opcionPack">
        <header class="opcionPackCabecera"><h3 class="subtitulo">Todas las áreas de tu recorrido</h3></header>
        <p class="sub">Incluye también las áreas que quedaron limpias. Cuesta más y lo decides tú: hay quien prefiere cerrar el cuadro entero.</p>
        <p class="precio"><strong>455 € – 615 €</strong><span>Ocho consultas por videollamada.</span></p>
        <button type="button" class="opcion opcionSecundaria">Elegir esta</button>
      </article>
      <p class="aviso">Las consultas se hacen por videollamada con profesionales de nuestra red. De cada una vuelve un informe, y esos informes son los que se cruzan al final.</p>
    </section>
  </main>`;
}

/* ── Router ──────────────────────────────────────────────────────────────── */
function pinta() {
  const ruta = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let html;
  if (ruta[0] === 'entrar' || ruta.length === 0) html = pintaEntrar();
  else if (ruta[0] === 'a' && ruta[2] === 'informe') html = pintaInforme(ruta[1]);
  else if (ruta[0] === 'a') html = pintaArea(ruta[1], vista[ruta[1]]);
  else if (ruta[0] === 'servicio') html = pintaServicio();
  else if (ruta[0] === 'mapa') html = pintaMapa();
  else html = pintaEntrar();

  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'instant' });
  marcaRuta();
}

const vista = {};

function marcaRuta() {}

app.addEventListener('click', (e) => {
  const marca = e.target.closest('.marca');
  if (marca) {
    const { clave, marca: valor } = marca.dataset;
    respuestas[clave] = respuestas[clave] === valor ? undefined : valor;
    if (!respuestas[clave]) delete respuestas[clave];
    const slug = location.hash.split('/')[2];
    delete vista[slug];
    pinta();
    return;
  }

  const cuerpo = e.target.closest('.opcionCuerpo');
  if (cuerpo && !cuerpo.disabled) {
    const fila = cuerpo.closest('.opcion');
    const abre = fila.querySelector('.abreTexto');
    const abierta = cuerpo.getAttribute('aria-expanded') === 'true';
    app.querySelectorAll('.opcionCuerpo[aria-expanded]').forEach((o) => {
      o.setAttribute('aria-expanded', 'false');
      const t = o.querySelector('.pistaTexto');
      if (t) t.textContent = o.closest('.opcion').dataset.rotulo;
    });
    app.querySelectorAll('.abreTexto').forEach((p) => (p.hidden = true));
    if (!abierta) {
      cuerpo.setAttribute('aria-expanded', 'true');
      abre.hidden = false;
      cuerpo.querySelector('.pistaTexto').textContent = 'ocultar';
    }
    return;
  }

  const paso = e.target.closest('.paso[data-ir]');
  if (paso) {
    vista[location.hash.split('/')[2]] = paso.dataset.ir;
    pinta();
  }
});

app.addEventListener('click', (e) => {
  if (e.target.closest('[data-volver]')) {
    acceso = { fase: 'correo', correo: acceso.correo, aviso: '', error: '' };
    pinta();
  }
});

app.addEventListener('submit', (e) => {
  const correo = e.target.closest('[data-form="correo"]');
  if (correo) {
    e.preventDefault();
    acceso.correo = correo.querySelector('[name=correo]').value.trim();
    acceso.fase = 'codigo';
    acceso.aviso = 'Si ese correo tiene un recorrido abierto, le llega un código. En esta demo es 000000.';
    acceso.error = '';
    pinta();
    return;
  }

  const clave = e.target.closest('[data-form="codigo"]');
  if (clave) {
    e.preventDefault();
    const puesto = clave.querySelector('[name=codigo]').value.trim();
    if (puesto === '000000') {
      location.hash = '#/mapa';
    } else {
      acceso.error = 'Ese código no es. En esta demo el código es 000000.';
      pinta();
    }
    return;
  }

  e.preventDefault();
  const form = e.target.closest('.escribir');
  if (!form) return;
  const valor = form.querySelector('.campo').value.trim();
  if (!valor) return;
  respuestas[form.dataset.clave] = valor;
  delete vista[location.hash.split('/')[2]];
  pinta();
});

document.querySelectorAll('.demoAncho button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.demoAncho button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
    document.querySelector('.demoLienzo').dataset.ancho = b.dataset.ancho;
  });
});

window.addEventListener('hashchange', pinta);
pinta();
</script>
</body>
</html>
