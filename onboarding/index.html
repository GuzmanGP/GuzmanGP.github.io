la semana no se ha apreciado diferencia en el tiempo hasta el embarazo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "consumicion-semanal", "pie": "Una ca\u00f1a, una copa de vino o un combinado cuentan igual: una consumici\u00f3n."}]}, {"tipo": "parrafo", "texto": "Ninguna de las cuatro respuestas de frecuencia cae sola a un lado de esa l\u00ednea: una copa al d\u00eda son siete a la semana; cuatro al d\u00eda, veintiocho. Por eso la cantidad la matiza despu\u00e9s quien revise el caso.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Una consumici\u00f3n es una ca\u00f1a, una copa de vino o un combinado.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Dos criterios distintos que se mezclan casi siempre", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Buscando embarazo, el criterio es la fertilidad, y por debajo de un consumo moderado no se ha medido efecto. Si el embarazo ya puede estar en marcha, el criterio es otro \u2014el del feto\u2014 y ah\u00ed lo m\u00e1s seguro es no beber.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Las dos cosas son ciertas a la vez. Aqu\u00ed se pregunta por la primera; la segunda no depende de esta casilla.", "puntos": [], "imagenes": []}], "objetivo": {"que": "consumos", "por_que": "Sin juicio: se pregunta para poder ajustar, y porque el efecto sobre el resultado est\u00e1 descrito.", "imprescindible": true}}, {"clave": "vida_cafeina", "texto": "\u00bfCu\u00e1ntos caf\u00e9s o bebidas con cafe\u00edna tomas al d\u00eda?", "tipo": "opcion", "ayuda": "Cuentan el caf\u00e9, el t\u00e9, los refrescos de cola y las bebidas energ\u00e9ticas. Un caf\u00e9 doble o uno de vaso grande cuenta como dos. El descafeinado y las infusiones sin te\u00edna no cuentan.", "opciones": [{"texto": "Ninguno", "valor": "Ninguno", "aclara": "", "abre": ""}, {"texto": "1 o 2", "valor": "1 o 2", "aclara": "", "abre": ""}, {"texto": "3 o 4", "valor": "3 o 4", "aclara": "", "abre": ""}, {"texto": "M\u00e1s de 4", "valor": "M\u00e1s de 4", "aclara": "", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Lo primero que se quita, y lo que menos respaldo tiene", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Casi todo el mundo llega habiendo dejado el caf\u00e9. Suele ser el primer sacrificio, y es tambi\u00e9n el consumo con menos respaldo: no se ha encontrado una asociaci\u00f3n consistente con los problemas de fertilidad.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si apetece un caf\u00e9, no es ah\u00ed donde se juega esto.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El l\u00edmite de cafe\u00edna del embarazo es otra recomendaci\u00f3n distinta, con otro objetivo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuentan el caf\u00e9, el t\u00e9, los refrescos de cola y las bebidas energ\u00e9ticas. Un caf\u00e9 doble o uno de vaso grande cuenta como dos. El descafeinado y las infusiones sin te\u00edna no cuentan.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se conteste lo que se conteste, la cafe\u00edna no abre ninguna prueba ni ninguna recomendaci\u00f3n, y no mantiene abierto este bloque: lo que lo mantiene abierto es el tabaco propio, el humo dentro de casa, el alcohol de fin de semana en adelante y otras sustancias.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se recoge para tener el cuadro completo de consumos, no porque cambie una decisi\u00f3n.", "puntos": [], "imagenes": []}], "objetivo": {"que": "consumos", "por_que": "Sin juicio: se pregunta para poder ajustar, y porque el efecto sobre el resultado est\u00e1 descrito.", "imprescindible": true}}, {"clave": "vida_otras", "texto": "\u00bfConsumes cannabis u otras sustancias?", "tipo": "opcion", "ayuda": "Se pregunta por cannabis y por cualquier otra sustancia recreativa, incluidas las que se toman en pastilla. No es un registro: sirve para leer bien las hormonas y el ciclo, y para no atribuir a otra cosa lo que tenga esta explicaci\u00f3n.", "opciones": [{"texto": "No", "valor": "No", "aclara": "", "abre": "Permite cerrar este bloque."}, {"texto": "Ocasionalmente", "valor": "Ocasionalmente", "aclara": "Algo suelto y sin patr\u00f3n, del tipo una vez en una fiesta cada varios meses. Se separa del consumo habitual porque lo que se ha estudiado es el mantenido.", "abre": ""}, {"texto": "Habitualmente", "valor": "Habitualmente", "aclara": "", "abre": "Se ofrece acompa\u00f1amiento para dejarlo, no una prueba."}, {"texto": "Prefiero no responder", "valor": "Prefiero no responder", "aclara": "Es una respuesta v\u00e1lida y no obliga a nada. Tampoco cuenta como un no: esta parte se queda sin cerrar, y quien revise el caso lo ver\u00e1 as\u00ed.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Se pregunta para leer bien las hormonas", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La evidencia aqu\u00ed no es la que se supone: lo estudiado sobre el cannabis y la fertilidad no muestra un efecto claro ni constante.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que s\u00ed puede hacer es enturbiar las hormonas y el ciclo, y quien revise el caso necesita saberlo para no atribuir a otra cosa lo que tenga esta explicaci\u00f3n.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Por eso se pregunta: no es un registro, es para leer bien lo que salga despu\u00e9s en los an\u00e1lisis.", "puntos": [], "imagenes": []}], "objetivo": {"que": "consumos", "por_que": "Sin juicio: se pregunta para poder ajustar, y porque el efecto sobre el resultado est\u00e1 descrito.", "imprescindible": true}}, {"clave": "vida_ejercicio_frecuencia", "texto": "\u00bfCu\u00e1ntos d\u00edas a la semana haces ejercicio?", "tipo": "opcion", "ayuda": "Cuenta como sesi\u00f3n media hora o m\u00e1s de algo que te deje algo sin aliento: andar r\u00e1pido, bailar, nadar, bici. No tiene que ser gimnasio.", "opciones": [{"texto": "Ninguno", "valor": "Ninguno", "aclara": "Si tu trabajo es f\u00edsico o andas bastante a diario, eso no es \u00abninguno\u00bb, aunque no pises un gimnasio.", "abre": "Se mira cu\u00e1ntas horas se pasan sentada. Si el trabajo es f\u00edsico o se anda bastante a diario, eso no es \u00abninguno\u00bb, aunque no se pise un gimnasio."}, {"texto": "1 o 2", "valor": "1 o 2", "aclara": "", "abre": "Igual."}, {"texto": "3 o 4", "valor": "3 o 4", "aclara": "", "abre": "No se abre nada m\u00e1s por esta v\u00eda."}, {"texto": "5 o m\u00e1s", "valor": "5 o m\u00e1s", "aclara": "Entrenar casi todos los d\u00edas no es un problema en s\u00ed. Lo que se mira despu\u00e9s es si va acompa\u00f1ado de poca comida o de una regla alterada.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "El ejercicio pesa en los dos extremos, no en el medio", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ni el sedentarismo ni el exceso: los dos extremos alteran el ciclo, y el medio no.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "ejercicio-dos-extremos", "pie": "Los extremos alteran el ciclo; entre ellos hay una zona amplia que no."}]}, {"tipo": "parrafo", "texto": "El movimiento regular se asocia a algo m\u00e1s de probabilidad por ciclo. En un extremo est\u00e1 no moverse; en el otro, el esfuerzo fuerte casi a diario, cinco o m\u00e1s horas a la semana \u2014y ese extremo se vio en mujeres delgadas, no en las de peso m\u00e1s alto.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Por eso se pregunta primero cu\u00e1ntos d\u00edas, y despu\u00e9s c\u00f3mo de fuerte y qu\u00e9 tal va la regla.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta como sesi\u00f3n media hora o m\u00e1s de algo que deje algo sin aliento: andar r\u00e1pido, bailar, nadar, bici. No tiene que ser gimnasio.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 abre cada respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El n\u00famero de d\u00edas no decide nada por s\u00ed solo.", "puntos": [], "imagenes": []}], "objetivo": {"que": "movimiento", "por_que": "Ni sedentarismo ni exceso: los dos extremos alteran el ciclo.", "imprescindible": true}}, {"clave": "vida_ejercicio_tipo", "texto": "\u00bfQu\u00e9 tipo de ejercicio haces?", "tipo": "abierta", "ayuda": "Basta con el nombre de lo que haces y si hay pesas, carrera larga o clases. Sirve para saber si el esfuerzo es sostenido o repartido.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "Lo que se mira es el esfuerzo, no el deporte", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Los d\u00edas ya est\u00e1n contados. Falta de qu\u00e9 es ese ejercicio, porque no es lo mismo un esfuerzo repartido que uno seguido.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "ejercicio-dos-extremos", "pie": "Lo que sit\u00faa a alguien en la curva es el esfuerzo, no el nombre del deporte."}]}, {"tipo": "titulo", "texto": "Repartido y seguido no se leen igual", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Repartido: clases, andar r\u00e1pido, nadar un rato, bici tranquila. Seguido: carrera larga, entrenar para una prueba, sesiones muy fuertes.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que suma no es el deporte: son las horas de esfuerzo. Lo medido son cinco o m\u00e1s horas fuertes a la semana, no el nombre de la actividad.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Basta con el nombre de lo que se hace y si hay pesas, carrera larga o clases. De eso depende c\u00f3mo se lee la pregunta siguiente.", "puntos": [], "imagenes": []}], "objetivo": {"que": "movimiento", "por_que": "Ni sedentarismo ni exceso: los dos extremos alteran el ciclo.", "imprescindible": true}}, {"clave": "vida_intensidad", "texto": "\u00bfDir\u00edas que entrenas a intensidad alta (compites, entrenas fuerte casi a diario)?", "tipo": "si_no", "ayuda": "Intensidad alta es competir, entrenar para una prueba de resistencia, o entrenar fuerte casi todos los d\u00edas. Ir al gimnasio tres veces por semana con normalidad no lo es.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Lo siguiente no es una pregunta de deporte, es c\u00f3mo viene la regla. M\u00e1s de 45 d\u00edas entre una regla y otra de forma persistente, o tres meses o m\u00e1s sin regla, es motivo de estudio. No significa dejar de entrenar: significa mirar la ingesta y el ciclo."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "El bloque de movimiento puede quedar cerrado."}], "bloques": [{"tipo": "titulo", "texto": "No es el ejercicio: es el balance", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que frena la ovulaci\u00f3n no es entrenar fuerte, sino entrenar fuerte comiendo por debajo de lo que se gasta. El esfuerzo solo, con comida suficiente, no lo hace.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "ejercicio-dos-extremos", "pie": "El extremo de la derecha es esfuerzo fuerte con la comida por debajo de lo que se gasta."}]}, {"tipo": "parrafo", "texto": "Y la se\u00f1al est\u00e1 en la regla, no en la b\u00e1scula: se puede tener un peso normal y el ciclo parado.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Suele recuperarse subiendo la ingesta, no dejando de entrenar.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Intensidad alta es competir, entrenar para una prueba de resistencia o entrenar fuerte casi todos los d\u00edas. Ir al gimnasio tres veces por semana con normalidad no lo es.", "puntos": [], "imagenes": []}], "objetivo": {"que": "movimiento", "por_que": "Ni sedentarismo ni exceso: los dos extremos alteran el ciclo.", "imprescindible": true}}, {"clave": "vida_sedentarismo", "texto": "\u00bfCu\u00e1ntas horas al d\u00eda pasas sentada?", "tipo": "opcion", "ayuda": "Suma las horas del trabajo, del transporte y del sof\u00e1. Estar de pie muchas horas, aunque sea sin moverte, no cuenta como estar sentada.", "opciones": [{"texto": "Menos de 4", "valor": "Menos de 4", "aclara": "", "abre": ""}, {"texto": "Entre 4 y 8", "valor": "Entre 4 y 8", "aclara": "", "abre": ""}, {"texto": "M\u00e1s de 8", "valor": "M\u00e1s de 8", "aclara": "", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Estar sentada no explica una infertilidad", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Conviene decirlo claro: pasar muchas horas sentada no causa infertilidad. Lo que se ha visto va en la otra direcci\u00f3n y es peque\u00f1o: moverse de forma moderada se asocia a algo m\u00e1s de probabilidad por ciclo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "ejercicio-dos-extremos", "pie": "El extremo de la izquierda es peque\u00f1o y va en la otra direcci\u00f3n: moverse suma un poco."}]}, {"tipo": "parrafo", "texto": "Nadie deber\u00eda salir de aqu\u00ed pensando que su trabajo de oficina explica lo que le pasa.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Suma las horas del trabajo, del transporte y del sof\u00e1. Estar de pie muchas horas, aunque sea sin moverse, no cuenta como estar sentada.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta casilla no pide ninguna prueba: aqu\u00ed solo termina de cerrar el bloque de movimiento. Muchas horas sentada se valora junto al peso y el metabolismo, que se miran en otra \u00e1rea.", "puntos": [], "imagenes": []}], "objetivo": {"que": "movimiento", "por_que": "Ni sedentarismo ni exceso: los dos extremos alteran el ciclo.", "imprescindible": true}}, {"clave": " s": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Sin una fuente concreta detr\u00e1s, el resultado en sangre no se podr\u00eda interpretar ni en un sentido ni en otro.", "puntos": [], "imagenes": []}], "objetivo": {"que": "entorno", "por_que": "Exposiciones que casi nunca se preguntan en consulta y que a veces explican bastante.", "imprescindible": true}}, {"clave": "vida_plasticos", "texto": "\u00bfCalientas comida en recipientes de pl\u00e1stico o usas mucho envase pl\u00e1stico para comida caliente?", "tipo": "si_no", "ayuda": "La pregunta es por el calor: microondas en t\u00e1per o con film, y l\u00edquidos calientes en vaso o botella de pl\u00e1stico. Guardar comida fr\u00eda en pl\u00e1stico no es lo que se est\u00e1 preguntando.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Es de los cambios que no cuestan nada: calentar en vidrio o cer\u00e1mica y no tapar con film en el microondas."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Esta parte no a\u00f1ade nada."}], "bloques": [{"tipo": "titulo", "texto": "Lo que se pregunta no es el pl\u00e1stico: es el calor", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Guardar comida fr\u00eda en un t\u00e1per o en la nevera no es lo que se est\u00e1 preguntando. Lo que se pregunta es el calor: microondas en t\u00e1per, film por encima, l\u00edquido caliente en vaso o botella de pl\u00e1stico.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "plastico-y-calor", "pie": "El mismo envase, fr\u00edo y caliente: lo que se pregunta es el calor."}]}, {"tipo": "parrafo", "texto": "El envase cede parte de lo suyo a la comida sobre todo cuando se calienta.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se pregunta por lo dom\u00e9stico porque se repite durante a\u00f1os, no porque una vez suelta importe. Si el contacto con estos productos es de trabajo, va en la pregunta anterior y no en esta: all\u00ed la cantidad es otra.", "puntos": [], "imagenes": []}], "objetivo": {"que": "entorno", "por_que": "Exposiciones que casi nunca se preguntan en consulta y que a veces explican bastante.", "imprescindible": true}}, {"clave": "vida_cosmetica", "texto": "\u00bfUsas de forma habitual tintes, esmaltes o tratamientos de u\u00f1as y pelo?", "tipo": "si_no", "ayuda": "Se pregunta por el uso propio, en tu casa o en la peluquer\u00eda. Trabajar con estos productos todos los d\u00edas es otra cosa y va en la pregunta del trabajo.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Se concreta qu\u00e9 producto, con qu\u00e9 frecuencia y con qu\u00e9 protecci\u00f3n."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Con las tres en negativo, esta parte queda cerrada."}], "bloques": [{"tipo": "titulo", "texto": "La otra exposici\u00f3n de casa", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Va con la anterior: pl\u00e1stico caliente y cosm\u00e9tica son las dos exposiciones dom\u00e9sticas, las que se repiten durante a\u00f1os en cantidades peque\u00f1as.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se pregunta por el uso propio, en casa o en la peluquer\u00eda. Trabajar con estos productos todos los d\u00edas es otra cosa y va en la pregunta del trabajo.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 deciden estas tres preguntas", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Trabajo, pl\u00e1stico caliente y cosm\u00e9tica deciden juntas si esta parte se cierra.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Medir metales u otros t\u00f3xicos en sangre solo se puede interpretar cuando hay una fuente concreta detr\u00e1s.", "puntos": [], "imagenes": []}], "objetivo": {"que": "entorno", "por_que": "Exposiciones que casi nunca se preguntan en consulta y que a veces explican bastante.", "imprescindible": true}}, {"clave": "vida_sueno_pantallas", "texto": "\u00bfUsas pantallas hasta el momento de dormir?", "tipo": "si_no", "ayuda": "Se pregunta por la media hora justo antes de dormir, no por usar el m\u00f3vil por la noche en general.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": ""}, {"texto": "No", "valor": "no", "aclara": "", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "La casilla m\u00e1s peque\u00f1a del \u00e1rea", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El sue\u00f1o no se lee aparte: se lee junto al ejercicio y al resto de h\u00e1bitos. Por s\u00ed solo no abre ninguna prueba.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "luz-y-sueno", "pie": "Se pregunta por la media hora justo anterior a dormir, no por la noche entera."}]}, {"tipo": "titulo", "texto": "Solo la media hora anterior", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se pregunta por la media hora justo antes de dormir, no por usar el m\u00f3vil por la noche en general.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se recoge porque completa el cuadro de lo que se puede ajustar sin cita ni receta, no porque cambie una decisi\u00f3n por su cuenta.", "puntos": [], "imagenes": []}], "objetivo": {"que": "entorno", "por_que": "Exposiciones que casi nunca se preguntan en consulta y que a veces explican bastante.", "imprescindible": true}}]}, {"area": "genetica-reproductiva", "nombre": "Gen\u00e9tica reproductiva", "orden": 6, "para_que": "Cariotipo de la pareja, antecedentes familiares y estudio de restos abortivos. Sirve sobre todo para separar lo que se repetir\u00e1 de lo que fue mala suerte.", "obligatoria": false, "saber_mas": ["El cariotipo de la pareja y el de los restos de una p\u00e9rdida. Es el \u00e1rea que separa lo que fue azar de lo que se va a repetir, y por eso se mira antes de atribuir nada a las defensas o a la coagulaci\u00f3n.", "Cuando una p\u00e9rdida tiene una alteraci\u00f3n cromos\u00f3mica del embri\u00f3n, esa p\u00e9rdida ya est\u00e1 explicada: no hace falta buscarle una segunda causa. Ese es el motivo de que el an\u00e1lisis de los restos sea de los que m\u00e1s ahorran, y de que merezca la pena pedirlo al hospital donde ocurri\u00f3 aunque hayan pasado a\u00f1os.", "No es un \u00e1rea obligatoria del circuito: entra cuando algo la reclama \u2014dos o m\u00e1s p\u00e9rdidas, un antecedente familiar, consanguinidad\u2014. Si nada de eso aparece, no se recorre."], "del_area": [{"titulo": "Qu\u00e9 se mira aqu\u00ed, y a qui\u00e9n m\u00e1s puede tocarle", "llano": "Aqu\u00ed se miran dos cosas: los cromosomas de los dos miembros de la pareja y lo que ha pasado en las dos familias. Es la \u00fanica parte del circuito donde un hallazgo puede interesarle tambi\u00e9n a un hermano o a una prima, y por eso conviene saber de antemano qu\u00e9 se busca. Lo m\u00e1s probable, con diferencia, es que no aparezca nada: esta \u00e1rea sirve sobre todo para separar lo que podr\u00eda repetirse de lo que fue mala suerte.", "fundamento": "ESHRE no recomienda el cariotipo de la pareja de forma rutinaria en p\u00e9rdida gestacional recurrente: lo deja como prueba a valorar tras una evaluaci\u00f3n individual del riesgo (recomendaci\u00f3n condicional, evidencia baja; gu\u00eda ESHRE RPL publicada en Hum Reprod Open 2018 y mantenida sin cambios en este apartado en la actualizaci\u00f3n de 2022). El folleto para pacientes de la propia gu\u00eda a\u00f1ade que la probabilidad de encontrar una alteraci\u00f3n en los progenitores es peque\u00f1a."}], "preguntas": [{"clave": "gen_cariotipo", "texto": "\u00bfOs hab\u00e9is hecho el cariotipo (an\u00e1lisis de cromosomas) alguno de los dos?", "tipo": "opcion", "ayuda": "El cariotipo es una anal\u00edtica de sangre que cuenta los 46 cromosomas y mira si alguno est\u00e1 partido o cambiado de sitio. Se hace una vez en la vida y el resultado no cambia con los a\u00f1os. Es distinto del test gen\u00e9tico de los embriones y del an\u00e1lisis del tejido de una p\u00e9rdida, que se preguntan por separado.", "opciones": [{"texto": "Los dos", "valor": "Los dos", "aclara": "Cuenta cuando a cada uno os sacaron sangre para mirar los cromosomas. Si lo que se analiz\u00f3 fue el tejido de una p\u00e9rdida o los embriones de una fecundaci\u00f3n in vitro, eso es otra prueba distinta y se pregunta m\u00e1s adelante.", "abre": "La prueba est\u00e1 y no se repite: los cromosomas no cambian con los a\u00f1os."}, {"texto": "Solo yo", "valor": "Solo yo", "aclara": "", "abre": "La pregunta queda a medias: una reordenaci\u00f3n puede estar en cualquiera de los dos sin dar ninguna se\u00f1al."}, {"texto": "Solo mi pareja", "valor": "Solo mi pareja", "aclara": "", "abre": "Igual."}, {"texto": "Ninguno", "valor": "Ninguno", "aclara": "Es lo m\u00e1s frecuente, y no es un paso que nadie se haya saltado: hoy no se pide de entrada a todas las parejas, sino cuando la historia lo justifica.", "abre": ""}, {"texto": "No lo s\u00e9", "valor": "No lo s\u00e9", "aclara": "Pasa a menudo, porque suele ir dentro de un paquete de anal\u00edticas y no siempre se nombra al darlo. En el informe aparece con la palabra \u00abcariotipo\u00bb y una f\u00f3rmula del tipo 46,XX o 46,XY.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Un trozo de cromosoma colocado en otro sitio", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "translocacion-equilibrada", "pie": "No falta ni sobra material: est\u00e1 en otro lugar."}]}, {"tipo": "parrafo", "texto": "El cariotipo es una anal\u00edtica de sangre que cuenta los 46 cromosomas y mira si alguno est\u00e1 partido o cambiado de sitio. Se hace una vez en la vida y el resultado no cambia con los a\u00f1os.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que busca es esto: un trozo colocado en otro cromosoma. No falta ni sobra nada, quien lo lleva no lo nota, y solo se aprecia al formar embriones.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Es distinto del test gen\u00e9tico de los embriones y del an\u00e1lisis del tejido de una p\u00e9rdida, que se preguntan por separado.", "puntos": [], "imagenes": []}], "objetivo": {"que": "estudios ya hechos", "por_que": "Un cariotipo normal de la pareja cambia por completo la lectura de una p\u00e9rdida por cromosomopat\u00eda.", "imprescindible": true}}, {"clave": "gen_cariotipo_resultado", "texto": "\u00bfQu\u00e9 os dijeron del resultado?", "tipo": "opcion", "ayuda": "En el informe el resultado se escribe como una f\u00f3rmula: 46,XX o 46,XY cuando es normal. Cualquier letra o n\u00famero a\u00f1adido describe un cambio, y no todos los cambios significan lo mismo: algunos son variantes sin consecuencias y otros son reordenaciones que s\u00ed importan al formar embriones.", "opciones": [{"texto": "Normal en los dos", "valor": "Normal en los dos", "aclara": "Cuenta cuando os informaron del resultado de los dos, no solo de uno. Es adem\u00e1s lo que sale la mayor\u00eda de las veces, tambi\u00e9n en parejas con varias p\u00e9rdidas.", "abre": "Queda descartada la causa cromos\u00f3mica que pasa de la pareja al embri\u00f3n, y no se repite nunca m\u00e1s. Es adem\u00e1s lo que sale la mayor\u00eda de las veces, tambi\u00e9n en parejas con varias p\u00e9rdidas."}, {"texto": "Alguna alteraci\u00f3n", "valor": "Alguna alteraci\u00f3n", "aclara": "No todas pesan lo mismo. Hay variantes que se encuentran de casualidad y no explican nada, y hay reordenaciones que s\u00ed cambian el consejo. La diferencia est\u00e1 en el informe, no en el recuerdo.", "abre": "Consejo gen\u00e9tico con el informe delante antes de decidir nada. Puede interesar a otros familiares."}, {"texto": "No lo recuerdo", "valor": "No lo recuerdo", "aclara": "Muy com\u00fan, y no obliga a repetir la prueba: el cariotipo se hace una vez en la vida y el resultado queda archivado en el laboratorio que lo hizo.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Con reordenaci\u00f3n o sin ella, el mismo final", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Este es el dato que m\u00e1s tranquiliza y menos se cuenta: en las series publicadas, m\u00e1s de 8 de cada 10 parejas en las que uno de los dos lleva una reordenaci\u00f3n de cromosomas llegaron a tener un hijo sano. En las que no la llevan, tambi\u00e9n.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "translocacion-equilibrada", "pie": "Un trozo de cromosoma colocado en otro sitio, sin que falte ni sobre material."}]}, {"tipo": "parrafo", "texto": "Lo que cambia no es el destino, sino el n\u00famero de intentos por el camino.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "En el informe el resultado se escribe como una f\u00f3rmula: 46,XX o 46,XY cuando es normal. Cualquier letra o n\u00famero a\u00f1adido describe un cambio, y no todos significan lo mismo: hay variantes que se encuentran de casualidad y no explican nada, y hay reordenaciones que s\u00ed cambian el consejo. La diferencia est\u00e1 en el informe, no en el recuerdo.", "puntos": [], "imagenes": []}], "objetivo": {"que": "estudios ya hechos", "por_que": "Un cariotipo normal de la pareja cambia por completo la lectura de una p\u00e9rdida por cromosomopat\u00eda.", "imprescindible": true}}, {"clave": "gen_restos", "texto": "En caso de p\u00e9rdidas, \u00bfse analizaron los restos para ver si hab\u00eda alteraci\u00f3n cromos\u00f3mica?", "tipo": "opcion", "ayuda": "Aqu\u00ed \u00abp\u00e9rdida\u00bb es cualquier embarazo que no sigui\u00f3 adelante: un aborto, una gestaci\u00f3n que se par\u00f3 antes de verse el latido y una prueba de embarazo positiva que baj\u00f3 sola. El an\u00e1lisis del que habla la pregunta se hace sobre el tejido de esa p\u00e9rdida, as\u00ed que solo es posible cuando hubo muestra que enviar; en las p\u00e9rdidas muy tempranas a menudo no la hay.", "opciones": [{"texto": "S\u00ed, en alguna", "valor": "S\u00ed, en alguna", "aclara": "Es el an\u00e1lisis del tejido de la p\u00e9rdida, no una anal\u00edtica de sangre vuestra. Sigue contando aunque el resultado fuera \u00abno concluyente\u00bb o la muestra no llegara a crecer: pasa a menudo y consta en el informe.", "abre": ""}, {"texto": "No", "valor": "No", "aclara": "Es lo m\u00e1s habitual. En muchos sitios no se ofrece de rutina, y cuando la p\u00e9rdida ocurre en casa muchas veces no hay muestra que enviar.", "abre": ""}, {"texto": "No hubo p\u00e9rdidas", "valor": "No hubo p\u00e9rdidas", "aclara": "", "abre": "No aplica."}, {"texto": "No lo s\u00e9", "valor": "No lo s\u00e9", "aclara": "Frecuente: la muestra se manda en el momento y el resultado llega semanas despu\u00e9s, a veces a otro centro. Suele constar en el informe del ingreso o del legrado.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "La causa de la p\u00e9rdida suele estar en ese embarazo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "De cada tres p\u00e9rdidas que llegan a analizarse, en torno a dos llevan una alteraci\u00f3n de los cromosomas. Casi siempre es un cromosoma de m\u00e1s, ocurrido por azar al formarse ese embri\u00f3n concreto: ni viene de la pareja ni anuncia el siguiente.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "embrion-aspecto-cromosomas", "pie": "Casi siempre un cromosoma de m\u00e1s, ocurrido por azar en ese embri\u00f3n concreto."}]}, {"tipo": "parrafo", "texto": "Este an\u00e1lisis se hace sobre el tejido de la p\u00e9rdida, no sobre la sangre de los dos. Son dos pruebas distintas y por eso se preguntan aparte: una dice si hay algo que puede repetirse y la otra, qu\u00e9 ocurri\u00f3 en aquel embarazo.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 da y qu\u00e9 no da", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Da una explicaci\u00f3n concreta de aquel embarazo, y para muchas parejas eso cambia bastante.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No explica las p\u00e9rdidas anteriores ni cambia el tratamiento del embarazo siguiente.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Y tiene una condici\u00f3n que no tiene ninguna otra prueba de esta \u00e1rea: la muestra se env\u00eda en ese momento o ya no existe. No se puede pedir despu\u00e9s.", "puntos": [], "imagenes": []}], "objetivo": {"que": "estudios ya hechos", "por_que": "Un cariotipo normal de la pareja cambia por completo la lectura de una p\u00e9rdida por cromosomopat\u00eda.", "imprescindible": true}}, {"clave": "gen_pgt", "texto": "\u00bfHab\u00e9is hecho test gen\u00e9tico a los embriones (PGT-A) en alg\u00fan ciclo?", "tipo": "opcion", "ayuda": "El PGT-A analiza los cromosomas de una peque\u00f1a muestra del embri\u00f3n antes de transferirlo, y solo existe dentro de un ciclo de fecundaci\u00f3n in vitro. No es el an\u00e1lisis de sangre del embarazo \u2014el que llaman test prenatal no invasivo o NIPT\u2014, que se hace despu\u00e9s y mira otra cosa.", "opciones": [{"texto": "S\u00ed", "valor": "S\u00ed", "aclara": "Es la biopsia de los embriones antes de transferirlos, dentro de un ciclo de fecundaci\u00f3n in vitro. No es el an\u00e1lisis de sangre que se hace durante el embarazo ni el estudio del tejido de una p\u00e9rdida.", "abre": "Queda anotado, pero no sustituye al cariotipo de los dos."}, {"texto": "No", "valor": "No", "aclara": "Lo m\u00e1s com\u00fan, tambi\u00e9n despu\u00e9s de varias p\u00e9rdidas: no es un paso autom\u00e1tico de la fecundaci\u00f3n in vitro, se decide caso a caso.", "abre": "No falta ning\u00fan paso: no es autom\u00e1tico dentro de un ciclo, se decide caso a caso."}, {"texto": "No hemos hecho FIV", "valor": "No hemos hecho FIV", "aclara": "", "abre": "Igual: no cambia lo que se pide aqu\u00ed."}], "bloques": [{"tipo": "titulo", "texto": "Qu\u00e9 cuenta el test de los embriones", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Van tres an\u00e1lisis distintos y este es el tercero: los cromosomas de los dos en sangre, los del tejido de una p\u00e9rdida y los del embri\u00f3n antes de transferirlo. Se preguntan por separado porque no dicen lo mismo, y haber hecho uno no responde por los otros.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "embrion-aspecto-cromosomas", "pie": "Lo que mira el test del embri\u00f3n: los cromosomas de dentro, no su aspecto."}]}, {"tipo": "parrafo", "texto": "El PGT-A analiza los cromosomas de una peque\u00f1a muestra del embri\u00f3n, y solo existe dentro de un ciclo de fecundaci\u00f3n in vitro. No es el an\u00e1lisis de sangre del embarazo \u2014el test prenatal no invasivo\u2014, que se hace despu\u00e9s y mira otra cosa.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que ese recuento no ve es un trozo cambiado de sitio en uno de los dos. Eso se ve en la sangre, no aqu\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Sea cual sea la respuesta, esta \u00e1rea pide lo mismo.", "puntos": [], "imagenes": []}], "objetivo": {"que": "estudios ya hechos", "por_que": "Un cariotipo normal de la pareja cambia por completo la lectura de una p\u00e9rdida por cromosomopat\u00eda.", "imprescindible": true}}, {"clave": "gen_abortos_familia", "texto": "\u00bfHay abortos de repetici\u00f3n en tu familia (madre, hermanas, abuelas)?", "tipo": "si_no", "ayuda": "\u00abDe repetici\u00f3n\u00bb quiere decir dos o m\u00e1s p\u00e9rdidas en la misma persona, no una suelta: un aborto aislado es muy frecuente y no es lo que busca la pregunta. Vale con lo que sepas; en muchas familias esto no se hablaba y no pasa nada por no saberlo.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Se anota. Junto con el parentesco entre la pareja, es lo que puede justificar una anal\u00edtica de portadores en los dos."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Una casilla menos. Si el resto tambi\u00e9n sale limpio, esta l\u00ednea se cierra."}], "bloques": [{"tipo": "titulo", "texto": "Lo que hace fallar una gestaci\u00f3n temprana no se hereda", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta \u00e1rea tiene dos partes. La primera mira los cromosomas de los dos. La segunda, que empieza ahora, mira lo que se ha repetido en las dos familias: son preguntas distintas y una no responde por la otra.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "translocacion-equilibrada", "pie": "Lo que s\u00ed se hereda es una reordenaci\u00f3n como esta, no la p\u00e9rdida en s\u00ed."}]}, {"tipo": "parrafo", "texto": "Que en una familia haya habido abortos es m\u00e1s com\u00fan de lo que parece, entre otras cosas porque ahora se cuentan y antes se callaban.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Pero la mayor\u00eda de las p\u00e9rdidas tempranas ocurren porque el embri\u00f3n se qued\u00f3 con un cromosoma de m\u00e1s o de menos, y eso pasa por azar al formarse ese embarazo. No baja de una generaci\u00f3n a otra: aparece donde ocurre.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Es una pista para mirar, no algo que se herede.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "\u00abDe repetici\u00f3n\u00bb quiere decir dos o m\u00e1s p\u00e9rdidas en la misma persona, no una suelta. Vale con lo que se sepa; en muchas familias esto no se hablaba.", "puntos": [], "imagenes": []}], "objetivo": {"que": "familia", "por_que": "Los patrones familiares orientan y a veces son lo \u00fanico que hay antes de pedir pruebas caras.", "imprescindible": true}}, {"clave": "gen_trombosis_familia", "texto": "\u00bfHay trombosis o embolias en tu familia directa, sobre todo a edades j\u00f3venes o en el embarazo?", "tipo": "si_no", "ayuda": "Cuenta un trombo en una pierna, una embolia de pulm\u00f3n o un trombo en otra localizaci\u00f3n, de los que se tratan con anticoagulante. Familia directa son madre, padre, hermanos, hijos y abuelos. Un infarto o un ictus de los que aparecen con la edad son otra cosa y no entran aqu\u00ed.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Se valora, una a una, qu\u00e9 prueba de coagulaci\u00f3n y defensas merece la pena comprobar. No se pide el panel completo por tenerlo en la familia."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Una casilla menos: no hay motivo para mirar la coagulaci\u00f3n por esta v\u00eda."}], "bloques": [{"tipo": "titulo", "texto": "Esto no se ve en el cariotipo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Un trombo o una enfermedad autoinmune en la familia no se\u00f1alan los cromosomas: se\u00f1alan otra parte del mapa, la de coagulaci\u00f3n y defensas.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "trombo-vena", "pie": "Un co\u00e1gulo dentro de la vena: eso se\u00f1ala coagulaci\u00f3n, no cromosomas."}]}, {"tipo": "parrafo", "texto": "Y que lo haya en la familia no significa que est\u00e9 aqu\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta un trombo en una pierna, una embolia de pulm\u00f3n o un trombo en otra localizaci\u00f3n, de los que se tratan con anticoagulante. Familia directa son madre, padre, hermanos, hijos y abuelos. Un infarto o un ictus de los que aparecen con la edad son otra cosa y no entran.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se hace con la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Un antecedente no dispara un panel entero.", "puntos": [], "imagenes": []}], "objetivo": {"que": "familia", "por_que": "Los patrones familiares orientan y a veces son lo \u00fanico que hay antes de pedir pruebas caras.", "imprescindible": true}}, {"clave": "gen_autoinmune_familia", "texto": "\u00bfHay enfermedades autoinmunes en tu familia (tiroides, lupus, artritis, celiaqu\u00eda)?", "tipo": "si_no", "ayuda": "Son enfermedades en las que las defensas atacan al propio cuerpo: tiroiditis de Hashimoto, enfermedad de Graves, lupus, artritis reumatoide, celiaqu\u00eda, psoriasis, diabetes tipo 1, esclerosis m\u00faltiple. La artrosis, la alergia y el asma no son de este grupo.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Se anota para el estudio de defensas, que se hace en otra parte del circuito. Aqu\u00ed no cambia lo que se pide."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Una casilla menos: la tercera de las cuatro que cierran esta l\u00ednea."}], "bloques": [{"tipo": "titulo", "texto": "Cu\u00e1les cuentan como autoinmunes y cu\u00e1les no", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Son enfermedades en las que las defensas atacan al propio cuerpo: tiroiditis de Hashimoto, enfermedad de Graves, lupus, artritis reumatoide, celiaqu\u00eda, psoriasis, diabetes tipo 1, esclerosis m\u00faltiple.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "autoinmunidad", "pie": "Defensas dirigidas contra algo del propio cuerpo: eso es lo que las agrupa."}]}, {"tipo": "parrafo", "texto": "La artrosis, la alergia y el asma se nombran a menudo aqu\u00ed, pero no son de este grupo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Tenerlas en la familia es un aviso de por d\u00f3nde mirar, y esa parte es la de defensas, no la de cromosomas.", "puntos": [], "imagenes": []}], "objetivo": {"que": "familia", "por_que": "Los patrones familiares orientan y a veces son lo \u00fanico que hay antes de pedir pruebas caras.", "imprescindible": true}}, {"clave": "gen_enfermedades", "texto": "\u00bfHay alguna enfermedad hereditaria conocida o alg\u00fan caso de discapacidad en la familia de alguno de los dos?", "tipo": "abierta", "ayuda": "Sirve cualquier cosa que se sepa hereditaria o que se haya repetido en la familia: fibrosis qu\u00edstica, distrofia muscular, hemofilia, sordera de nacimiento, anemias hereditarias, s\u00edndrome X fr\u00e1gil, o una discapacidad intelectual sin causa conocida. Escr\u00edbelo como te lo contaron; no hace falta el nombre exacto ni el informe.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "Qu\u00e9 cuenta como enfermedad de familia", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Sirve cualquier cosa que se sepa hereditaria o que se haya repetido en la familia: fibrosis qu\u00edstica, distrofia muscular, hemofilia, sordera de nacimiento, anemias hereditarias, s\u00edndrome X fr\u00e1gil, o una discapacidad intelectual sin causa conocida.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Vale escribirlo tal como se recuerde. No hace falta el nombre exacto ni traer el informe.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 pasa con la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si hay algo conocido, se sale del circuito por aqu\u00ed: antes de decidir ninguna estrategia reproductiva va el consejo gen\u00e9tico formal, que es la parte que no se resuelve con una anal\u00edtica m\u00e1s.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si no hay nada conocido, la l\u00ednea sigue igual y no se pide nada nuevo por este motivo.", "puntos": [], "imagenes": []}], "objetivo": {"que": "familia", "por_que": "Los patrones familiares orientan y a veces son lo \u00fanico que hay antes de pedir pruebas caras.", "imprescindible": true}}, {"clave": "gen_consanguinidad", "texto": "\u00bfTen\u00e9is alg\u00fan parentesco entre vosotros?", "tipo": "si_no", "ayuda": "Se refiere a tener alg\u00fan antepasado com\u00fan: primos, primos segundos, o dos familias de un mismo pueblo peque\u00f1o donde se sabe que hay parentesco lejano. No cuenta el parentesco pol\u00edtico ni el hecho de compartir apellido.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Una anal\u00edtica de sangre de los dos dice si coincide alguna copia. Se hace antes del embarazo y con consejo gen\u00e9tico, porque as\u00ed abre opciones en vez de explicarlas despu\u00e9s."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Cuarta y \u00faltima casilla: la l\u00ednea de la familia queda cerrada."}], "bloques": [{"tipo": "titulo", "texto": "Solo cuenta cuando la misma copia est\u00e1 en los dos", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Todos llevamos alguna copia estropeada de alg\u00fan gen, y no pasa nada: la otra copia funciona. El problema aparece solo cuando los dos llevan estropeada la misma, y compartir antepasados hace que eso coincida m\u00e1s a menudo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "misma-copia-estropeada", "pie": "Con una copia sana basta; el problema es que coincida la misma estropeada en los dos."}]}, {"tipo": "parrafo", "texto": "Compartir familia no provoca p\u00e9rdidas por s\u00ed mismo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se refiere a tener alg\u00fan antepasado com\u00fan: primos, primos segundos, o dos familias de un mismo pueblo peque\u00f1o donde se sabe que hay parentesco lejano. No cuenta el parentesco pol\u00edtico ni compartir apellido.", "puntos": [], "imagenes": []}], "objetivo": {"que": "familia", "por_que": "Los patrones familiares orientan y a veces son lo \u00fanico que hay antes de pedir pruebas caras.", "imprescindible": true}}]}, {"area": "psicologia-pnie", "nombre": "Psicolog\u00eda y eje PNIE", "orden": 7, "para_que": "Estr\u00e9s sostenido, descanso y carga emocional del proceso reproductivo. El eje psico-neuro-inmuno-endocrino explica por qu\u00e9 esto no es 'algo aparte' del resto del estudio.", "obligatoria": true, "saber_mas": ["C\u00f3mo se est\u00e1 llevando el proceso, el descanso y la carga del d\u00eda. Aqu\u00ed conviene decir antes de empezar para qu\u00e9 NO sirve: no se busca si el estr\u00e9s ha causado la infertilidad, porque no funciona as\u00ed, y est\u00e1 medido.", "Se pregunta por dos motivos concretos. Uno: hay cosas de esta lista \u2014dormir poco de forma sostenida, trabajar de noche\u2014 que s\u00ed alteran el ciclo y son de las pocas que se pueden cambiar sin depender de un m\u00e9dico. Dos: el proceso desgasta, y de eso se ocupa alguien aunque no explique nada de lo que est\u00e1 pasando.", "Por eso ninguna respuesta del bloque emocional pide una anal\u00edtica. La carga deriva a acompa\u00f1amiento, que es lo que ayuda; lo que s\u00ed se analiza son s\u00edntomas f\u00edsicos, como levantarse cansada habiendo dormido."], "del_area": [{"titulo": "Ni es la causa, ni es un detalle", "llano": "Conviene decir antes de empezar para qu\u00e9 NO sirve esta parte: no se busca si el estr\u00e9s ha causado la infertilidad, porque no funciona as\u00ed. Se pregunta por dos motivos concretos. Uno: hay cosas de esta lista \u2014dormir poco de forma sostenida, trabajar de noche\u2014 que s\u00ed alteran el ciclo y son de las pocas que se pueden cambiar sin depender de un m\u00e9dico. Dos: el proceso desgasta, y de eso se ocupa alguien aunque no explique nada de lo que est\u00e1 pasando.", "fundamento": "Boivin, Griffiths y Venetis (BMJ, 2011) reunieron 14 estudios prospectivos y 3.583 mujeres antes de un ciclo de reproducci\u00f3n asistida: el malestar emocional previo no se asoci\u00f3 al embarazo (diferencia de medias estandarizada \u22120,04; IC 95% \u22120,11 a 0,03). Donde el estr\u00e9s s\u00ed interrumpe el ciclo es en la amenorrea hipotal\u00e1mica funcional, que la gu\u00eda de la Endocrine Society (2017) atribuye a p\u00e9rdida de peso, ejercicio intenso y/o estr\u00e9s, y para la que recomienda cribar los estresores psicol\u00f3gicos y ofrecer terapia cognitivo-conductual."}], "preguntas": [{"clave": "pnie_tiempo_buscando", "texto": "\u00bfCu\u00e1nto tiempo llev\u00e1is intentando el embarazo?", "tipo": "opcion", "ayuda": "Cuenta desde que dejasteis la anticoncepci\u00f3n buscando el embarazo, no desde que empezasteis a plante\u00e1roslo. Si ha habido pausas largas \u2014una separaci\u00f3n, un tratamiento, meses sin relaciones por trabajo\u2014 o un embarazo por el medio, el tiempo total y el de b\u00fasqueda real no coinciden: elige el tramo que m\u00e1s se acerque y quien revise el caso afinar\u00e1 el detalle.", "opciones": [{"texto": "Menos de 6 meses", "valor": "Menos de 6 meses", "aclara": "", "abre": ""}, {"texto": "Entre 6 meses y 1 a\u00f1o", "valor": "Entre 6 meses y 1 a\u00f1o", "aclara": "", "abre": ""}, {"texto": "Entre 1 y 2 a\u00f1os", "valor": "Entre 1 y 2 a\u00f1os", "aclara": "", "abre": ""}, {"texto": "Entre 2 y 4 a\u00f1os", "valor": "Entre 2 y 4 a\u00f1os", "aclara": "", "abre": ""}, {"texto": "M\u00e1s de 4 a\u00f1os", "valor": "M\u00e1s de 4 a\u00f1os", "aclara": "", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "El estr\u00e9s no se busca aqu\u00ed como causa", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta parte del circuito no busca si el estr\u00e9s ha causado la dificultad, porque no funciona as\u00ed. Se pregunta por dos motivos distintos.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El primero: hay cosas de aqu\u00ed que s\u00ed mueven el ciclo \u2014el descanso, trabajar de noche\u2014 y que se pueden cambiar sin depender de un m\u00e9dico.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El segundo: el proceso desgasta aunque no explique nada de lo que est\u00e1 pasando, y de eso se ocupa alguien.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "cortisol-eje", "pie": "El estr\u00e9s sostenido llega al ciclo por arriba, no por el ovario."}]}, {"tipo": "titulo", "texto": "Desde cu\u00e1ndo se cuenta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se empieza por cu\u00e1nto tiempo lleva la b\u00fasqueda, que sit\u00faa todo lo dem\u00e1s.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta desde que se dej\u00f3 la anticoncepci\u00f3n buscando el embarazo, no desde que empez\u00f3 a plantearse. Si ha habido pausas largas \u2014una separaci\u00f3n, un tratamiento, meses sin relaciones por trabajo\u2014 o un embarazo por el medio, el tiempo total y el de b\u00fasqueda real no coinciden: vale el tramo que m\u00e1s se acerque, y quien revise el caso afinar\u00e1 el detalle.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo est\u00e1s llevando esto", "por_que": "Medir la carga real del proceso. No es una pregunta de cortes\u00eda: el estr\u00e9s sostenido tiene efectos medibles sobre el ciclo y sobre el ambiente inmunol\u00f3gico.", "imprescindible": true}}, {"clave": "pnie_impacto", "texto": "En una semana normal, \u00bfcu\u00e1nto ocupa este tema tu cabeza?", "tipo": "opcion", "ayuda": "Pregunta por cu\u00e1nto espacio ocupa el tema en tu cabeza, no por c\u00f3mo lo est\u00e1s gestionando ni por si eres fuerte. No hay respuesta buena ni mala, y ninguna casilla se va a leer como la causa de lo que te pasa: sirve para saber qu\u00e9 apoyo tiene sentido ofrecerte y en qu\u00e9 momento.", "opciones": [{"texto": "Aparece de vez en cuando", "valor": "Aparece de vez en cuando", "aclara": "Esta casilla no dice que te importe menos ni que lo lleves mejor. Hay quien busca embarazo durante a\u00f1os sin que el tema le ocupe el d\u00eda, y eso no predice nada sobre el resultado.", "abre": "Entra en lo esperable: con lo dem\u00e1s en su sitio, este bloque cierra. No dice que importe menos ni que se lleve mejor."}, {"texto": "Pienso en ello la mayor\u00eda de d\u00edas", "valor": "Pienso en ello la mayor\u00eda de d\u00edas", "aclara": "Pensar en ello casi a diario mientras se busca un embarazo es una reacci\u00f3n esperable al proceso, no un s\u00edntoma. Que quede por escrito aqu\u00ed no lo convierte en un hallazgo.", "abre": ""}, {"texto": "Est\u00e1 presente casi todo el tiempo", "valor": "Est\u00e1 presente casi todo el tiempo", "aclara": "", "abre": "Se ofrece acompa\u00f1amiento: el proceso dura y de eso se ocupa alguien."}, {"texto": "No consigo pensar en otra cosa", "valor": "No consigo pensar en otra cosa", "aclara": "Mide cu\u00e1nto espacio ocupa, no cu\u00e1nto lo est\u00e1s haciendo mal. Se puede estar aqu\u00ed y estar sosteniendo a la vez el trabajo, la casa y la pareja.", "abre": "El circuito se detiene ah\u00ed y alguien del equipo se pone en contacto antes de seguir preguntando. Mide cu\u00e1nto espacio ocupa, no cu\u00e1nto se est\u00e1 haciendo mal: se puede estar aqu\u00ed y sostener a la vez el trabajo, la casa y la pareja."}], "bloques": [{"tipo": "titulo", "texto": "\u00abRel\u00e1jate y ya ver\u00e1s\u00bb est\u00e1 medido, y es falso", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "A m\u00e1s de tres mil mujeres se les midi\u00f3 el malestar antes de empezar el tratamiento. Las que llegaban peor no se quedaron embarazadas menos veces.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "cortisol-eje", "pie": "La v\u00eda por la que la carga sostenida llega al cuerpo: existe, y aun as\u00ed el malestar previo no cambi\u00f3 el resultado."}]}, {"tipo": "parrafo", "texto": "Dicho de otro modo: que el tema ocupe mucho sitio no est\u00e1 frenando nada. Lo que s\u00ed cambia es c\u00f3mo se vive el proceso, y eso ya es motivo suficiente para preguntarlo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta pregunta no mide c\u00f3mo se lleva ni cu\u00e1nta fortaleza hay. Mide cu\u00e1nto espacio ocupa el tema en una semana normal, que es otra cosa. No hay respuesta buena ni mala.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 abre cada respuesta", "puntos":  {"tipo": "parrafo", "texto": "P\u00e9rdida gestacional es cualquier embarazo que no lleg\u00f3 a t\u00e9rmino, sea cual sea la semana: entra el aborto bioqu\u00edmico \u2014la prueba dio positiva y baj\u00f3 la regla poco despu\u00e9s\u2014, el embarazo ect\u00f3pico, el molar, el que se vio parado en una ecograf\u00eda y la interrupci\u00f3n por causa m\u00e9dica; tambi\u00e9n cuenta si hubo embarazo tras una transferencia y no sigui\u00f3. No entra el ciclo en el que la prueba fue negativa.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ninguna de las dos pide una anal\u00edtica.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo est\u00e1s llevando esto", "por_que": "Medir la carga real del proceso. No es una pregunta de cortes\u00eda: el estr\u00e9s sostenido tiene efectos medibles sobre el ciclo y sobre el ambiente inmunol\u00f3gico.", "imprescindible": true}}, {"clave": "pnie_duelo", "texto": "\u00bfSientes que has podido elaborar esas p\u00e9rdidas o siguen muy presentes?", "tipo": "opcion", "ayuda": "Pregunta por c\u00f3mo est\u00e1 hoy, no por cu\u00e1nto tiempo ha pasado ni por cu\u00e1ntas p\u00e9rdidas hubo. Elaborar no significa olvidar ni dejar de querer a quien no lleg\u00f3: significa que ya no organiza el d\u00eda. Si hubo m\u00e1s de una, responde por el conjunto.", "opciones": [{"texto": "He podido colocarlo", "valor": "He podido colocarlo", "aclara": "Colocarlo no es haberlo olvidado ni dejar de echarlo de menos. Describe que ya no ocupa el centro del d\u00eda, no que se haya ido.", "abre": ""}, {"texto": "A ratos me remueve", "valor": "A ratos me remueve", "aclara": "Que vuelva en una fecha se\u00f1alada, en una ecograf\u00eda o con el embarazo de alguien cercano es lo habitual a\u00f1os despu\u00e9s, tambi\u00e9n cuando el duelo est\u00e1 bien elaborado.", "abre": ""}, {"texto": "Siguen muy presentes", "valor": "Siguen muy presentes", "aclara": "Habla de c\u00f3mo est\u00e1 hoy, sin que importe cu\u00e1nto tiempo ha pasado ni cu\u00e1ntas fueron. El duelo gestacional no lleva calendario y no se mide en meses.", "abre": "Se ofrece acompa\u00f1amiento profesional en paralelo, sin esperar a que termine el estudio. No se arregla terminando el estudio, y lo atiende alguien que sabe hacerlo."}, {"texto": "Prefiero no responder", "valor": "Prefiero no responder", "aclara": "Es una respuesta completa, no un hueco: el circuito sigue igual y nadie va a insistir. Se puede retomar m\u00e1s adelante, o directamente con la profesional.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Se pregunta por hoy, no por entonces", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No importa cu\u00e1ntas fueron ni cu\u00e1nto tiempo hace. Lo \u00fanico que cambia lo que se ofrece es c\u00f3mo est\u00e1n hoy.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Elaborar no es olvidar, ni dejar de querer a quien no lleg\u00f3: es que ya no organice el d\u00eda.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "A los nueve meses de la p\u00e9rdida, casi una de cada seis mujeres mantiene s\u00edntomas. Es un duelo que muchas veces no se nombra, del que la gente de alrededor ni lleg\u00f3 a enterarse, y al que se le concede menos tiempo del que necesita. Que sigan presentes no es se\u00f1al de haber hecho algo mal, y el tiempo por s\u00ed solo no lo resuelve.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si hubo m\u00e1s de una, se responde por el conjunto.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo est\u00e1s llevando esto", "por_que": "Medir la carga real del proceso. No es una pregunta de cortes\u00eda: el estr\u00e9s sostenido tiene efectos medibles sobre el ciclo y sobre el ambiente inmunol\u00f3gico.", "imprescindible": true}}, {"clave": "pnie_apoyo", "texto": "\u00bfTienes con qui\u00e9n hablar de esto?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "S\u00ed, con mi pareja y con gente cercana", "valor": "S\u00ed, con mi pareja y con gente cercana", "aclara": "Tener a qui\u00e9n cont\u00e1rselo y hab\u00e9rselo contado no son lo mismo. Hay quien tiene una red buena alrededor y no ha sacado el tema con ninguno de ellos.", "abre": "Permite cerrar esta parte sin dejar nada pendiente."}, {"texto": "Solo con mi pareja", "valor": "Solo con mi pareja", "aclara": "Es de lo m\u00e1s frecuente, porque esto se cuenta poco fuera de casa. Tiene una particularidad propia: quien te escucha est\u00e1 pasando por lo mismo al mismo tiempo.", "abre": ""}, {"texto": "Con casi nadie", "valor": "Con casi nadie", "aclara": "No dice nada de si tienes gente alrededor. Dice que esto en concreto no ha salido de ti, que es distinto y bastante com\u00fan.", "abre": "No se cierra: se ofrece acompa\u00f1amiento. No porque haya un problema, sino porque el proceso dura. Contarlo obliga a explicarlo otra vez y a aguantar consejos, as\u00ed que no decirlo no dice nada de la gente que hay alrededor."}, {"texto": "Estoy en terapia", "valor": "Estoy en terapia", "aclara": "Cuenta igual si empezaste por un motivo que no tiene que ver con esto, o si vas cada mucho tiempo.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Tener a qui\u00e9n cont\u00e1rselo y hab\u00e9rselo contado no son lo mismo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esta pregunta no mide cu\u00e1nta gente hay alrededor. Mide si esto en concreto se ha llegado a contar, que es distinto: hay quien tiene una red buena y no ha sacado el tema con ninguno de ellos.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia hablarlo, y qu\u00e9 no", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Hablarlo cambia c\u00f3mo se pasan estos meses, que es casi todo el tiempo que esto dura.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que no cambia es el resultado del tratamiento. Eso est\u00e1 medido, y no lo hace.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Conviene decir las dos cosas, y en ese orden.", "puntos": [], "imagenes": []}], "objetivo": {"que": "c\u00f3mo est\u00e1s llevando esto", "por_que": "Medir la carga real del proceso. No es una pregunta de cortes\u00eda: el estr\u00e9s sostenido tiene efectos medibles sobre el ciclo y sobre el ambiente inmunol\u00f3gico.", "imprescindible": true}}, {"clave": "pnie_horas_sueno", "texto": "\u00bfCu\u00e1ntas horas duermes de media?", "tipo": "opcion", "ayuda": "Horas dormidas, no horas en la cama. Piensa en una semana normal del \u00faltimo mes, no en la peor ni en la de vacaciones. Si duermes distinto entre semana y el fin de semana, usa los d\u00edas de diario.", "opciones": [{"texto": "Menos de 5", "valor": "Menos de 5", "aclara": "", "abre": "No se manda dormir m\u00e1s: se mira qu\u00e9 hay detr\u00e1s."}, {"texto": "Entre 5 y 6", "valor": "Entre 5 y 6", "aclara": "", "abre": "Igual."}, {"texto": "Entre 7 y 8", "valor": "Entre 7 y 8", "aclara": "", "abre": "Con el resto del bloque en su sitio, esta parte se cierra."}, {"texto": "M\u00e1s de 8", "valor": "M\u00e1s de 8", "aclara": "Dormir de m\u00e1s no es mejor por s\u00ed solo. A veces acompa\u00f1a a un cansancio que viene de otro sitio y que no se arregla alargando la noche.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Empieza lo que s\u00ed se puede mover", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Contada la parte emocional, esta segunda mitad pregunta por el descanso y el horario. Son las dos cosas de aqu\u00ed con efecto sobre el ciclo, y de las pocas que no dependen de un m\u00e9dico: dormir poco de forma sostenida y trabajar de noche s\u00ed lo alteran.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "luz-y-sueno", "pie": "La media hora anterior a dormir es lo que se pregunta despu\u00e9s; aqu\u00ed, las horas."}]}, { a cosa, y por eso se pregunta junto a esas dos.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "El cuerpo no distingue de d\u00f3nde viene la carga", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se suma todo lo que ocupa el d\u00eda, no solo lo que se cobra: trabajo, desplazamiento, cuidado de ni\u00f1os o de mayores, y la casa. Por eso la pregunta cuenta horas y no tipo de trabajo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "cortisol-eje", "pie": "La carga sostenida se nota por la misma v\u00eda, venga de donde venga."}]}, {"tipo": "parrafo", "texto": "Va justo despu\u00e9s del sue\u00f1o y del descanso porque las jornadas largas se comen antes esas dos cosas que ninguna otra. Saber las horas explica lo que se acaba de contestar.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Aqu\u00ed no se juzga el trabajo: se suman horas.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No pide anal\u00edtica: lo que se mira es el conjunto del d\u00eda.", "puntos": [], "imagenes": []}], "objetivo": {"que": "descanso y estr\u00e9s diario", "por_que": "El cortisol sostenido es el mecanismo por el que el estr\u00e9s llega al ciclo y al endometrio; el sue\u00f1o es la palanca m\u00e1s r\u00e1pida.", "imprescindible": true}}, {"clave": "pnie_turnos", "texto": "\u00bfTrabajas a turnos o de noche?", "tipo": "si_no", "ayuda": "Cuenta trabajar de noche, rotar turnos, hacer guardias o encadenar semanas con horarios que cambian, aunque no sea todos los meses. Un horario fijo de tarde, siempre el mismo y sin noches, altera bastante menos y suele quedar fuera.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "El bloque no se cierra: queda una exposici\u00f3n que explica movimientos del ciclo. Aun as\u00ed, no pide ninguna anal\u00edtica."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Es la cuarta respuesta que deja cerrar descanso y horario: no queda exposici\u00f3n sobre la que actuar."}], "bloques": [{"tipo": "titulo", "texto": "El turno de noche s\u00ed toca el ciclo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esto es de lo poco de esta \u00e1rea con un efecto medido sobre el cuerpo y no sobre el \u00e1nimo: trabajar a turnos se asocia a reglas m\u00e1s irregulares y a tardar algo m\u00e1s en conseguir el embarazo.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "turno-de-noche", "pie": "El mismo d\u00eda con las horas cambiadas: es lo que desplaza el reloj del cuerpo."}]}, {"tipo": "parrafo", "texto": "El aumento es peque\u00f1o y consistente, y eso importa en las dos direcciones. No es motivo para dejar el trabajo \u2014lo dice la propia revisi\u00f3n que midi\u00f3 el efecto\u2014, pero s\u00ed explica por qu\u00e9 el ciclo se mueve, y evita atribuirlo a otra cosa.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta trabajar de noche, rotar turnos, hacer guardias o encadenar semanas con horarios que cambian, aunque no sea todos los meses. Un horario fijo de tarde, siempre el mismo y sin noches, altera bastante menos y suele quedar fuera.", "puntos": [], "imagenes": []}], "objetivo": {"que": "descanso y estr\u00e9s diario", "por_que": "El cortisol sostenido es el mecanismo por el que el estr\u00e9s llega al ciclo y al endometrio; el sue\u00f1o es la palanca m\u00e1s r\u00e1pida.", "imprescindible": true}}, {"clave": "pnie_gestion", "texto": "\u00bfHaces algo que te ayude a bajar revoluciones? (deporte suave, meditaci\u00f3n, terapia, aficiones\u2026)", "tipo": "abierta", "ayuda": "No hay respuesta correcta, y \u00abnada\u00bb es una respuesta v\u00e1lida y frecuente. No se pregunta para mandarte deberes: se pregunta para no proponerte algo que ya haces y para saber qu\u00e9 encaja con el tiempo que tienes.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "Antes de proponer nada, qu\u00e9 se hace ya", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Es la \u00faltima pregunta del \u00e1rea y no genera ninguna prueba ni ninguna tarea.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Para qu\u00e9 sirve preguntarlo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Sirve para dos cosas: para no proponer algo que ya est\u00e1 en marcha, y para que lo que se proponga quepa en el d\u00eda que hay.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "\u00abNada\u00bb es una respuesta v\u00e1lida y frecuente, y no es una casilla peor que las otras. Aqu\u00ed no se mandan deberes.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Con esto se cierra el \u00e1rea, con o sin nada que proponer.", "puntos": [], "imagenes": []}], "objetivo": {"que": "descanso y estr\u00e9s diario", "por_que": "El cortisol sostenido es el mecanismo por el que el estr\u00e9s llega al ciclo y al endometrio; el sue\u00f1o es la palanca m\u00e1s r\u00e1pida.", "imprescindible": true}}]}, {"area": "inmunologia-reproductiva", "nombre": "Inmunolog\u00eda reproductiva", "orden": 8, "para_que": "Estudio inmunol\u00f3gico, trombof\u00edlico y de compatibilidad KIR/HLA-C en fallo de implantaci\u00f3n y p\u00e9rdida gestacional recurrente. Es la parte del circuito con m\u00e1s publicaciones y menos acuerdo, as\u00ed que aqu\u00ed se separa lo que est\u00e1 establecido de lo que no.", "obligatoria": true, "saber_mas": ["Defensas, coagulaci\u00f3n y compatibilidad con la pareja. Es la parte del circuito con m\u00e1s publicaciones y menos acuerdo, as\u00ed que lo que se hace aqu\u00ed es separar lo que est\u00e1 establecido de lo que no.", "Unas pocas cosas est\u00e1n bien asentadas: los anticuerpos antifosfol\u00edpido son lo \u00fanico de esta \u00e1rea con un tratamiento que ha demostrado cambiar el resultado. Otras muchas se piden a diario sin que ninguna gu\u00eda las respalde \u2014el KIR y HLA-C, las c\u00e9lulas NK\u2014 y se plantean sabi\u00e9ndolo, no como si fueran lo mismo.", "El umbral de entrada tampoco es un n\u00famero de intentos: el estudio se abre por dos o m\u00e1s p\u00e9rdidas, por una p\u00e9rdida tard\u00eda, o por transferencias que no llegan a implantar con embriones buenos. Saber cu\u00e1l es cu\u00e1l es lo que evita pagar por un panel que no iba a cambiar nada."], "del_area": [{"titulo": "Qu\u00e9 mira esta \u00e1rea, y cu\u00e1nto de ello sigue en discusi\u00f3n", "llano": "Aqu\u00ed se mira si el cuerpo est\u00e1 reaccionando de una forma que dificulte que un embarazo se agarre y siga adelante: defensas, coagulaci\u00f3n y compatibilidad gen\u00e9tica entre los dos miembros de la pareja. Es la parte del estudio con m\u00e1s publicaciones y menos acuerdo: unas pocas cosas est\u00e1n bien establecidas y otras muchas se piden a diario sin que se haya demostrado que cambien el resultado. Lo que se hace en esta \u00e1rea es separar unas de otras y decir cu\u00e1l es cu\u00e1l, para saber qu\u00e9 se est\u00e1 pagando y qu\u00e9 se puede esperar de cada prueba.", "fundamento": "Las tres referencias vigentes coinciden en el reparto: ESHRE RPL 2022 (Hum Reprod Open, hoad002) recomienda con fuerza cribar anticuerpos antifosfol\u00edpidos a partir de dos p\u00e9rdidas; ESHRE RIF 2023 (hoad023) declara no recomendadas las NK en sangre perif\u00e9rica, las NK uterinas, la compatibilidad HLA-C y las citoquinas en sangre; y ASRM 2026 (Fertil Steril 2026;125:1023-41) concluye que no recomienda el estudio ni el tratamiento inmunol\u00f3gico de rutina en p\u00e9rdida recurrente."}], "preguntas": [{"clave": "inm_tiempo_busqueda", "texto": "\u00bfCu\u00e1nto tiempo llev\u00e1is buscando embarazo?", "tipo": "opcion", "ayuda": "Cuenta desde que dejasteis la anticoncepci\u00f3n con intenci\u00f3n de embarazo, incluyendo los meses en los que hubo tratamientos. Si hubo pausas largas, cuenta el tiempo buscando, no el calendario entero.", "opciones": [{"texto": "Menos de 1 a\u00f1o", "valor": "Menos de 1 a\u00f1o", "aclara": "", "abre": ""}, {"texto": "Entre 1 y 2 a\u00f1os", "valor": "Entre 1 y 2 a\u00f1os", "aclara": "", "abre": ""}, {"texto": "Entre 2 y 4 a\u00f1os", "valor": "Entre 2 y 4 a\u00f1os", "aclara": "", "abre": ""}, {"texto": "M\u00e1s de 4 a\u00f1os", "valor": "M\u00e1s de 4 a\u00f1os", "aclara": "", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Las tres cosas que se miran en esta \u00e1rea", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Aqu\u00ed se mira si el terreno dificulta que un embarazo siga adelante, y son tres cosas: las defensas, la coagulaci\u00f3n y la compatibilidad gen\u00e9tica de la pareja.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Conviene decirlo al entrar: esta es la parte del circuito con m\u00e1s publicaciones y menos acuerdo. Unas pocas cosas est\u00e1n bien establecidas y otras se piden a diario sin estarlo. Separar unas de otras es parte de lo que se hace aqu\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "El tiempo sit\u00faa; lo que abre estudio es otra cosa", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El tiempo buscando dice desde cu\u00e1ndo, no qu\u00e9 hay que estudiar. Por s\u00ed solo no abre ninguna prueba de esta \u00e1rea.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Lo que s\u00ed la abre son cuatro cosas: las transferencias, las p\u00e9rdidas, la trombosis y la autoinmunidad. Son justo las preguntas que vienen a continuaci\u00f3n.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta desde que se dej\u00f3 la anticoncepci\u00f3n con intenci\u00f3n de embarazo, incluyendo los meses en los que hubo tratamientos. Si hubo pausas largas, cuenta el tiempo buscando, no el calendario entero.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tu historia hasta aqu\u00ed", "por_que": "Reconstruir qu\u00e9 se ha intentado ya, porque cambia por completo qu\u00e9 merece la pena estudiar ahora.", "imprescindible": true}}, {"clave": "inm_tratamientos", "texto": "\u00bfQu\u00e9 tratamientos de reproducci\u00f3n hab\u00e9is hecho?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "Ninguno todav\u00eda", "valor": "Ninguno todav\u00eda", "aclara": "", "abre": "Este bloque se cierra: no hay intentos previos que reconstruir, y las preguntas sobre betas y embriones no tendr\u00edan a qu\u00e9 referirse."}, {"texto": "Inseminaciones", "valor": "Inseminaciones", "aclara": "", "abre": "En la inseminaci\u00f3n no se transfiere ning\u00fan embri\u00f3n, as\u00ed que el fallo de implantaci\u00f3n no puede verse por ah\u00ed; se reconstruye igualmente qu\u00e9 se intent\u00f3."}, {"texto": "FIV con \u00f3vulos propios", "valor": "FIV con \u00f3vulos propios", "aclara": "", "abre": "Se reconstruye qu\u00e9 se intent\u00f3 y qu\u00e9 pas\u00f3 en cada intento: cu\u00e1ntas transferencias, si hubo beta, qu\u00e9 embriones quedan."}, {"texto": "FIV con ovodonaci\u00f3n", "valor": "FIV con ovodonaci\u00f3n", "aclara": "", "abre": "Igual, y con un dato que pesa: la edad de los \u00f3vulos era otra."}, {"texto": "Varias cosas distintas", "valor": "Varias cosas distintas", "aclara": "", "abre": "Se reconstruye el conjunto."}], "bloques": [{"tipo": "titulo", "texto": "Cuatro a\u00f1os buscando y cuatro a\u00f1os de tratamientos no son lo mismo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ya se sabe cu\u00e1nto tiempo lleva la b\u00fasqueda. Falta qu\u00e9 se ha intentado en ese tiempo, porque dejan historias distintas y eso cambia qu\u00e9 merece la pena estudiar.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 abre cada respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "El fallo de implantaci\u00f3n solo puede verse en quien pasa por fecundaci\u00f3n in vitro.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tu historia hasta aqu\u00ed", "por_que": "Reconstruir qu\u00e9 se ha intentado ya, porque cambia por completo qu\u00e9 merece la pena estudiar ahora.", "imprescindible": true}}, {"clave": "inm_transferencias", "texto": "\u00bfCu\u00e1ntas transferencias de embri\u00f3n te han hecho en total?", "tipo": "opcion", "ayuda": "Cuenta cada vez que se coloc\u00f3 al menos un embri\u00f3n dentro del \u00fatero, propios o de donante, en fresco o congelados. Si en una misma transferencia se pusieron dos embriones, sigue siendo una. Los ciclos cancelados antes de llegar a transferir no cuentan.", "opciones": [{"texto": "Ninguna", "valor": "Ninguna", "aclara": "", "abre": "Todav\u00eda no se cumple la definici\u00f3n de fallo de implantaci\u00f3n: por esta v\u00eda no se abre nada."}, {"texto": "1", "valor": "1", "aclara": "", "abre": "Igual. Seg\u00fan lo que saliera en la beta puede abrirse otra cosa."}, {"texto": "2", "valor": "2", "aclara": "", "abre": "Se plantea mirar la compatibilidad gen\u00e9tica de la pareja \u2014el KIR y el HLA-C\u2014, que hoy ninguna gu\u00eda respalda y se pide sabiendo que es terreno discutido."}, {"texto": "3", "valor": "3", "aclara": "", "abre": "Igual."}, {"texto": "4 o m\u00e1s", "valor": "4 o m\u00e1s", "aclara": "", "abre": "Igual."}], "bloques": [{"tipo": "titulo", "texto": "El umbral no es un n\u00famero de intentos", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se cuentan las veces que se coloc\u00f3 al menos un embri\u00f3n dentro del \u00fatero, propios o de donante, en fresco o congelados. Si en una misma transferencia se pusieron dos embriones, sigue siendo una. Los ciclos cancelados antes de transferir no cuentan.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Pero el n\u00famero por s\u00ed solo no dice mucho. Lo que se cuenta no son los intentos, sino cu\u00e1nta probabilidad de implantaci\u00f3n se ha consumido ya, y ese punto se sit\u00faa en el 60 %.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "En la pr\u00e1ctica eso se traduce as\u00ed: dos embriones ya analizados a cualquier edad, tres sin analizar por debajo de los 35 a\u00f1os, cuatro entre los 35 y los 39. \u00abAnalizado\u00bb quiere decir que se comprobaron sus cromosomas.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se abre con dos transferencias o m\u00e1s", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Antes que el terreno se revisa siempre el propio embri\u00f3n: cu\u00e1ntos eran, si se hab\u00edan analizado y qu\u00e9 edad hab\u00eda. La mayor\u00eda de los que no implantan llevan un error cromos\u00f3mico.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tu historia hasta aqu\u00ed", "por_que": "Reconstruir qu\u00e9 se ha intentado ya, porque cambia por completo qu\u00e9 merece la pena estudiar ahora.", "imprescindible": true}}, {"clave": "inm_implantacion", "texto": "En esas transferencias, \u00bflleg\u00f3 a salir alguna beta positiva aunque despu\u00e9s no siguiera adelante?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "S\u00ed, alguna", "valor": "S\u00ed, alguna", "aclara": "Una beta positiva que despu\u00e9s baj\u00f3 entra aqu\u00ed, aunque durara pocos d\u00edas y nadie llegara a llamarlo embarazo. Es un dato distinto de un negativo, y cambia por d\u00f3nde sigue el estudio.", "abre": "Se criba el panel antifosfol\u00edpido \u2014unos anticuerpos que hacen coagular de m\u00e1s\u2014, que es lo \u00fanico de esta \u00e1rea con un tratamiento demostrado."}, {"texto": "Nunca, siempre negativa", "valor": "Nunca, siempre negativa", "aclara": "", "abre": "Se criba el mismo panel y adem\u00e1s se plantean las c\u00e9lulas NK y sus subpoblaciones, sabiendo que hoy ninguna gu\u00eda lo respalda."}, {"texto": "No lo recuerdo bien", "valor": "No lo recuerdo bien", "aclara": "Es una respuesta habitual y no penaliza en nada: la beta consta en el informe del centro de reproducci\u00f3n y se puede recuperar sin repetir ninguna prueba.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "No agarrarse y perderse son caminos distintos", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "implantacion", "pie": "Implantar es agarrarse a la capa de dentro del \u00fatero."}]}, {"tipo": "parrafo", "texto": "Desde una transferencia salen dos caminos. Que el embri\u00f3n no llegue a agarrarse, y entonces el test sale negativo. O que se agarre y no siga adelante, y entonces la beta sale positiva y luego baja.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se estudian cosas distintas, y por eso se pregunta por la beta aunque durase pocos d\u00edas y nadie llegara a llamarlo embarazo.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Aqu\u00ed est\u00e1 el desacuerdo de esta \u00e1rea", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La idea que sostiene las pruebas de defensas es que las c\u00e9lulas NK, o la combinaci\u00f3n gen\u00e9tica de la pareja \u2014el KIR y el HLA-C\u2014, reaccionen de m\u00e1s justo cuando el embri\u00f3n intenta agarrarse.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "nk-utero", "pie": "Las defensas del \u00fatero durante la implantaci\u00f3n: es la idea que sostiene esas pruebas, y la que ninguna gu\u00eda respalda todav\u00eda."}]}, {"tipo": "parrafo", "texto": "Lo que no est\u00e1 demostrado es que medirlas y tratarlas consiga m\u00e1s ni\u00f1os nacidos. Son las pruebas m\u00e1s pedidas y las menos respaldadas, y un resultado alterado no obliga por s\u00ed solo a tratar nada.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se pide seg\u00fan lo que salga en la beta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ninguna de las tres respuestas retrasa el estudio.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tu historia hasta aqu\u00ed", "por_que": "Reconstruir qu\u00e9 se ha intentado ya, porque cambia por completo qu\u00e9 merece la pena estudiar ahora.", "imprescindible": true}}, {"clave": "inm_embriones_disponibles", "texto": "\u00bfOs quedan embriones congelados disponibles?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "S\u00ed, varios", "valor": "S\u00ed, varios", "aclara": "", "abre": "Hay margen: se estudia, se esperan los resultados y se decide con ellos delante, sin recortar."}, {"texto": "S\u00ed, solo uno", "valor": "S\u00ed, solo uno", "aclara": "", "abre": "Cada transferencia pesa m\u00e1s, as\u00ed que se plantea mirar el \u00fatero por dentro antes: histeroscopia, biopsia y microbiota \u2014las bacterias que viven en el endometrio\u2014, si no se ha hecho ya."}, {"texto": "Ninguno", "valor": "Ninguno", "aclara": "", "abre": "Igual."}, {"texto": "No aplica", "valor": "No aplica", "aclara": "Es la casilla de quien no ha hecho FIV y, por tanto, nunca ha tenido embriones que congelar.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Los embriones que quedan para la siguiente vez", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Las preguntas anteriores reconstruyen lo que ya se ha intentado. Esta mira hacia delante: con cu\u00e1ntos embriones se cuenta.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "De ah\u00ed sale el margen que hay para estudiar, porque el estudio se ordena antes de comprometer un embri\u00f3n.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "No cambia qu\u00e9 se estudia, sino en qu\u00e9 orden.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tu historia hasta aqu\u00ed", "por_que": "Reconstruir qu\u00e9 se ha intentado ya, porque cambia por completo qu\u00e9 merece la pena estudiar ahora.", "imprescindible": true}}, {"clave": "inm_perdidas", "texto": "\u00bfCu\u00e1ntas p\u00e9rdidas de embarazo has tenido?", "tipo": "opcion", "ayuda": "Cuenta cua
