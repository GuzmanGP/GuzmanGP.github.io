0e1ndo es. Ver la cavidad normal no cierra la parte de la biopsia."}, {"texto": "S\u00ed, biopsia o microbiota endometrial", "valor": "S\u00ed, biopsia o microbiota endometrial", "aclara": "", "abre": "Igual: se lee y se mira la fecha."}, {"texto": "Las dos cosas", "valor": "Las dos cosas", "aclara": "", "abre": "Esta parte queda cubierta salvo que sea antigua."}, {"texto": "No", "valor": "No", "aclara": "Es frecuente y no supone ning\u00fan retraso: es una de las cosas que este circuito decide si toca pedir.", "abre": "Este circuito valora pedir histeroscopia, biopsia y microbiota \u2014las bacterias que viven en el endometrio\u2014. Es frecuente y no supone ning\u00fan retraso."}, {"texto": "No lo s\u00e9", "valor": "No lo s\u00e9", "aclara": "", "abre": "Igual."}], "bloques": [{"tipo": "titulo", "texto": "Ver la cavidad y analizarla no es lo mismo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Son dos pruebas distintas y se confunden a menudo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La histeroscopia mira la cavidad por dentro con una c\u00e1mara. Una cavidad de aspecto normal no descarta una endometritis cr\u00f3nica \u2014el endometrio inflamado\u2014: eso se ve en la biopsia, no a simple vista.", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "hallazgos-cavidad", "pie": "La c\u00e1mara ve lo que ocupa la cavidad; la inflamaci\u00f3n del endometrio se ve en la biopsia."}]}, {"tipo": "titulo", "texto": "Qu\u00e9 cambia seg\u00fan la respuesta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Pesa m\u00e1s cuando quedan pocos embriones disponibles: ah\u00ed conviene mirar el \u00fatero antes de comprometer uno.", "puntos": [], "imagenes": []}], "objetivo": {"que": "lo que ya te han estudiado", "por_que": "No repetir lo que ya est\u00e1 hecho y vigente, y ver qu\u00e9 falta antes de comprometer un embri\u00f3n.", "imprescindible": true}}, {"clave": "inm_estudio_pareja", "texto": "\u00bfQu\u00e9 se ha estudiado de tu pareja?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "Seminograma", "valor": "Seminograma", "aclara": "Mide cu\u00e1ntos espermatozoides hay, c\u00f3mo se mueven y qu\u00e9 forma tienen. No mira si el ADN que llevan dentro est\u00e1 \u00edntegro, as\u00ed que un seminograma normal no equivale a factor masculino descartado.", "abre": "Se valora a\u00f1adir la fragmentaci\u00f3n del ADN y, seg\u00fan el caso, el cariotipo."}, {"texto": "Seminograma y fragmentaci\u00f3n del ADN", "valor": "Seminograma y fragmentaci\u00f3n del ADN", "aclara": "", "abre": "Queda poco por a\u00f1adir por aqu\u00ed; el cariotipo, seg\u00fan el caso."}, {"texto": "Cariotipo tambi\u00e9n", "valor": "Cariotipo tambi\u00e9n", "aclara": "", "abre": "Esta parte est\u00e1 cubierta."}, {"texto": "Nada todav\u00eda", "valor": "Nada todav\u00eda", "aclara": "", "abre": "Se plantea hacerlo: sin ese dato falta una pieza del cuadro."}, {"texto": "No aplica", "valor": "No aplica", "aclara": "Es la casilla de quien no tiene pareja masculina o ha usado semen de donante. Si el banco inform\u00f3 de algo, ese dato s\u00ed se tiene en cuenta.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "El seminograma no mira el ADN de dentro", "puntos": [], "imagenes": []}, {"tipo": "figura", "texto": "", "puntos": [], "imagenes": [{"svg": "espermatozoide-adn", "pie": "Los dos se mueven igual; el material gen\u00e9tico no es el mismo."}]}, {"tipo": "parrafo", "texto": "Un seminograma cuenta cu\u00e1ntos espermatozoides hay, c\u00f3mo se mueven y qu\u00e9 forma tienen. No dice si el ADN que llevan dentro est\u00e1 \u00edntegro.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Por eso un seminograma normal no equivale a factor masculino descartado.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se completa seg\u00fan lo estudiado", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Si aparece un factor masculino, el estudio sigue por el \u00e1rea que le corresponde en vez de atribuirlo todo a lo inmunol\u00f3gico.", "puntos": [], "imagenes": []}], "objetivo": {"que": "lo que ya te han estudiado", "por_que": "No repetir lo que ya est\u00e1 hecho y vigente, y ver qu\u00e9 falta antes de comprometer un embri\u00f3n.", "imprescindible": true}}, {"clave": "inm_tratamiento_actual", "texto": "\u00bfQu\u00e9 medicaci\u00f3n o suplementos est\u00e1s tomando ahora mismo?", "tipo": "abierta", "ayuda": "Interesa todo lo que tomes ahora mismo: medicaci\u00f3n con receta, aspirina, heparina, hormonas, y tambi\u00e9n vitaminas, suplementos y productos de herbolario. Si sabes la dosis y desde cu\u00e1ndo, mejor; si no, con el nombre basta.", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "Antes de proponer nada, la medicaci\u00f3n de ahora", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Este bloque abre la parte de seguridad. Lo que ya se toma condiciona lo que se puede plantear despu\u00e9s, y en qu\u00e9 dosis.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Cuenta todo: medicaci\u00f3n con receta, aspirina, heparina, hormonas, y tambi\u00e9n vitaminas, suplementos y productos de herbolario. Con el nombre basta; con la dosis y desde cu\u00e1ndo, mejor.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 sale de esa lista", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Tres cosas: qu\u00e9 se solapa con lo que pudiera plantearse \u2014aspirina, heparina u hormonas que ya se est\u00e9n tomando\u2014, qu\u00e9 suplementos conviene retirar por no ir bien con un embarazo, y cu\u00e1nta medicaci\u00f3n se est\u00e1 sosteniendo ya en total.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tratamiento actual y precauciones", "por_que": "Hay tratamientos que no se pueden usar seg\u00fan tus antecedentes: conviene saberlo antes de proponer nada.", "imprescindible": false}}, {"clave": "inm_alergias", "texto": "\u00bfTienes alergia a alguno de estos alimentos?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "Huevo", "valor": "Huevo", "aclara": "", "abre": "Esa v\u00eda de tratamiento queda fuera, y es mejor saberlo ahora que cuando ya aparece dentro de un plan."}, {"texto": "Soja", "valor": "Soja", "aclara": "", "abre": "Igual."}, {"texto": "Cacahuete", "valor": "Cacahuete", "aclara": "Est\u00e1 en la lista porque el prospecto de una de las medicaciones que a veces se plantean aqu\u00ed nombra los tres juntos. Cuenta tanto si est\u00e1 diagnosticada como si viene de una reacci\u00f3n clara.", "abre": ""}, {"texto": "Varios de ellos", "valor": "Varios de ellos", "aclara": "", "abre": "Igual."}, {"texto": "Ninguno", "valor": "Ninguno", "aclara": "Se pregunta solo por estos tres porque son los del prospecto de esa medicaci\u00f3n concreta, no por nada relacionado con tu dieta. Que no tengas ninguna no abre ni cierra nada por s\u00ed solo.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Por qu\u00e9 justo esas tres alergias", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La pregunta no viene de nada relacionado con la dieta. Los intral\u00edpidos, una de las medicaciones que a veces se plantean aqu\u00ed, son una emulsi\u00f3n de aceite de soja con fosfol\u00edpidos de huevo, y su prospecto nombra los tres juntos: huevo, soja y cacahuete.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "De ah\u00ed salen las casillas.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tratamiento actual y precauciones", "por_que": "Hay tratamientos que no se pueden usar seg\u00fan tus antecedentes: conviene saberlo antes de proponer nada.", "imprescindible": false}}, {"clave": "inm_retina", "texto": "\u00bfTienes o has tenido alg\u00fan problema de retina o de vista que te haya llevado al oftalm\u00f3logo?", "tipo": "si_no", "ayuda": "Se refiere a problemas de la retina o de la m\u00e1cula: desprendimiento, degeneraci\u00f3n, retinopat\u00eda por diabetes, o cualquier revisi\u00f3n en la que te dijeran que hab\u00eda algo en el fondo del ojo. Necesitar gafas, tener miop\u00eda o astigmatismo no entra aqu\u00ed.", "opciones": [{"texto": "S\u00ed", "valor": "s\u00ed", "aclara": "", "abre": "Lo mira un oftalm\u00f3logo antes de empezar, y se vigila desde el inicio."}, {"texto": "No", "valor": "no", "aclara": "", "abre": "Por este lado no hace falta nada especial antes de plantearlo."}], "bloques": [{"tipo": "titulo", "texto": "Se pregunta por el fondo del ojo, no por la vista", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se refiere a la retina y a la m\u00e1cula: desprendimiento, degeneraci\u00f3n, retinopat\u00eda por diabetes, o cualquier revisi\u00f3n en la que dijeran que hab\u00eda algo en el fondo del ojo.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Necesitar gafas, tener miop\u00eda o astigmatismo no entra aqu\u00ed. Y se pregunta por un f\u00e1rmaco concreto de esta \u00e1rea, no por la vista en general.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "No es un no: es una revisi\u00f3n antes de empezar", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "La hidroxicloroquina es uno de los pocos f\u00e1rmacos de esta \u00e1rea con experiencia larga en el embarazo. Con los a\u00f1os y a dosis altas puede tocar la retina.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Haber tenido algo en el fondo del ojo no la proh\u00edbe: obliga a que lo mire un oftalm\u00f3logo antes de empezar y a vigilarlo desde el principio.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tratamiento actual y precauciones", "por_que": "Hay tratamientos que no se pueden usar seg\u00fan tus antecedentes: conviene saberlo antes de proponer nada.", "imprescindible": false}}, {"clave": "inm_higado_onco", "texto": "\u00bfTienes antecedentes de problemas de h\u00edgado o de alg\u00fan proceso oncol\u00f3gico?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "No", "valor": "No", "aclara": "Se pregunta por seguridad de la medicaci\u00f3n que podr\u00eda plantearse, no porque se sospeche nada por tu historia.", "abre": "Ninguna opci\u00f3n queda cerrada de entrada por un motivo de seguridad. No dice que vayan a hacer falta: dice que no hay impedimento."}, {"texto": "H\u00edgado", "valor": "H\u00edgado", "aclara": "Incluye transaminasas altas repetidas en anal\u00edticas, h\u00edgado graso o una hepatitis, aunque nunca te hayan puesto un nombre concreto a ello.", "abre": ""}, {"texto": "Oncol\u00f3gico", "valor": "Oncol\u00f3gico", "aclara": "", "abre": "Se valora antes de a\u00f1adir nada que baje las defensas."}, {"texto": "Los dos", "valor": "Los dos", "aclara": "", "abre": "Se valoran los dos."}], "bloques": [{"tipo": "titulo", "texto": "Dos antecedentes que condicionan la medicaci\u00f3n", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Se pregunta por seguridad de lo que pudiera plantearse, no porque se sospeche nada de la historia.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Las transaminasas altas de forma repetida \u2014un valor del h\u00edgado en la anal\u00edtica\u2014 son una de las cosas que limitan la hidroxicloroquina. Y un antecedente oncol\u00f3gico desaconseja a\u00f1adir carga inmunosupresora sin valorarlo antes.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Las tres barreras que este bloque descarta", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Alergias del prospecto, retina, e h\u00edgado u oncol\u00f3gico. Son las tres cosas que hay que descartar antes de proponer un tratamiento en esta \u00e1rea.", "puntos": [], "imagenes": []}], "objetivo": {"que": "tratamiento actual y precauciones", "por_que": "Hay tratamientos que no se pueden usar seg\u00fan tus antecedentes: conviene saberlo antes de proponer nada.", "imprescindible": false}}, {"clave": "inm_ciclo_previsto", "texto": "\u00bfTienes algo programado ahora mismo?", "tipo": "opcion", "ayuda": "", "opciones": [{"texto": "Transferencia programada", "valor": "Transferencia programada", "aclara": "", "abre": "Se decide qu\u00e9 cabe y si compensa esperar un ciclo, y esa decisi\u00f3n se toma junto a la paciente."}, {"texto": "Punci\u00f3n programada", "valor": "Punci\u00f3n programada", "aclara": "", "abre": "Igual."}, {"texto": "B\u00fasqueda natural", "valor": "B\u00fasqueda natural", "aclara": "", "abre": "Hay margen para pedir y esperar resultados."}, {"texto": "Nada por ahora", "valor": "Nada por ahora", "aclara": "Es la situaci\u00f3n con m\u00e1s margen: el estudio se puede hacer entero y esperar a los resultados sin que nada corra por detr\u00e1s.", "abre": ""}, {"texto": "Estoy embarazada", "valor": "Estoy embarazada", "aclara": "Con un embarazo en curso cambia el orden de todo: hay determinaciones que no se interpretan igual y tratamientos que no se empiezan ahora. Vale aunque sea muy reciente y a\u00fan no se haya confirmado por ecograf\u00eda.", "abre": ""}], "bloques": [{"tipo": "titulo", "texto": "Hay plazos que no se pueden acortar", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Ya est\u00e1n la historia, los antecedentes, lo estudiado y la medicaci\u00f3n. Lo \u00faltimo es el calendario, y no cambia qu\u00e9 se estudia: cambia en qu\u00e9 orden y qu\u00e9 cabe antes de la fecha.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Manda por dos plazos que no se acortan. El diagn\u00f3stico de esta \u00e1rea que m\u00e1s cambia el tratamiento necesita una segunda anal\u00edtica al menos doce semanas despu\u00e9s de la primera. Y un tratamiento inmunol\u00f3gico necesita tiempo para hacer efecto antes de una transferencia: no se empieza la v\u00edspera.", "puntos": [], "imagenes": []}], "objetivo": {"que": "qu\u00e9 tienes por delante", "por_que": "El calendario manda: los tratamientos inmunol\u00f3gicos necesitan tiempo para hacer efecto antes de una transferencia.", "imprescindible": false}}, {"clave": "inm_fecha_prevista", "texto": "\u00bfPara qu\u00e9 fecha, aproximadamente?", "tipo": "abierta", "ayuda": "", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "La fecha es lo que decide qu\u00e9 cabe", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Con una fecha delante se ve qu\u00e9 determinaciones vuelven del laboratorio a tiempo y cu\u00e1les no. Con una aproximada basta para ordenar esto.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se elige con esa fecha delante", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "A partir de ah\u00ed se elige: lo que llega antes de la fecha, lo que no llega y no cambia la decisi\u00f3n de ahora, y lo que obligar\u00eda a esperar.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Retrasar una transferencia tiene un coste real. Esa decisi\u00f3n se toma junto a la paciente, no por defecto.", "puntos": [], "imagenes": []}], "objetivo": {"que": "qu\u00e9 tienes por delante", "por_que": "El calendario manda: los tratamientos inmunol\u00f3gicos necesitan tiempo para hacer efecto antes de una transferencia.", "imprescindible": false}}, {"clave": "inm_centro", "texto": "\u00bfEn qu\u00e9 centro de reproducci\u00f3n est\u00e1s?", "tipo": "abierta", "ayuda": "", "opciones": [], "bloques": [{"tipo": "titulo", "texto": "El estudio se encaja con quien lleva el ciclo", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Hay un ciclo en marcha en un centro concreto. Saber cu\u00e1l permite encajar el estudio en su calendario y hablar con quien lo lleva, en vez de ir por libre.", "puntos": [], "imagenes": []}, {"tipo": "titulo", "texto": "Qu\u00e9 se coordina con el centro", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Con el centro identificado se coordinan tres cosas: los plazos reales de su laboratorio frente a la fecha prevista, si la transferencia ser\u00e1 en fresco o diferida, y qu\u00e9 parte del estudio tiene sentido pedir aqu\u00ed y cu\u00e1l all\u00ed.", "puntos": [], "imagenes": []}, {"tipo": "parrafo", "texto": "Esto no sustituye al centro que lleva el ciclo: se coordina con \u00e9l.", "puntos": [], "imagenes": []}], "objetivo": {"que": "qu\u00e9 tienes por delante", "por_que": "El calendario manda: los tratamientos inmunol\u00f3gicos necesitan tiempo para hacer efecto antes de una transferencia.", "imprescindible": false}}]}], "figuras": {"tiempos-de-correccion": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Entre corregir algo y comprobar que ha cambiado pasan semanas\u003c/title>\n  \u003cdesc>Los cuatro tramos que separan una anal\u00edtica de su efecto: sacar la sangre, esperar el resultado, corregir lo que ese resultado indique y volver a medir para ver si la correcci\u00f3n hizo algo. Un ajuste de la hormona tiroidea, por poner el caso m\u00e1s medido, no se recomprueba hasta unas cuatro semanas despu\u00e9s.\u003c/desc>\n\n  \u003cpath d=\"M 56,206 C 200,200 440,200 584,206\" fill=\"none\"\n        stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n\n  \u003ccircle cx=\"90\" cy=\"204\" r=\"12\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"240\" cy=\"202\" r=\"12\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"390\" cy=\"202\" r=\"12\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"546\" cy=\"204\" r=\"12\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n\n  \u003ctext x=\"56\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Sacar\u003c/text>\n  \u003ctext x=\"56\" y=\"184\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">la sangre\u003c/text>\n  \u003ctext x=\"206\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Llega el\u003c/text>\n  \u003ctext x=\"206\" y=\"184\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">resultado\u003c/text>\n  \u003ctext x=\"356\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Se corrige\u003c/text>\n  \u003ctext x=\"356\" y=\"184\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">lo que indique\u003c/text>\n  \u003ctext x=\"492\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Se vuelve\u003c/text>\n  \u003ctext x=\"492\" y=\"184\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">a medir\u003c/text>\n\n  \u003cpath d=\"M 90,232 C 90,250 90,258 90,266 M 546,232 C 546,250 546,258 546,266\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n  \u003cpath d=\"M 90,278 C 240,272 400,272 546,278\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"228\" y=\"308\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">Semanas, no d\u00edas\u003c/text>\n\n  \u003ctext x=\"40\" y=\"72\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Cada tramo suma, y el \u00faltimo es el que m\u00e1s tarda\u003c/text>\n  \u003ctext x=\"40\" y=\"102\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Por eso una fecha cercana no impide estudiar: cambia lo que llega a tiempo.\u003c/text>\n\u003c/svg>", "cronologia-embarazo-temprano": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Un embarazo se puede parar en tres momentos distintos\u003c/title>\n  \u003cdesc>Una l\u00ednea de tiempo desde la transferencia o la regla: primero la beta positiva, que confirma que el embri\u00f3n se agarr\u00f3; despu\u00e9s el saco visible en la ecograf\u00eda; y m\u00e1s tarde el latido. Pararse en el primer punto y pararse en el tercero no son lo mismo, y por eso se cuentan aparte.\u003c/desc>\n\n  \u003cpath d=\"M 60,196 C 200,190 440,190 580,196\" fill=\"none\"\n        stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n\n  \u003ccircle cx=\"110\" cy=\"194\" r=\"13\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.5\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"256\" cy=\"192\" r=\"13\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"402\" cy=\"192\" r=\"13\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"548\" cy=\"194\" r=\"13\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.35\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n\n  \u003ctext x=\"62\" y=\"160\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Transferencia\u003c/text>\n  \u003ctext x=\"62\" y=\"178\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">o falta la regla\u003c/text>\n  \u003ctext x=\"212\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Beta positiva\u003c/text>\n  \u003ctext x=\"358\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Saco en la eco\u003c/text>\n  \u003ctext x=\"504\" y=\"164\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Latido\u003c/text>\n\n  \u003cpath d=\"M 256,214 C 254,236 250,248 246,262\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 402,214 C 400,236 396,248 392,262\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 548,216 C 546,238 542,250 538,264\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n\n  \u003ctext x=\"186\" y=\"288\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Se para aqu\u00ed:\u003c/text>\n  \u003ctext x=\"186\" y=\"306\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">bioqu\u00edmica\u003c/text>\n  \u003ctext x=\"336\" y=\"288\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Se para aqu\u00ed:\u003c/text>\n  \u003ctext x=\"336\" y=\"306\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">p\u00e9rdida cl\u00ednica\u003c/text>\n  \u003ctext x=\"482\" y=\"288\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Se para aqu\u00ed:\u003c/text>\n  \u003ctext x=\"482\" y=\"306\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">m\u00e1s tard\u00eda\u003c/text>\n\n  \u003ctext x=\"40\" y=\"72\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">D\u00f3nde se detuvo importa tanto como cu\u00e1ntas veces\u003c/text>\n  \u003ctext x=\"40\" y=\"102\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Antes de la beta no hay nada que contar: el embri\u00f3n no lleg\u00f3 a agarrarse.\u003c/text>\n\u003c/svg>", "implantacion": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Implantar es agarrarse a la pared de dentro\u003c/title>\n  \u003cdesc>Un corte de la pared del \u00fatero: la capa de dentro, el endometrio, engrosada y con sus vasos, y encima el embri\u00f3n en fase de blastocisto acerc\u00e1ndose y hundi\u00e9ndose en ella. Que se agarre depende del embri\u00f3n y de esa capa, y por eso el estudio mira los dos lados.\u003c/desc>\n\n  \u003cpath d=\"M 40,300 C 160,290 480,290 600,300 L 600,340 L 40,340 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.22\"\n        stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003cpath d=\"M 40,300 C 100,262 180,258 240,272 C 300,286 360,254 420,262 C 480,270 550,288 600,300\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 120,300 C 118,282 130,276 128,266\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.55\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 300,300 C 298,284 310,278 308,270\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.55\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 470,300 C 468,284 480,278 478,268\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.55\" stroke-width=\"2\"/>\n\n  \u003ccircle cx=\"300\" cy=\"196\" r=\"34\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.3\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"288\" cy=\"190\" r=\"13\" fill=\"var(--apoyo-tinta, currentColor)\" fill-opacity=\"0.35\"/>\n  \u003cpath d=\"M 300,238 C 300,252 300,258 300,266\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El embri\u00f3n se agarra a la capa de dentro\u003c/text>\n  \u003ctext x=\"352\" y=\"192\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Embri\u00f3n, cinco o seis d\u00edas\u003c/text>\n  \u003ctext x=\"352\" y=\"212\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">despu\u00e9s de la fecundaci\u00f3n\u003c/text>\n  \u003ctext x=\"40\" y=\"330\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Pared muscular\u003c/text>\n  \u003ctext x=\"428\" y=\"252\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Endometrio\u003c/text>\n\u003c/svg>", "embrion-aspecto-cromosomas": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Dos embriones con el mismo aspecto y distinto contenido\u003c/title>\n  \u003cdesc>Dos embriones que al microscopio se ven igual de bien: la misma forma, el mismo n\u00famero de c\u00e9lulas. Dentro, uno tiene los cromosomas emparejados y el otro tiene un cromosoma de m\u00e1s. La clasificaci\u00f3n del laboratorio describe lo de fuera; lo de dentro solo se sabe si lleg\u00f3 a hacerse el an\u00e1lisis cromos\u00f3mico.\u003c/desc>\n\n  \u003ccircle cx=\"170\" cy=\"170\" r=\"72\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"146\" cy=\"150\" r=\"26\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"196\" cy=\"152\" r=\"24\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"164\" cy=\"200\" r=\"27\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n\n  \u003ccircle cx=\"470\" cy=\"170\" r=\"72\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"446\" cy=\"150\" r=\"26\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"496\" cy=\"152\" r=\"24\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"464\" cy=\"200\" r=\"27\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.2\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n\n  \u003cpath d=\"M 128,268 L 128,306 M 142,268 L 142,306\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 164,272 L 164,302 M 178,272 L 178,302\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 200,268 L 200,306 M 214,268 L 214,306\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n\n  \u003cpath d=\"M 428,268 L 428,306 M 442,268 L 442,306\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 464,272 L 464,302 M 478,272 L 478,302\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 500,268 L 500,306 M 514,268 L 514,306 M 528,270 L 528,304\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Por fuera, el mismo aspecto\u003c/text>\n  \u003ctext x=\"96\" y=\"336\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Cromosomas emparejados\u003c/text>\n  \u003ctext x=\"404\" y=\"336\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Uno de m\u00e1s: no se ve as\u00ed\u003c/text>\n\u003c/svg>", "trombo-vena": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Un trombo tapa la vena por dentro\u003c/title>\n  \u003cdesc>Dos venas de la pierna en corte. En la de la izquierda la sangre pasa. En la de la derecha un co\u00e1gulo la ocupa y la sangre no pasa: eso es una trombosis. Las varices, que se ven abultadas por fuera, son otra cosa y no cuentan como trombosis.\u003c/desc>\n\n  \u003cpath d=\"M 120,60 C 108,140 108,220 120,300\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 176,60 C 188,140 188,220 176,300\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 128,66 C 118,140 118,220 128,294 L 168,294 C 178,220 178,140 168,66 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.22\"/>\n  \u003cpath d=\"M 148,108 C 146,140 150,170 148,200\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 148,214 L 141,198 L 155,198 Z\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.9\"/>\n\n  \u003cpath d=\"M 400,60 C 388,140 388,220 400,300\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 456,60 C 468,140 468,220 456,300\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 408,66 C 398,140 398,220 408,294 L 448,294 C 458,220 458,140 448,66 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.12\"/>\n  \u003cpath d=\"M 400,146 C 418,132 440,136 456,148 C 462,172 460,196 452,216 C 434,228 414,226 400,214 C 394,192 394,168 400,146 Z\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.55\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 428,96 C 426,112 430,120 428,132\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n\n  \u003ctext x=\"86\" y=\"330\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">La sangre pasa\u003c/text>\n  \u003ctext x=\"368\" y=\"330\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">El co\u00e1gulo la ocupa\u003c/text>\n  \u003ctext x=\"40\" y=\"42\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Lo que cuenta como trombosis\u003c/text>\n  \u003ctext x=\"236\" y=\"176\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Una vena\u003c/text>\n  \u003ctext x=\"236\" y=\"196\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">de la pierna,\u003c/text>\n  \u003ctext x=\"236\" y=\"216\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">en corte\u003c/text>\n\u003c/svg>", "autoinmunidad": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Autoinmune es reconocer como ajeno lo que es propio\u003c/title>\n  \u003cdesc>Dos escenas. En la de arriba, la defensa reconoce algo de fuera \u2014un virus\u2014 y lo ataca, que es su trabajo. En la de abajo, la misma defensa se dirige contra una c\u00e9lula del propio cuerpo: eso es una enfermedad autoinmune, y por eso se llaman autoanticuerpos las defensas dirigidas contra lo propio.\u003c/desc>\n\n  \u003cpath d=\"M 96,86 C 96,66 116,56 132,64 C 148,52 172,60 176,80 C 194,86 196,110 180,120 C 168,134 116,134 104,120 C 92,110 92,96 96,86 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.28\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 176,96 C 214,90 246,90 282,96\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"316\" cy=\"96\" r=\"22\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.25\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 302,82 L 330,110 M 330,82 L 302,110\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n\n  \u003cpath d=\"M 96,254 C 96,234 116,224 132,232 C 148,220 172,228 176,248 C 194,254 196,278 180,288 C 168,302 116,302 104,288 C 92,278 92,264 96,254 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.28\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 176,264 C 214,258 246,258 282,264\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"318\" cy=\"264\" r=\"26\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.4\"\n          stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"318\" cy=\"264\" r=\"10\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.5\"/>\n\n  \u003ctext x=\"88\" y=\"46\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">La defensa contra lo de fuera\u003c/text>\n  \u003ctext x=\"360\" y=\"90\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">Un virus: es su trabajo\u003c/text>\n  \u003ctext x=\"88\" y=\"212\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">La misma defensa, contra lo propio\u003c/text>\n  \u003ctext x=\"360\" y=\"252\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Una c\u00e9lula del cuerpo\u003c/text>\n  \u003ctext x=\"360\" y=\"276\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Eso es lo autoinmune\u003c/text>\n\u003c/svg>", "eje-tiroideo": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>La TSH es la orden, no el resultado\u003c/title>\n  \u003cdesc>La hip\u00f3fisis, en el cerebro, manda una orden llamada TSH; la tiroides, en el cuello, responde fabricando hormona. Cuando la tiroides va justa la orden sube para exigirle m\u00e1s, as\u00ed que una TSH alta es se\u00f1al de que va justa, no de que sobre hormona.\u003c/desc>\n\n  \u003cpath d=\"M 150,96 C 130,96 118,112 122,128 C 126,146 148,152 164,144 C 180,136 180,110 164,100 C 160,97 155,96 150,96 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.3\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 150,290 C 122,270 118,238 140,228 C 152,222 166,232 172,244 C 178,232 192,222 204,228 C 226,238 222,270 194,290 C 180,300 164,300 150,290 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.25\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2.5\"/>\n\n  \u003cpath d=\"M 156,158 C 158,180 158,200 160,220\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 210,250 C 250,244 268,220 268,196\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"/>\n\n  \u003ctext x=\"196\" y=\"120\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Hip\u00f3fisis\u003c/text>\n  \u003ctext x=\"176\" y=\"192\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">TSH: la orden\u003c/text>\n  \u003ctext x=\"248\" y=\"284\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">Tiroides\u003c/text>\n  \u003ctext x=\"238\" y=\"236\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">La hormona que fabrica\u003c/text>\n  \u003ctext x=\"360\" y=\"112\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Si la tiroides va justa,\u003c/text>\n  \u003ctext x=\"360\" y=\"136\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">la orden sube para exigirle m\u00e1s.\u003c/text>\n  \u003ctext x=\"360\" y=\"168\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Por eso una TSH alta se\u00f1ala\u003c/text>\n  \u003ctext x=\"360\" y=\"192\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">que falta hormona, no que sobre.\u003c/text>\n\u003c/svg>", "endometriosis-adenomiosis": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Fuera del \u00fatero, o metido en su pared\u003c/title>\n  \u003cdesc>Dos \u00fateros comparados. En el primero, endometriosis: tejido parecido al de dentro del \u00fatero sembrado por fuera, sobre los ovarios y alrededor. En el segundo, adenomiosis: ese mismo tejido metido dentro del m\u00fasculo de la pared, que se engrosa. Se preguntan juntas porque a menudo van de la mano.\u003c/desc>\n\n  \u003cpath d=\"M 90,140 C 84,200 96,248 152,264 C 208,248 220,200 214,140 C 198,128 176,120 152,120 C 128,120 106,128 90,140 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 90,140 C 62,124 42,132 30,148\" fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 214,140 C 242,124 262,132 274,148\" fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"36\" cy=\"176\" rx=\"22\" ry=\"16\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n           stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"1.5\"/>\n  \u003cellipse cx=\"268\" cy=\"176\" rx=\"22\" ry=\"16\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n           stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"1.5\"/>\n  \u003ccircle cx=\"36\" cy=\"176\" r=\"6\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"266\" cy=\"180\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"76\" cy=\"212\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"230\" cy=\"228\" r=\"6\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"152\" cy=\"288\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n\n  \u003cpath d=\"M 410,140 C 404,200 416,248 472,264 C 528,248 540,200 534,140 C 518,128 496,120 472,120 C 448,120 426,128 410,140 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 430,152 C 426,198 436,232 472,244 C 508,232 518,198 514,152 C 500,144 486,140 472,140 C 458,140 444,144 430,152 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.16\" stroke=\"none\"/>\n  \u003ccircle cx=\"424\" cy=\"176\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"520\" cy=\"184\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"446\" cy=\"228\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"500\" cy=\"220\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"472\" cy=\"252\" r=\"5\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n\n  \u003ctext x=\"30\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">El mismo tejido, en dos sitios distintos\u003c/text>\n  \u003ctext x=\"30\" y=\"326\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Endometriosis: por fuera\u003c/text>\n  \u003ctext x=\"410\" y=\"326\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Adenomiosis: en la pared\u003c/text>\n\u003c/svg>", "insulina-resistencia": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>La misma az\u00facar, con mucha m\u00e1s insulina\u003c/title>\n  \u003cdesc>Dos situaciones comparadas. Cuando la c\u00e9lula responde bien, basta un poco de insulina para que entre la glucosa. Cuando responde mal, el p\u00e1ncreas fabrica mucha m\u00e1s insulina para conseguir lo mismo, y por eso el az\u00facar en sangre puede salir normal mientras la insulina est\u00e1 alta.\u003c/desc>\n\n  \u003cpath d=\"M 60,120 C 60,96 84,84 108,90 C 126,72 158,78 166,102 C 190,104 200,128 188,146 C 178,166 100,168 76,152 C 60,142 58,132 60,120 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.2\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"240\" cy=\"118\" r=\"9\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.8\"/>\n  \u003ccircle cx=\"266\" cy=\"132\" r=\"9\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.8\"/>\n  \u003cpath d=\"M 292,124 C 320,120 340,120 366,124\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ccircle cx=\"410\" cy=\"124\" r=\"26\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.25\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n\n  \u003cpath d=\"M 60,266 C 60,242 84,230 108,236 C 126,218 158,224 166,248 C 190,250 200,274 188,292 C 178,312 100,314 76,298 C 60,288 58,278 60,266 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.2\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"228\" cy=\"252\" r=\"9\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"252\" cy=\"270\" r=\"9\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"240\" cy=\"292\" r=\"9\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"272\" cy=\"246\" r=\"9\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"278\" cy=\"286\" r=\"9\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003cpath d=\"M 300,268 C 326,264 344,264 366,268\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ccircle cx=\"410\" cy=\"268\" r=\"26\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.25\"\n          stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Cu\u00e1nta insulina hace falta para lo mismo\u003c/text>\n  \u003ctext x=\"450\" y=\"112\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Entra el az\u00facar\u003c/text>\n  \u003ctext x=\"450\" y=\"132\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Responde bien\u003c/text>\n  \u003ctext x=\"450\" y=\"256\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Entra el az\u00facar\u003c/text>\n  \u003ctext x=\"450\" y=\"276\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Responde mal\u003c/text>\n  \u003ctext x=\"72\" y=\"180\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">P\u00e1ncreas\u003c/text>\n  \u003ctext x=\"40\" y=\"340\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Por eso el az\u00facar puede salir normal mientras la insulina ya est\u00e1 alta.\u003c/text>\n\u003c/svg>", "seminograma-tres-parametros": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Lo que cuenta el seminograma corriente\u003c/title>\n  \u003cdesc>El an\u00e1lisis del semen mira tres cosas: cu\u00e1ntos espermatozoides hay, cu\u00e1ntos se mueven hacia delante y cu\u00e1ntos tienen la forma esperada. Las tres se ven al microscopio y las tres pueden salir dentro de la referencia.\u003c/desc>\n\n  \u003ctext x=\"40\" y=\"58\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Tres cosas, todas visibles al microscopio\u003c/text>\n\n  \u003ccircle cx=\"120\" cy=\"150\" r=\"56\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.22\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ccircle cx=\"104\" cy=\"136\" r=\"7\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"132\" cy=\"128\" r=\"7\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"118\" cy=\"160\" r=\"7\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"146\" cy=\"164\" r=\"7\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ccircle cx=\"96\" cy=\"170\" r=\"7\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.85\"/>\n  \u003ctext x=\"76\" y=\"242\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Cu\u00e1ntos hay\u003c/text>\n\n  \u003ccircle cx=\"320\" cy=\"150\" r=\"56\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.22\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 286,142 C 302,136 318,146 334,140\" fill=\"none\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"340\" cy=\"139\" r=\"6\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.9\"/>\n  \u003cpath d=\"M 288,172 C 304,166 320,176 336,170\" fill=\"none\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ccircle cx=\"342\" cy=\"169\" r=\"6\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.9\"/>\n  \u003ccircle cx=\"306\" cy=\"196\" r=\"6\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.6\"/>\n  \u003ctext x=\"262\" y=\"242\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">C\u00f3mo se mueven\u003c/text>\n\n  \u003ccircle cx=\"520\" cy=\"150\" r=\"56\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.22\"\n          stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"502\" cy=\"140\" rx=\"11\" ry=\"8\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.8\"/>\n  \u003cpath d=\"M 513,140 C 524,136 532,146 542,142\" fill=\"none\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"500\" cy=\"176\" rx=\"14\" ry=\"12\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.7\"/>\n  \u003cpath d=\"M 514,176 C 524,172 530,182 540,178\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ctext x=\"470\" y=\"242\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Qu\u00e9 forma tienen\u003c/text>\n\n  \u003ctext x=\"40\" y=\"298\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Las tres pueden salir dentro de la referencia. Ninguna de las tres mira\u003c/text>\n  \u003ctext x=\"40\" y=\"320\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">si el material gen\u00e9tico de dentro est\u00e1 entero.\u003c/text>\n\u003c/svg>", "espermatozoide-adn": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Nada bien y lleva el material roto\u003c/title>\n  \u003cdesc>Dos espermatozoides dibujados iguales por fuera: la misma cabeza y la misma cola. Dentro, uno lleva la cadena de ADN entera y el otro la lleva partida en trozos. El an\u00e1lisis corriente mira la forma y el movimiento, as\u00ed que los dos pasar\u00edan por normales.\u003c/desc>\n\n  \u003cpath d=\"M 120,140 C 96,140 82,158 82,176 C 82,194 96,212 120,212 C 144,212 158,194 158,176 C 158,158 144,140 120,140 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 158,176 C 200,160 224,196 268,178 C 300,166 318,190 344,180\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 100,166 C 112,172 128,160 140,168\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 100,186 C 112,192 128,180 140,188\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"3\"/>\n\n  \u003cpath d=\"M 120,268 C 96,268 82,286 82,304 C 82,322 96,340 120,340 C 144,340 158,322 158,304 C 158,286 144,268 120,268 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 158,304 C 200,288 224,324 268,306 C 300,294 318,318 344,308\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 100,294 C 106,297 110,292 114,295\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 126,292 C 132,296 136,290 142,294\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 98,314 C 104,318 110,312 116,316\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 130,316 C 136,320 140,314 144,317\" fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"3\"/>\n\n  \u003ctext x=\"40\" y=\"60\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Por fuera, los dos son iguales\u003c/text>\n  \u003ctext x=\"40\" y=\"96\" font-size=\"15\" fill=\"var(--apoyo-tenue, currentColor)\">El an\u00e1lisis corriente cuenta cu\u00e1ntos hay, c\u00f3mo se mueven y qu\u00e9 forma tienen.\u003c/text>\n  \u003ctext x=\"380\" y=\"172\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">ADN entero\u003c/text>\n  \u003ctext x=\"380\" y=\"300\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">ADN partido en trozos\u003c/text>\n  \u003ctext x=\"380\" y=\"324\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Se mide aparte, no en el seminograma\u003c/text>\n\u003c/svg>", "utero-trompas-ovarios": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Las tres piezas: \u00fatero, trompas y ovarios\u003c/title>\n  \u003cdesc>El \u00fatero en el centro, con su cavidad hueca dentro y la pared muscular alrededor; de cada esquina superior sale una trompa que termina abrazando un ovario. El \u00f3vulo sale del ovario, se encuentra con el espermatozoide dentro de la trompa y el embri\u00f3n baja hasta la cavidad para implantarse.\u003c/desc>\n\n  \u003cpath d=\"M 250,120 C 244,190 258,250 320,268 C 382,250 396,190 390,120 C 372,104 348,96 320,96 C 292,96 268,104 250,120 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 274,126 C 270,186 282,232 320,246 C 358,232 370,186 366,126 C 350,116 336,112 320,112 C 304,112 290,116 274,126 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.22\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 306,268 C 306,290 306,300 306,312 L 334,312 C 334,300 334,290 334,268\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n\n  \u003cpath d=\"M 250,120 C 210,96 176,110 150,138\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 390,120 C 430,96 464,110 490,138\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 150,138 C 138,150 136,166 142,178\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.55\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 490,138 C 502,150 504,166 498,178\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.55\" stroke-width=\"2.5\"/>\n\n  \u003cellipse cx=\"120\" cy=\"176\" rx=\"34\" ry=\"24\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n           stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"520\" cy=\"176\" rx=\"34\" ry=\"24\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.25\"\n           stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ccircle cx=\"110\" cy=\"172\" r=\"5\" fill=\"var(--apoyo-tenue, currentColor)\"/>\n  \u003ccircle cx=\"128\" cy=\"184\" r=\"4\" fill=\"var(--apoyo-tenue, currentColor)\"/>\n  \u003ccircle cx=\"512\" cy=\"184\" r=\"5\" fill=\"var(--apoyo-tenue, currentColor)\"/>\n  \u003ccircle cx=\"530\" cy=\"170\" r=\"4\" fill=\"var(--apoyo-tenue, currentColor)\"/>\n\n  \u003ctext x=\"60\" y=\"228\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Ovario\u003c/text>\n  \u003ctext x=\"150\" y=\"118\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Trompa\u003c/text>\n  \u003ctext x=\"284\" y=\"180\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Cavidad\u003c/text>\n  \u003ctext x=\"286\" y=\"340\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Cuello\u003c/text>\n  \u003ctext x=\"440\" y=\"118\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Trompa\u003c/text>\n  \u003ctext x=\"500\" y=\"228\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Ovario\u003c/text>\n\u003c/svg>", "eco-3d-suero": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>No todas las ecograf\u00edas ven lo mismo\u003c/title>\n  \u003cdesc>El mismo \u00fatero mirado de tres maneras. La corriente ve bien el grosor de dentro y los ovarios. La 3D reconstruye el \u00fatero visto de frente, que es como se distingue su forma. Con suero se separan las paredes y se ve lo que sobresale dentro.\u003c/desc>\n\n  \u003ctext x=\"32\" y=\"40\" font-size=\"16\" fill=\"var(--apoyo-tenue, currentColor)\">La misma ecograf\u00eda, hecha de tres maneras.\u003c/text>\n\n  \u003cg transform=\"translate(118,150) scale(0.5)\">\n    \u003cpath d=\"M -66,-66 C -66,-90 -38,-96 0,-96 C 38,-96 66,-90 66,-66 L 38,54 C 34,74 20,84 0,84 C -20,84 -34,74 -38,54 Z\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"3\"/>\n    \u003cpath d=\"M -40,-58 L 40,-58 L 7,42 L -7,42 Z\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.3\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"2\"/>\n    \u003cpath d=\"M -21,-2 H 21\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n    \u003cellipse cx=\"-92\" cy=\"-26\" rx=\"17\" ry=\"11\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"3\"/>\n    \u003cellipse cx=\"92\" cy=\"-26\" rx=\"17\" ry=\"11\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"3\"/>\n  \u003c/g>\n  \u003ctext x=\"118\" y=\"238\" font-size=\"15\" text-anchor=\"middle\" fill=\"var(--apoyo-tinta, currentColor)\">Corriente\u003c/text>\n  \u003ctext x=\"118\" y=\"262\" font-size=\"13\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">Ve el grosor de dentro\u003c/text>\n  \u003ctext x=\"118\" y=\"280\" font-size=\"13\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">y los ovarios\u003c/text>\n\n  \u003cg transform=\"translate(320,150) scale(0.5)\">\n    \u003cpath d=\"M -66,-66 C -66,-90 -38,-96 0,-96 C 38,-96 66,-90 66,-66 L 38,54 C 34,74 20,84 0,84 C -20,84 -34,74 -38,54 Z\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"3\"/>\n    \u003cpath d=\"M -40,-58 L 40,-58 L 7,42 L -7,42 Z\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.3\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"2\"/>\n    \u003cpath d=\"M -62,-70 C -46,-92 -18,-100 0,-100 C 18,-100 46,-92 62,-70\" fill=\"none\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-width=\"4\" stroke-dasharray=\"8 6\"/>\n  \u003c/g>\n  \u003ctext x=\"320\" y=\"238\" font-size=\"15\" text-anchor=\"middle\" fill=\"var(--apoyo-tinta, currentColor)\">En 3D\u003c/text>\n  \u003ctext x=\"320\" y=\"262\" font-size=\"13\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">Distingue la forma\u003c/text>\n  \u003ctext x=\"320\" y=\"280\" font-size=\"13\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">del \u00fatero\u003c/text>\n\n  \u003cg transform=\"translate(522,150) scale(0.5)\">\n    \u003cpath d=\"M -66,-66 C -66,-90 -38,-96 0,-96 C 38,-96 66,-90 66,-66 L 38,54 C 34,74 20,84 0,84 C -20,84 -34,74 -38,54 Z\" fill=\"none\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-width=\"3\"/>\n    \u003cpath d=\"M -46,-58 L 46,-58 L 9,42 L -9,42 Z\" fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.5\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-width=\"2\"/>\n    \u003ccircle cx=\"-19\" cy=\"-28\" r=\"11\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.55\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-width=\"3\"/>\n  \u003c/g>\n  \u003ctext x=\"522\" y=\"238\" font-size=\"15\" text-anchor=\"middle\" fill=\"var(--apoyo-tinta, currentColor)\">Con suero\u003c/text>\n  \u003ctext x=\"522\" y=\"262\" font-size=\"13\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">Ense\u00f1a lo que\u003c/text>\n  \u003ctext x=\"522\" y=\"280\" font-size=\"13\" text-anchor=\"middle\" fill=\"var(--apoyo-tenue, currentColor)\">sobresale dentro\u003c/text>\n\n  \u003ctext x=\"32\" y=\"332\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Por eso importa qu\u00e9 t\u00e9cnica se us\u00f3, no solo cu\u00e1ndo.\u003c/text>\n\u003c/svg>", "hallazgos-cavidad": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Lo que ocupa la cavidad y lo que est\u00e1 en la pared\u003c/title>\n  \u003cdesc>Tres \u00fateros en fila. En el primero, un p\u00f3lipo colgando dentro de la cavidad. En el segundo, un mioma metido en el m\u00fasculo de la pared. En el tercero, otro mioma que asoma hacia dentro y deforma la cavidad. Lo que decide si hay que hacer algo no es el tama\u00f1o, sino si ocupa o deforma el hueco donde tiene que implantar el embri\u00f3n.\u003c/desc>\n\n  \u003cpath d=\"M 60,132 C 54,190 66,238 122,254 C 178,238 190,190 184,132 C 168,120 146,112 122,112 C 98,112 76,120 60,132 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 80,142 C 76,192 86,228 122,240 C 158,228 168,192 164,142 C 150,134 136,130 122,130 C 108,130 94,134 80,142 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.18\" stroke=\"none\"/>\n  \u003cpath d=\"M 122,142 C 132,158 140,168 134,182 C 128,196 112,194 110,180 C 108,166 116,156 122,142 Z\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.6\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"1.5\"/>\n\n  \u003cpath d=\"M 258,132 C 252,190 264,238 320,254 C 376,238 388,190 382,132 C 366,120 344,112 320,112 C 296,112 274,120 258,132 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 278,142 C 274,192 284,228 320,240 C 356,228 366,192 362,142 C 348,134 334,130 320,130 C 306,130 292,134 278,142 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.18\" stroke=\"none\"/>\n  \u003ccircle cx=\"272\" cy=\"184\" r=\"17\" fill=\"var(--apoyo-tenue, currentColor)\" fill-opacity=\"0.6\"\n          stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n\n  \u003cpath d=\"M 456,132 C 450,190 462,238 518,254 C 574,238 586,190 580,132 C 564,120 542,112 518,112 C 494,112 472,120 456,132 Z\"\n        fill=\"var(--apoyo-suave, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 476,142 C 472,192 482,228 518,240 C 554,228 564,192 560,142 C 546,134 532,130 518,130 C 504,130 490,134 476,142 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.18\" stroke=\"none\"/>\n  \u003ccircle cx=\"494\" cy=\"180\" r=\"19\" fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.55\"\n          stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"1.5\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Lo que importa es si ocupa o deforma el hueco\u003c/text>\n  \u003ctext x=\"60\" y=\"290\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">P\u00f3lipo dentro\u003c/text>\n  \u003ctext x=\"60\" y=\"310\" font-size=\"13\" fill=\"var(--apoyo-tenue, currentColor)\">ocupa la cavidad\u003c/text>\n  \u003ctext x=\"258\" y=\"290\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Mioma en la pared\u003c/text>\n  \u003ctext x=\"258\" y=\"310\" font-size=\"13\" fill=\"var(--apoyo-tenue, currentColor)\">sin tocar la cavidad\u003c/text>\n  \u003ctext x=\"456\" y=\"290\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Mioma que asoma\u003c/text>\n  \u003ctext x=\"456\" y=\"310\" font-size=\"13\" fill=\"var(--apoyo-alerta, currentColor)\">deforma la cavidad\u003c/text>\n\u003c/svg>", "endometrio-forro": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Lo que sale cada mes es el forro de dentro del \u00fatero\u003c/title>\n  \u003cdesc>La capa que recubre la cavidad del \u00fatero engorda durante el ciclo y, si no hay embarazo, se desprende y sale: eso es la regla. Cu\u00e1nta sale y durante cu\u00e1ntos d\u00edas depende de esa capa y de lo que ocupe la cavidad, y por eso la regla informa de lo que la imagen de un d\u00eda concreto no ve.\u003c/desc>\n\n  \u003cpath d=\"M 130,80 C 96,120 92,196 120,264 C 140,300 176,308 200,278 C 216,258 216,220 200,190 C 190,168 190,120 176,86 Z\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 142,96 C 116,132 114,192 136,250 C 148,278 172,284 188,264 C 200,248 200,220 188,196 C 178,176 178,126 166,100 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.3\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2\"/>\n  \u003ctext x=\"96\" y=\"330\" font-size=\"15\" fill=\"var(--apoyo-acento, currentColor)\">La capa engorda\u003c/text>\n\n  \u003cpath d=\"M 400,80 C 366,120 362,196 390,264 C 410,300 446,308 470,278 C 486,258 486,220 470,190 C 460,168 460,120 446,86 Z\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 414,94 C 392,132 390,192 408,248 C 418,272 440,278 454,260 C 464,246 464,220 454,198 C 446,180 446,126 436,98 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.1\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.4\" stroke-width=\"1.5\"/>\n  \u003cpath d=\"M 428,286 C 426,300 430,312 428,326 M 442,290 C 440,302 444,312 442,324\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n  \u003ctext x=\"366\" y=\"330\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Y se desprende\u003c/text>\n\n  \u003ctext x=\"40\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">La imagen dice c\u00f3mo es un d\u00eda; la regla, qu\u00e9 pasa todos los meses\u003c/text>\n  \u003ctext x=\"256\" y=\"180\" font-size=\"26\" fill=\"var(--apoyo-tenue, currentColor)\">\u2192\u003c/text>\n\u003c/svg>", "ciclo-hormonal": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>El ciclo en dos mitades y un pico en medio\u003c/title>\n  \u003cdesc>Dos curvas sobre los d\u00edas del ciclo. La primera mitad la lleva el estradiol, que sube mientras el fol\u00edculo crece; a mitad de ciclo hay un pico de LH que dispara la ovulaci\u00f3n; en la segunda mitad sube la progesterona, que es la que prepara el endometrio. Por eso cada hormona se mide en el d\u00eda que le corresponde y no en cualquiera.\u003c/desc>\n\n  \u003cpath d=\"M 60,300 L 600,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003cpath d=\"M 60,300 L 60,70\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n  \u003cpath d=\"M 330,80 L 330,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.35\" stroke-width=\"1.5\" stroke-dasharray=\"4 6\"/>\n\n  \u003cpath d=\"M 60,286 C 140,278 220,220 300,150 C 312,140 318,140 330,150 C 350,180 380,236 420,254\"\n        fill=\"none\" stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 330,300 C 300,296 316,150 330,132 C 344,150 360,296 330,300 Z\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.35\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 330,296 C 400,290 430,150 470,140 C 520,132 560,240 600,286\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/>\n\n  \u003ctext x=\"60\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Cada hormona tiene su d\u00eda\u003c/text>\n  \u003ctext x=\"72\" y=\"196\" font-size=\"14\" fill=\"var(--apoyo-acento, currentColor)\">Estradiol\u003c/text>\n  \u003ctext x=\"286\" y=\"110\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">Pico de LH\u003c/text>\n  \u003ctext x=\"470\" y=\"120\" font-size=\"14\" fill=\"var(--apoyo-tinta, currentColor)\">Progesterona\u003c/text>\n  \u003ctext x=\"60\" y=\"326\" font-size=\"13\" fill=\"var(--apoyo-tenue, currentColor)\">D\u00eda 1 \u00b7 la regla\u003c/text>\n  \u003ctext x=\"288\" y=\"326\" font-size=\"13\" fill=\"var(--apoyo-tenue, currentColor)\">Ovulaci\u00f3n\u003c/text>\n  \u003ctext x=\"516\" y=\"326\" font-size=\"13\" fill=\"var(--apoyo-tenue, currentColor)\">Siguiente regla\u003c/text>\n\u003c/svg>", "sinequias-utero": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Tras un raspado, las paredes de la cavidad pueden quedar pegadas\u003c/title>\n  \u003cdesc>La cavidad del \u00fatero vista de frente: a la izquierda abierta, con sus dos paredes separadas; a la derecha, unidas por bandas de tejido. Cuando eso pasa queda menos superficie que sangre, y la regla puede acortarse o casi desaparecer.\u003c/desc>\n\n  \u003cpath d=\"M 90,90 C 150,80 210,80 270,90 C 250,150 232,210 200,268 C 180,290 160,290 140,268 C 116,210 104,150 90,90 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.18\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"96\" y=\"322\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Cavidad abierta\u003c/text>\n\n  \u003cpath d=\"M 380,90 C 440,80 500,80 560,90 C 540,150 522,210 490,268 C 470,290 450,290 430,268 C 406,210 394,150 380,90 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.1\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 404,128 C 440,120 480,120 520,128 M 414,166 C 446,158 486,158 512,166 M 428,208 C 456,200 484,200 500,208\"\n        fill=\"none\" stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.85\" stroke-width=\"3\"/>\n  \u003ctext x=\"378\" y=\"322\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Bandas que pegan las paredes\u003c/text>\n\n  \u003ctext x=\"40\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Menos superficie que sangre: la regla se acorta\u003c/text>\n\u003c/svg>", "nicho-cesarea": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Donde estuvo la sutura de la ces\u00e1rea queda a veces un escal\u00f3n\u003c/title>\n  \u003cdesc>Corte de la parte baja del \u00fatero. En la pared, donde se cerr\u00f3 la ces\u00e1rea, queda a veces un peque\u00f1o hueco en el que se recoge algo de sangre de la regla y va saliendo los d\u00edas siguientes: de ah\u00ed el manchado marr\u00f3n cuando la regla ya se daba por terminada.\u003c/desc>\n\n  \u003cpath d=\"M 180,60 C 130,120 126,230 170,300 C 200,340 260,346 300,312 C 330,286 336,232 320,190 C 306,152 306,104 292,66 Z\"\n        fill=\"none\" stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 196,80 C 154,134 150,228 188,286 C 212,318 258,322 288,296 C 312,274 316,232 302,196 C 290,166 290,116 278,84 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.16\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"/>\n\n  \u003cpath d=\"M 176,246 C 196,240 206,252 210,264 C 200,276 184,276 172,266 Z\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.5\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 210,264 C 244,266 268,272 288,282\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.6\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n\n  \u003ctext x=\"360\" y=\"238\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">El escal\u00f3n de la cicatriz\u003c/text>\n  \u003ctext x=\"360\" y=\"262\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Recoge algo de sangre y la suelta\u003c/text>\n  \u003ctext x=\"360\" y=\"284\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">los d\u00edas siguientes\u003c/text>\n  \u003ctext x=\"40\" y=\"46\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">La parte baja del \u00fatero, en corte\u003c/text>\n\u003c/svg>", "hsg-trompas": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Se mete un l\u00edquido y se mira por d\u00f3nde sale\u003c/title>\n  \u003cdesc>La prueba de las trompas por dentro: se introduce un l\u00edquido que se ve en la imagen a trav\u00e9s del cuello del \u00fatero, llena la cavidad y, si las trompas est\u00e1n abiertas, sale por los extremos y se derrama. Si una est\u00e1 cerrada, el l\u00edquido se queda dentro y no llega a salir por ese lado.\u003c/desc>\n\n  \u003cpath d=\"M 250,150 C 244,214 258,268 320,286 C 382,268 396,214 390,150 C 372,136 348,128 320,128 C 292,128 268,136 250,150 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.3\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.75\" stroke-width=\"2.5\"/>\n  \u003cpath d=\"M 250,150 C 208,128 172,142 146,168\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 130,182 C 118,196 112,206 108,218\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  \u003ccircle cx=\"98\" cy=\"238\" r=\"7\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.8\"/>\n  \u003ccircle cx=\"112\" cy=\"256\" r=\"5\" fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.6\"/>\n\n  \u003cpath d=\"M 390,150 C 432,128 468,142 494,168\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M 508,180 C 520,192 526,204 528,216\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"4 7\"/>\n  \u003cpath d=\"M 494,168 C 502,176 506,180 510,184\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"4\"/>\n  \u003cpath d=\"M 510,168 C 502,176 498,180 494,184\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.95\" stroke-width=\"4\"/>\n\n  \u003cpath d=\"M 306,286 C 306,308 306,318 306,330\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"6\"/>\n\n  \u003ctext x=\"40\" y=\"56\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Si sale por los dos lados, est\u00e1n abiertas\u003c/text>\n  \u003ctext x=\"40\" y=\"288\" font-size=\"14\" fill=\"var(--apoyo-acento, currentColor)\">Pasa y se derrama\u003c/text>\n  \u003ctext x=\"482\" y=\"288\" font-size=\"14\" fill=\"var(--apoyo-alerta, currentColor)\">No pasa\u003c/text>\n  \u003ctext x=\"232\" y=\"350\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">Por aqu\u00ed entra el l\u00edquido\u003c/text>\n\u003c/svg>", "hidrosalpinx": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Una trompa cerrada en la punta se llena de l\u00edquido\u003c/title>\n  \u003cdesc>Dos trompas junto al \u00fatero. La de la izquierda est\u00e1 abierta en su extremo; la de la derecha se ha cerrado y se ensancha como una bolsa con l\u00edquido dentro. Lo que importa no es la bolsa: es que ese l\u00edquido puede pasar a la cavidad del \u00fatero, que es donde tendr\u00eda que agarrarse el embri\u00f3n.\u003c/desc>\n\n  \u003cpath d=\"M 280,150 C 268,196 268,240 282,286 C 300,314 340,314 358,286 C 372,240 372,196 360,150 Z\"\n        fill=\"var(--apoyo-acento, currentColor)\" fill-opacity=\"0.14\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2.5\"/>\n\n  \u003cpath d=\"M 280,158 C 232,138 190,132 150,140\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"4\"/>\n  \u003cpath d=\"M 150,140 C 132,132 118,136 108,146 M 150,140 C 136,148 130,158 130,168\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"86\" y=\"196\" font-size=\"15\" fill=\"var(--apoyo-tinta, currentColor)\">Abierta\u003c/text>\n\n  \u003cpath d=\"M 360,158 C 404,140 440,136 468,142\" fill=\"none\"\n        stroke=\"var(--apoyo-tinta, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"4\"/>\n  \u003cpath d=\"M 468,142 C 500,126 546,140 552,172 C 558,204 520,222 492,206 C 470,194 462,166 468,142 Z\"\n        fill=\"var(--apoyo-alerta, currentColor)\" fill-opacity=\"0.35\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"2.5\"/>\n  \u003ctext x=\"470\" y=\"252\" font-size=\"15\" fill=\"var(--apoyo-alerta, currentColor)\">Cerrada y llena\u003c/text>\n\n  \u003cpath d=\"M 400,166 C 380,178 356,188 336,196\" fill=\"none\"\n        stroke=\"var(--apoyo-alerta, currentColor)\" stroke-opacity=\"0.7\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"/>\n  \u003ctext x=\"252\" y=\"336\" font-size=\"14\" fill=\"var(--apoyo-tenue, currentColor)\">El l\u00edquido puede pasar a la cavidad\u003c/text>\n  \u003ctext x=\"40\" y=\"52\" font-size=\"17\" fill=\"var(--apoyo-tinta, currentColor)\">Hidros\u00e1lpinx\u003c/text>\n\u003c/svg>", "anticonceptivo-tapa": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 360\" role=\"img\" font-family=\"inherit\">\n  \u003ctitle>Mientras se usa, el eje queda en pausa y no se ve el ciclo propio\u003c/title>\n  \u003cdesc>La onda del ciclo propio queda plana mientras se usa un anticonceptivo hormonal: el sangrado que se ve es el del m\u00e9todo. Al dejarlo la onda vuelve, y por eso los primeros meses todav\u00eda no informan de c\u00f3mo es ese ciclo. No deja da\u00f1o detr\u00e1s: solo impide verlo mientras se usa.\u003c/desc>\n\n  \u003cpath d=\"M 70,300 L 570,300\" stroke=\"var(--apoyo-linea, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"2\"/>\n  \u003cpath d=\"M 70,180 C 100,110 130,250 160,180 C 190,110 220,250 250,180\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.9\" stroke-width=\"3\"/>\n  \u003cpath d=\"M 250,180 L 420,180\" fill=\"none\"\n        stroke=\"var(--apoyo-tenue, currentColor)\" stroke-opacity=\"0.8\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\n  \u003cpath d=\"M 420,180 C 450,112 480,248 510,180 C 528,144 542,158 560,172\" fill=\"none\"\n        stroke=\"var(--apoyo-acento, currentColor)\" stroke-opacity=\"0.5\" stroke-width=\"3\"/>\
